name: CI

# 触发策略刻意保守：私有仓库的 Windows runner 按 2 倍分钟计费，
# 所以只在推送到 main、打 tag、发 PR 时跑，不做每次提交都跑。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-plugins:
    name: 校验工具包清单
    # 清单校验只是 Python，放 Linux 跑（私有仓库 Windows runner 按 2 倍计费）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: 校验所有工具包清单
        run: uv run --with pyyaml --with jsonschema python scripts/validate-plugins.py

      - name: 确认机读文件是合法 JSON
        run: |
          python3 - <<'PY'
          import json, pathlib

          # 校验仓库里**所有** JSON（规范 schema、我们提取的事实性数据等）。
          # 注意：不要在这里引用仓库之外的路径——宿主的状态文件在本机专属库里，CI 上没有它。
          skip = {".git", "bin", "obj", "node_modules", "dist"}
          targets = sorted(
              p for p in pathlib.Path(".").rglob("*.json")
              if not (skip & set(p.parts))
          )

          for path in targets:
              json.loads(path.read_text(encoding="utf-8"))
              print(f"OK  {path}")

          print(f"共 {len(targets)} 个 JSON 文件都是合法的")
          PY
  build-and-test:
    name: 编译与测试（Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 编译核心库与测试
        # 注意：这里只编译 src/AllTool.slnx，暂不含 WinUI 应用项目。
        # WinUI 3 项目需要 Windows App SDK 与 Windows SDK，等它建好并本地验证通过后再纳入。
        run: dotnet build src/AllTool.slnx -c Release --nologo

      - name: 运行单元测试
        run: dotnet test src/AllTool.slnx -c Release --no-build --nologo
