name: CI

# 触发策略刻意保守：私有仓库的 Windows runner 按 2 倍分钟计费，
# 所以只在推送到 main、打 tag、发 PR 时跑，不做每次提交都跑。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-plugins:
    name: 校验工具包清单
    # 清单校验只是 Python，放 Linux 跑（私有仓库 Windows runner 按 2 倍计费）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: 校验所有工具包清单
        run: uv run --with pyyaml --with jsonschema python scripts/validate-plugins.py

      - name: 确认机读文件是合法 JSON
        run: |
          python3 - <<'PY'
          import json, pathlib
          for path in ["docs/spec/manifest-v1.schema.json", "docs/ai/project-state.json"]:
              json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
              print(f"OK  {path}")
          PY

  build-and-test:
    name: 编译与测试（Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 编译核心库与测试
        # 注意：这里只编译 src/AllTool.slnx，暂不含 WinUI 应用项目。
        # WinUI 3 项目需要 Windows App SDK 与 Windows SDK，等它建好并本地验证通过后再纳入。
        run: dotnet build src/AllTool.slnx -c Release --nologo

      - name: 运行单元测试
        run: dotnet test src/AllTool.slnx -c Release --no-build --nologo
