# yaml-language-server: $schema=../../docs/spec/manifest-v1.schema.json
#
# OpenSSH 客户端工具包（Windows 自带）。
#
# 参数知识来源（每个动作的 sources 里逐条标注）：
#   1. OpenSSH 官方手册页（man.openbsd.org）—— ssh(1) / scp(1) / ssh-keygen(1)；
#   2. Microsoft Learn 的 Windows OpenSSH 页（安装、自带组件、版本说明）；
#   3. 本机 C:\Windows\System32\OpenSSH\*.exe 的 use 输出（`-h` / `-?`，快照见 NOTES）。
# 只收录「官方手册页」与「本机 usage 行」**都能对应上**的开关；两处对不上的写进 NOTES §6。
#
# 实测决定的三件事（完整证据见 NOTES.md）：
#   * runtime.encoding = utf-8：ssh-keygen -l -f 读到密钥里的 UTF-8 注释时按**原字节**输出，
#     实测中文注释的字节是 e4 b8 ad e6 96 87 …（合法 UTF-8），不是 cp936。
#   * 字段风格：ssh 的 -p / -l 与 scp 的 -P / -l 两种写法都试过，单 token 与双 token **都认**；
#     ssh-keygen 的 -N 是**唯一只认双 token** 的（`-N-f` → Too many arguments，退出码 1），
#     所以 -N 用 separate；-o 的值是 Key=Value、写成两个 token 更清楚，也用 separate。
#   * 字段顺序：**所有开关字段必须声明在位置参数（destination / host / source / target / 密钥文件）之前**。
#     依据是手册页（第一个非开关参数之后的内容一律作为远端命令）；本机实测只证明顺序两种写法
#     都仍会去连指定端口，没能走到认证之后，故"静默错传"这一条以手册页为准（见 NOTES §8.1）。

spec: 1
id: openssh
name: OpenSSH 客户端
manifestVersion: 0.1.0
kind: system
appVersion: "9.5p2（本机 ssh -V 实测；文件版本 9.5.5.1）"
summary: 远程登录与安全文件复制
description: >-
  Windows 自带的 OpenSSH 客户端（Windows 10 1809 起为系统可选功能，本机位于
  C:\Windows\System32\OpenSSH\）。本包覆盖同目录下的 ssh.exe、ssh-keygen.exe 与 scp.exe。
  连接与复制类动作**会在真终端里打开**，因为 ssh 与 scp 需要交互输入密码、
  确认主机指纹或进入交互式 shell，宿主捕获输出的方式用不了。
homepage: https://man.openbsd.org/ssh
license: OpenSSH（BSD 风格，见 C:\Windows\System32\OpenSSH\LICENSE.txt）
tags: [系统自带, 远程连接, SSH, 文件传输]

quickActions:
  - title: 查看版本
    action: version
  - title: 查看 ssh 支持哪些算法
    action: algorithms
  - title: 生成密钥对
    action: keygen-generate

locate:
  # 一个包只能有一个主可执行文件（locate 是包级、动作级没有覆盖键），主用 ssh.exe。
  executable: ssh.exe
  # 同族的其余可执行文件放这里：当目标机器上 ssh.exe 缺失/被移出 PATH 时，
  # 宿主会退而求其次挑 ssh-keygen.exe 或 scp.exe —— 被挑中的那个决定了哪些动作还能跑。
  # 实测本机三个都在 PATH 里，走的是 ssh.exe。
  alternativeNames:
    - ssh-keygen.exe
    - scp.exe
  searchPaths:
    - ${SystemRoot}\System32\OpenSSH
  # 实测：ssh -V 把版本写**stderr**（stdout 0 字节），退出码 0。
  # 注意 ssh-keygen -V 是「证书有效期」不是版本；ssh-add / scp 没有版本开关。
  versionArgs: ["-V"]
  # 实测匹配：OpenSSH_for_Windows_9.5p2, LibreSSL 3.8.2 -> 捕获组 9.5
  versionPattern: '(?m)OpenSSH_for_Windows_([0-9]+\.[0-9]+)'
  minVersion: "8.0"
  notFoundHint: >-
    找不到 ssh.exe。Windows 10 1809 / Windows Server 2019 起 OpenSSH 客户端是系统可选功能：
    在「设置 → 系统 → 可选功能」里添加，或管理员 PowerShell 里执行
    Add-WindowsCapability -Online -Name OpenSSH.Client~~~~0.0.1.0。

runtime:
  # 实测见 NOTES §3：key 文件里的 UTF-8 注释被原字节输出（e4 b8 ad … 合法 UTF-8）。
  encoding: utf-8
  # ssh 会等密码、等指纹确认、进交互式 shell，故不设超时。
  timeoutSeconds: 0

# 实测（2026-09-30，本机非管理员账号）：
#   ssh -V                        -> 0
#   ssh -Q cipher | help | key    -> 0
#   ssh -G localhost              -> 0
#   ssh -G（缺 destination）      -> 255
#   ssh -o NoSuchOption=1 host    -> 255（Bad configuration option）
#   ssh -p notanumber host        -> 255（Bad port）
#   scp（缺参数）/ scp onefile    -> 1
#   scp 连不通的 192.0.2.1        -> 255
#   ssh-keygen 成功生成密钥        -> 0
#   ssh-keygen -t bogustype       -> 255
#   ssh-keygen -l -f 不存在的文件  -> 255
# 官方文档给的语义：ssh「退回到远端命令的退出码，出错时 255」；scp「成功 0，出错 >0」。
exitCodes:
  - { code: 0,   meaning: "成功。注意 ssh 连接远端时，本码其实是**远端命令**的退出码。", severity: ok }
  - { code: 1,   meaning: "scp 参数不合法或用法错误（实测缺参数 / 只给一个路径）。", severity: error }
  - { code: 255, meaning: "ssh / scp / ssh-keygen 出错（官方文档：ssh 出错时返回 255）。实测覆盖缺 destination、端口非法、配置项不存在、未知密钥类型、密钥文件读不到、连不通主机。", severity: error }

actions:

  # ==================================================== 查看（本地，纯只读）

  - id: version
    category: 查看
    title: 查看 OpenSSH 版本
    description: >-
      打印本机 OpenSSH 客户端版本（ssh -V，写入 **stderr**，退出码 0）。
      界面上的工具包版本号就是用这条命令取的。
    command: ""
    commandArgs: ["-V"]
    fields: []
    output:
      mode: capture
      showCommandLine: true
    sources:
      - title: OpenSSH 手册页 ssh(1) —— -V
        url: https://man.openbsd.org/ssh
        retrieved: "2026-09-30"
        appliesTo: OpenSSH 9.5p2（本机实测）
        note: "手册页原文：-V —— Display the version number and exit。本机实测输出 OpenSSH_for_Windows_9.5p2, LibreSSL 3.8.2，走 stderr，stdout 0 字节，退出码 0。"
      - title: Microsoft Learn —— OpenSSH for Windows 概览
        url: https://learn.microsoft.com/en-us/windows-server/administration/openssh/openssh-overview
        retrieved: "2026-09-30"
        note: "说明 Windows 10 1809 起 OpenSSH 客户端为系统可选功能，可执行文件位于 %SystemRoot%\\System32\\OpenSSH。"
    examples:
      - { title: "打印版本", args: ["-V"], expectExitCode: 0 }

  - id: config-dump
    category: 配置
    title: 解析并打印最终生效的配置
    description: >-
      按 ssh_config 的规则（含 Host / Match 块）算出这个目标最终会用哪些配置项，逐条打印后退出，
      **完全不发起网络连接**。查"为什么它连的不是我以为的端口/用户/密钥"就用这条。
    command: ""
    commandArgs: ["-G"]
    fields:
      - id: configFile
        label: 配置文件
        type: text
        style: attached
        prefix: "-F"
        required: false
        placeholder: "C:\\Users\\you\\.ssh\\config"
        help: 指定替代的用户配置文件（写了它，系统级 ssh_config 会被忽略）；填 none 表示不读任何配置文件。
        doc: "ssh(1) -F configfile"
      - id: port
        label: 端口
        type: number
        style: attached
        prefix: "-p"
        required: false
        placeholder: "22"
        doc: "ssh(1) -p port"
      - id: user
        label: 登录用户
        type: text
        style: attached
        prefix: "-l"
        required: false
        placeholder: "root"
        save: true
        doc: "ssh(1) -l login_name"
      - id: identityFile
        label: 身份（私钥）文件
        type: file
        style: attached
        prefix: "-i"
        required: false
        help: 可以填写多个 -i 字段来指定多个身份文件。
        doc: "ssh(1) -i identity_file"
      - id: option
        label: 配置项（-o）
        type: text
        style: separate
        prefix: "-o"
        required: false
        placeholder: "Port=2222"
        help: 形如 Key=Value 的 ssh_config 配置项。需要多个就再加一个本字段。
        doc: "ssh(1) -o option；可选名与取值见 ssh_config(5)"
      - id: destination
        label: 目标主机
        type: text
        style: positional
        required: true
        placeholder: "example.com"
        help: 必填。可以是主机名、IP，或 user@hostname 形式。**必须声明在所有开关之后**：手册页写明第一个非开关参数之后的内容会被当成远端命令，所以 `ssh 主机 -p 2222` 里的 -p 会被送去远端，而不是当端口用。
        doc: "ssh(1) 语法行 destination [command [argument ...]]；DESCRIPTION 一节说明第一个非开关参数之后的内容一律作为远端命令；另见 -G 一节：求值 Host / Match 块后打印配置并退出"
    output:
      mode: stream
      showCommandLine: true
    sources:
      - title: OpenSSH 手册页 ssh(1) —— -G 与相关开关
        url: https://man.openbsd.org/ssh
        retrieved: "2026-09-30"
        appliesTo: OpenSSH 9.5p2（本机实测）
        note: "手册页原文：-G —— Causes ssh to print its configuration after evaluating Host and Match blocks and exit。实测 ssh -G localhost 输出 4050 字节、退出码 0；实测 -p 2222 与 -o Port=2222 都能改 port 行；实测同一个配置项出现两次时**后者生效**。"
    examples:
      - { title: "看 localhost 的最终配置", args: ["-G", "localhost"], expectExitCode: 0 }
      - { title: "指定替代配置文件", args: ["-G", "-F", "none", "localhost"], expectExitCode: 0 }
      - { title: "改端口与用户", args: ["-G", "-p", "2222", "-l", "someuser", "localhost"], expectExitCode: 0 }
      - { title: "缺目标主机（会打印用法）", args: ["-G"], expectExitCode: 255 }

  - id: algorithms
    category: 查看
    title: 列出支持的算法
    description: >-
      用 -Q 打印本机客户端支持的一组算法（加密套件、消息认证码、密钥交换、密钥类型、签名算法……）。
      排查"和服务器协商不上是算法不匹配吗"、核对安全基线时用。
    command: ""
    commandArgs: ["-Q"]
    fields:
      - id: query
        label: 查询项
        type: enum
        style: positional
        required: true
        default: "help"
        values:
          - { value: "help", label: "可用查询项列表", isDefault: true, help: "实测本机返回 11 行：cipher / cipher-auth / compression / kex / key / key-cert / key-plain / key-sig / mac / protocol-version / sig" }
          - { value: "cipher", label: "对称加密套件" }
          - { value: "cipher-auth", label: "带认证加密的对称加密套件" }
          - { value: "compression", label: "压缩算法" }
          - { value: "kex", label: "密钥交换算法" }
          - { value: "key", label: "密钥类型" }
          - { value: "key-cert", label: "证书密钥类型" }
          - { value: "key-plain", label: "非证书密钥类型" }
          - { value: "key-sig", label: "全部密钥类型与签名算法" }
          - { value: "mac", label: "消息认证码（MAC）" }
          - { value: "protocol-version", label: "支持的 SSH 协议版本" }
          - { value: "sig", label: "签名算法" }
        doc: "ssh(1) -Q query_option 一节列出的取值；本机 ssh -Q help 实测输出与之一致（11 项）"
    output:
      mode: capture
      showCommandLine: true
    sources:
      - title: OpenSSH 手册页 ssh(1) —— -Q query_option
        url: https://man.openbsd.org/ssh
        retrieved: "2026-09-30"
        appliesTo: OpenSSH 9.5p2（本机实测）
        note: "手册页列出的查询项是 cipher / cipher-auth / help / mac / kex / key / key-ca-sign / key-cert / key-plain / key-sig / protocol-version / sig。**本机 ssh -Q help 少了 key-ca-sign**（见 NOTES §6），所以本清单只收录本机确实认的 11 项。"
    examples:
      - { title: "列出可用查询项", args: ["-Q", "help"], expectExitCode: 0 }
      - { title: "列出密钥类型", args: ["-Q", "key"], expectExitCode: 0 }
      - { title: "列出 MAC 算法", args: ["-Q", "mac"], expectExitCode: 0 }

  # ==================================================== 连接（交互，真终端）

  - id: connect
    category: 连接
    title: 登录远程主机（交互式 shell）
    description: >-
      打开一个到目标主机的 SSH 会话。**会在真终端里运行**：第一次连某台主机会问
      "Are you sure you want to continue connecting (yes/no)?"，没有可用公钥时会提示
      "user@host's password:"，登录成功后就是一个交互式 shell ——
      宿主捕获输出的方式没法回答这些提示，所以交给真终端。
    command: ""
    execution: terminal
    fields:
      - id: verbose
        label: 详细模式
        type: enum
        style: literal
        switchBase: "-v"
        required: false
        default: "0"
        help: 连接不上时打开它看 DNS、TCP、算法协商、认证逐步日志（最多三级）。
        values:
          - { value: "0", label: "不输出调试信息", isDefault: true, args: [] }
          - { value: "1", label: "-v（一级）", args: ["-v"] }
          - { value: "2", label: "-vv（二级）", args: ["-v", "-v"] }
          - { value: "3", label: "-vvv（三级，最多）", args: ["-v", "-v", "-v"] }
        doc: "ssh(1) -v —— Verbose mode，可重复，Multiple -v options increase the verbosity. The maximum is 3"
      - id: host
        label: 目标主机
        type: text
        style: positional
        required: true
        placeholder: "user@example.com"
        help: >-
          可以写成 user@hostname；只填主机名时用「登录用户」字段或 ssh_config 里的 User。
          **必须声明在所有开关之后** —— 实测 `ssh 192.0.2.1 -p 2222` 里 -p 被当成远端命令的一部分。
        save: true
        doc: "ssh(1) 语法行：destination [command [argument ...]]"
    output:
      showCommandLine: true
      resultNote: 这个动作在真终端里运行，宿主不捕获输出；退出码即远端 shell 或远端命令的退出码。
    sources:
      - title: OpenSSH 手册页 ssh(1) —— 交互式登录、-p / -l / -i / -F / -o / -v
        url: https://man.openbsd.org/ssh
        retrieved: "2026-09-30"
        appliesTo: OpenSSH 9.5p2（本机实测）
        note: "手册页说明了首次连接会展示主机密钥指纹并要求确认（VERIFYING HOST KEYS 一节），以及认证失败时会提示输入密码。本机实测 -p / -l / -i / -F / -o / -v 全部被接受。"
      - title: Microsoft Learn —— OpenSSH 客户端使用说明
        url: https://learn.microsoft.com/en-us/windows-server/administration/openssh/openssh_install_firstuse
        retrieved: "2026-09-30"
        note: "Windows 上连接远端主机的用法与 ssh 一致（ssh user@host）；该页也说明 Windows 版客户端与服务器组件可分别安装。"
    examples:
      - { title: "连到 192.0.2.1（TEST-NET-1，保留地址，不可路由，仅演示 argv）", args: ["-p", "2222", "-o", "ConnectTimeout=5", "192.0.2.1"] }

  - id: run-command
    category: 连接
    title: 在远程主机上执行一条命令
    description: >-
      连上主机后执行给定命令并返回，不进入交互式 shell。**仍然会在真终端里运行**：
      认证环节同样要输密码或确认主机指纹；而且远端命令自己也可能需要交互输入。
      命令的参数请写在「命令参数」里，界面不会经过任何 shell 解析。
    command: ""
    execution: terminal
    fields:
      - id: port
        label: 端口
        type: number
        style: attached
        prefix: "-p"
        required: false
        doc: "ssh(1) -p port"
      - id: user
        label: 登录用户（-l）
        type: text
        style: attached
        prefix: "-l"
        required: false
        save: true
        doc: "ssh(1) -l login_name"
      - id: identityFile
        label: 身份（私钥）文件
        type: file
        style: attached
        prefix: "-i"
        required: false
        doc: "ssh(1) -i identity_file"
      - id: option
        label: 配置项（-o）
        type: text
        style: separate
        prefix: "-o"
        required: false
        placeholder: "BatchMode=yes"
        doc: "ssh(1) -o option；可选名与取值见 ssh_config(5)"
      - id: host
        label: 目标主机
        type: text
        style: positional
        required: true
        placeholder: "user@example.com"
        save: true
        doc: "ssh(1) 语法行：destination [command [argument ...]]"
      - id: command
        label: 远端命令
        type: text
        style: positional
        required: true
        placeholder: "uname -a"
        help: 第一个位置参数必须是目标主机，所以本字段声明在主机之后 —— 声明顺序就是 argv 顺序。
        doc: "ssh(1) 语法行：destination [command [argument ...]]"
      - id: commandArgs
        label: 命令参数
        type: text
        style: positional
        repeatable: true
        required: false
        help: 每行一个参数，按顺序追加到远端命令之后。
        doc: "ssh(1) 语法行：destination [command [argument ...]]；手册页说明 If supplied, the arguments will be appended to the command, separated by spaces"
    output:
      showCommandLine: true
      resultNote: 在真终端里运行；退出码是**远端命令**的退出码，连不上等客户端错误才是 255。
    sources:
      - title: OpenSSH 手册页 ssh(1) —— 远端命令与参数
        url: https://man.openbsd.org/ssh
        retrieved: "2026-09-30"
        appliesTo: OpenSSH 9.5p2（本机实测）
        note: "手册页原文：If a command is specified, it will be executed on the remote host instead of a login shell… the arguments will be appended to the command, separated by spaces；EXIT STATUS 一节：ssh exits with the exit status of the remote command or with 255 if an error occurred。"
    examples:
      - { title: "在 192.0.2.1 上跑一条命令（保留地址，连不通，仅演示 argv）", args: ["-o", "ConnectTimeout=5", "192.0.2.1", "uname", "-a"] }

  # ==================================================== 密钥管理（本地）
