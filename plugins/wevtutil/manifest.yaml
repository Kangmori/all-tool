# yaml-language-server: $schema=../../docs/spec/manifest-v1.schema.json
#
# wevtutil —— Windows 自带的事件日志读写工具（C:\Windows\System32\wevtutil.exe）。
#
# **为什么这个包特别有价值**：`chkdsk` / `sfc` / 安装失败 / 蓝屏（意外关机）的结果
# 都不在屏幕上，而是躺在事件日志里；普通用户根本不知道有这个命令。本包把
# "怎么把那些结果翻出来"变成可点击的动作（尤其是 query-chkdsk 与
# query-unexpected-shutdown），这是本工具包的主要价值。见 NOTES.md §1。
#
# 参数知识来源（两边逐条核对，冲突记进 NOTES.md §6）：
#   1) 官方文档（Microsoft Learn）**只有一个页面**，但它一页到底：
#      https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
#      实测 HTTP 200、正文 63 349 字节、Last updated 2023-02-03。
#      页内有命令总表、12 条命令的语法行、全部选项的逐条说明，以及 12 条官方示例。
#      与 schtasks（主页 + 六个子页）的形态**不同**：wevtutil 没有子页，
#      所以本清单每个动作的 sources 都指这一页（用不同的 note 标明该动作查的是哪一段）。
#      实测：把 `/` 换成后加的 `-wevtutil-<命令>` 之类的猜测 URL 全部 404 —— 不要猜规律。
#   2) 本机 `wevtutil /?` 与 `wevtutil <命令> /?` 的真实输出（**13 个帮助页，全部实跑**）。
#      本机帮助是**英文**（系统 zh-CN / 代码页 936，但 wevtutil 帮助语言集是英文），见 NOTES.md §3。
#
# **输出编码：oem（本机代码页 936）—— 实测判定，不是照抄**。见 NOTES.md §4：
#   `qe System /c:3 /rd:true /f:text` 的原始 stdout 里有 18 个 >0x7F 的字节，其中
#   `bf cd bb a7 b6 cb` 正是 GBK 的「客户端」（英文标签 + 中文事件正文）；
#   用 `UTF8Encoding(throwOnInvalidBytes: true)` 解同一段字节**抛异常**
#   （Unable to translate bytes [BF] at index 306），用 cp936 解正确。
#   所以既不是 utf-8（与本批 schtasks 不同），也不是 utf-16le；`el`/`ep`/`gl` 这些
#   纯 ASCII 输出**不能**用来判定编码——事件正文才会露出来。
#
# **管理员权限：只按实测标注，不做一刀切**（规范 §2.5 宁可漏标）。实测（非管理员账号）：
#   - 全部"查看"动作（el / gl / ep / gp / qe 系统渠道 / gli）**不需要**管理员，退出码 0；
#   - 读 **Security 日志** 需要管理员：`qe Security /c:1 /f:text` → exit=5、stderr "Access is denied."；
#   - `qe <文件> /lf:true`、`gli <文件> /lf:true`（直接读 .evtx 文件）需要管理员：
#     exit=5、stderr "Access is denied."（本机 .evtx 被 ACL 保护，见 NOTES.md §7.3）；
#   - 改动类（sl / cl / im / um / epl）**没有实跑**（会改真实系统），
#     **一律不标 requiresAdmin**（不确定就不标），逐条写在 NOTES.md §8。
#
# 版本：Windows 自带命令**没有 --version 开关**（`wevtutil` 无参数只打印帮助，不是版本），
#       故不写 versionArgs/versionPattern（R1）；用一个 `execution: info` 的动作展示
#       怎么读 exe 的文件版本（R7 实测 10.0.26100.8875），理由见 NOTES.md §9.1。

spec: 1
id: wevtutil
name: wevtutil
manifestVersion: 0.1.0
appVersion: Windows 10/11 自带（随系统版本发布）
kind: system
summary: 查看 Windows 事件日志
description: 读 Windows 事件日志：列出全部日志、查看日志配置与状态、列出事件提供程序、按 XPath 查询事件，并提供"查 chkdsk 结果 / 查蓝屏与意外关机 / 查安装与更新失败"等成品查询。chkdsk、sfc、安装失败、蓝屏的结果都留在这里，命令行之外没有别的地方能看到。Windows 自带，无需安装。
homepage: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
license: 随 Windows 操作系统分发（微软最终用户许可协议）
tags: [windows, 自带命令, 事件日志, 排错, chkdsk, 蓝屏]

sources:
  - title: wevtutil 官方参考（Microsoft Learn）—— 一页到底：命令总表 + 12 条语法行 + 全部选项 + 12 条示例
    url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
    retrieved: "2026-09-29"
    appliesTo: Windows 10/11 / Windows Server 2016-2025
    note: 实测 HTTP 200、正文 63 349 字节、页面 Last updated 2023-02-03、Applies to 含 Windows 10/11 与 Server 2016-2025。**这个命令没有子页**（与 schtasks 的主页 + 六个子页不同），12 条命令的语法、选项说明与示例都在这一页里；本清单每个动作的 sources 都指它，靠 note 区分查的是哪一段。页内锚点：#syntax（语法总表）、#parameters（命令/参数表）、#options（选项表）、#remarks（用配置文件配合 sl）、#examples（12 条官方示例）。
  - title: 本机 13 个帮助页的真实输出（`wevtutil /?` 与 12 个 `wevtutil <命令> /?`）
    url: file:///<仓库目录>/本机帮助快照（**未入库**，可用 pwsh -File scripts/fetch-win-help.ps1 -Commands wevtutil 重新抓取）/wevtutil.txt
    retrieved: "2026-09-29"
    appliesTo: Windows 11 26200 / wevtutil.exe 文件版本 10.0.26100.8875
    note: 13 个帮助页**退出码全是 0**、全部写 stdout、stderr 0 字节。语言是**英文**（纯 ASCII）。帮助正文里有一句官方网页没有的关键限制："/r ... Options /im and /um do not support remote operations."（官方页写成 "The im and um parameters do not support remote operation."——两处一致，仅措辞不同）。与官方页面不一致之处逐条记在 NOTES.md §6。

locate:
  executable: wevtutil.exe
  searchPaths:
    - "${SystemRoot}\\System32\\wevtutil.exe"
  notFoundHint: wevtutil.exe 是 Windows 自带命令，正常情况下都在 C:\Windows\System32 下，不需要安装。

runtime:
  encoding: oem
  useShell: false
  requiresAdmin: false
  workingDirectory: inherit
  timeoutSeconds: 0
  preventConcurrentRuns: false
  usePseudoConsole: false

# 退出码：微软的 wevtutil 页面**没有退出码章节**（已逐行核对）。下面全部来自本机实测，见 NOTES.md §5。
# 实测汇总：13 个 `/?` 帮助页全是 0；全部只读动作成功时 0；
#   0x57 = 87 = ERROR_INVALID_PARAMETER（参数名/取值/个数不对，最常见）
#   0x3A99 = 15001 = ERROR_EVT_INVALID_QUERY（XPath 查询串语法错）
#   0x3A9F = 15007 = ERROR_EVT_CHANNEL_NOT_FOUND（日志名不存在）
#   2 = ERROR_FILE_NOT_FOUND（gp 找不到发布者）
#   3 = ERROR_PATH_NOT_FOUND（/lf:true 指向的路径不存在）
#   5 = ERROR_ACCESS_DENIED（读 Security 日志或用 /lf:true 读 .evtx 文件）
#   码的语义用 `net helpmsg <code>` 逐条核对过（NOTES.md §5），不是猜的。
exitCodes:
  - code: 0
    meaning: 成功。**包括"查询命中 0 条事件"**——实测 `*[System[(EventID=1001)]]` 与本机某 Analytic 渠道都返回 0 字节 + 退出码 0，所以"没有输出"不等于"命令失败"。
    severity: ok
  - code: 2
    meaning: ERROR_FILE_NOT_FOUND（系统找不到指定的文件）。实测出现在 `gp <不存在的发布者>`：stderr 为 "Failed to open metadata for publisher ..." + "The system cannot find the file specified."。
    severity: error
  - code: 3
    meaning: ERROR_PATH_NOT_FOUND（系统找不到指定的路径）。实测出现在 `/lf:true` 指向一个不存在的日志文件：stderr 为 "The system cannot find the path specified." + "Failed to open event query."。
    severity: error
  - code: 5
    meaning: ERROR_ACCESS_DENIED（拒绝访问）。实测出现在**非管理员读 Security 日志**（`qe Security /c:1 /f:text`）与**用 `/lf:true` 直接读 .evtx 文件**（`qe`/`gli`）时：stderr 为 "Access is denied."。
    severity: error
  - code: 87
    meaning: ERROR_INVALID_PARAMETER（参数错误）。**本命令最常撞到的一个**，实测覆盖五种情形：选项名写错（`/invalidate`）、选项取值类型错（`/ge:maybe`）、取值不在允许集合（`/f:json`）、取值非法（`/c:0` 和 `/c:-5`）、必需的路径参数没给（`qe` 或 `gl` 后面什么都不写）。stderr 首行通常是 "Invalid value for option f." / "Invalid option ge. Option is not Boolean." / "Required argument(s) is/are not specified."，末行都是 "The parameter is incorrect."。
    severity: error
  - code: 15001
    meaning: ERROR_EVT_INVALID_QUERY（指定的查询无效），十六进制 0x3A99。实测出现在 XPath 查询串语法不完整时（`/q:*[System[`）：stderr 为 "A syntax error occurred at position 9" + "Failed to open event query." + "The specified query is invalid."。
    severity: error
  - code: 15007
    meaning: ERROR_EVT_CHANNEL_NOT_FOUND（找不到指定的通道），十六进制 0x3A9F。实测出现在日志名不存在时（`qe` / `gl` / `gli` 配一个不存在的名字）：stderr 为 "Failed to open event query." / "Failed to read configuration for log ..." + "The specified channel could not be found."。
    severity: error

quickActions:
  - title: 列出全部事件日志
    action: list-logs
  - title: 查 chkdsk 的检查结果
    action: query-chkdsk
  - title: 查蓝屏与意外关机
    action: query-unexpected-shutdown

actions:

  # ============================================================ 关于本工具
  - id: version
    category: 关于本工具
    title: 版本与文件信息（怎么读）
    command: ""
    execution: info
    description: wevtutil **没有**版本开关——不带参数运行它只会打印一屏帮助。想知道本机 wevtutil 的版本，要读那个 exe 文件的版本信息。这个动作只展示命令与说明，**宿主不执行**：它不是 wevtutil 的参数，而是查文件的方法。
    sources:
      - title: 本机 `wevtutil /?` 的真实输出 —— 无参数时只打印帮助
        url: file:///<仓库目录>/本机帮助快照（**未入库**）/wevtutil.txt
        retrieved: "2026-09-29"
        appliesTo: Windows 11 26200 / wevtutil.exe 10.0.26100.8875
        note: 本机 `wevtutil /?` 的输出里**没有任何版本相关开关**：命令总表只有 12 条（el/gl/sl/ep/gp/im/um/qe/gli/epl/al/cl），Common options 只有 /r /u /p /a /uni。因此按 R1 不写 versionArgs/versionPattern；实测 `(Get-Item C:\Windows\System32\wevtutil.exe).VersionInfo.FileVersion` = 10.0.26100.8875 (WinBuild.160101.0800)。
    fields: []
    output:
      mode: capture
      showCommandLine: true
      resultNote: 本动作只给方法与完整命令行，不产生执行结果。实测文件版本 10.0.26100.8875（ProductVersion 同值，FileDescription 为中文「Windows 事件日志实用工具」）。见 NOTES.md §9.1。
    examples:
      - title: 读 exe 文件版本（在 PowerShell 里跑，不是 wevtutil 的参数）
        args: ["(Get-Item", "C:\\Windows\\System32\\wevtutil.exe).VersionInfo.FileVersion"]

  # ============================================================ 列出与查看
  - id: list-logs
    category: 列出与查看
    title: 列出全部事件日志（el / enum-logs）
    command: el
    description: 列出本机所有事件日志（渠道）的名字，一行一个。命令行的第一站：拿到名字才能用后面那些动作去查它。**这是纯 ASCII 输出**（日志名都是英文），所以它不能用来判断编码。
    sources:
      - title: wevtutil 官方参考 —— {el | enum-logs}
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
        retrieved: "2026-09-29"
        appliesTo: Windows 10/11
        note: 官方原文："{el | enum-logs} Displays the names of all logs."；官方示例第一条就是 "wevtutil el"。语法行里 el 是唯一不接受任何选项的命令（本机 `el /?` 也只显示 `wevtutil { el | enum-logs }` 一行语法）。
    fields: []
    output:
      mode: stream
      showCommandLine: true
      resultNote: 实测本机输出 54 738 字节 / 1 243 行、退出码 0、stderr 0 字节；**0 个非 ASCII 字节**（纯 ASCII）。名字形如 AMSI/Debug、Application、Microsoft-Windows-WindowsUpdateClient/Operational，带 `/` 的是渠道下的子日志，可以直接填给「查询事件」。
    nextSteps:
      # 宿主的 nextSteps **每条命中生成一个可点选项**，标题与 values 里的 {名字}/{1}
      # 会被该次匹配的捕获组填充（见 src/AllTool.Core/Execution/NextStepMatcher.cs）。
      # 所以这里用捕获组而不是裸的整行匹配：否则会生成一堆同名按钮。
      - title: 查看日志 {log} 的配置
        action: query-log-config
        when: '(?m)^(?<log>[A-Za-z][\w/\-]*)\r?$'
        reason: 上面每一行都是一个日志名；想看它开没开、最大多大、文件在哪，就点它（最多列 6 条）
        values: { logName: "{log}" }
      - title: 查询日志 {log} 里的事件
        action: query-channel-events
        when: '(?m)^(?<log>[A-Za-z][\w/\-]*)\r?$'
        reason: 拿到日志名之后，最常用的下一步就是查它里面的事件（最多列 6 条）
        values: { logName: "{log}" }
    examples:
      - title: 列出全部日志名（官方第一条示例）
        args: ["el"]
        expectExitCode: 0

  # ============================================================ 列出与查看
  - id: query-log-config
    category: 列出与查看
    title: 查看日志配置（gl / get-log）
    command: gl
    description: 看某个日志的配置：开没开（enabled）、类型（Admin/Operational…）、隔离级别、日志文件路径、满了以后是覆盖旧事件还是丢弃新事件（retention）、自动备份、最大体积。官方文档说这个命令还能配 /r 在远程机器上跑。
    sources:
      - title: wevtutil 官方参考 —— {gl | get-log} <Logname> [/f:<Format>]
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
        retrieved: "2026-09-29"
        appliesTo: Windows 10/11
        note: 官方原文："{gl | get-log} <Logname> [/f:<Format>] Displays configuration information for the specified log, which includes whether the log is enabled or not, the current maximum size limit of the log, and the path to the file where the log is stored."；<Logname> 一节写 "You can run wevtutil el to obtain a list of log names."；官方示例 "wevtutil gl System /f:xml"。选项 /f 的说明见 #options："The default is Text."。
    fields:
      - id: logName
        label: 日志名
        type: text
        style: positional
        required: true
        save: true
        placeholder: 例 System
        help: 日志名必须与 `wevtutil el` 列出来的一字不差（大小写不敏感，但名字里的斜杠不能少，例如 Microsoft-Windows-WindowsUpdateClient/Operational）。名字不对会以退出码 15007 失败。
        doc: official #parameters 的 {gl | get-log} <Logname>（"You can run wevtutil el to obtain a list of log names."）
      - id: format
        label: 输出格式（/f）
        type: enum
        style: attached
        prefix: "/f:"
        group: 输出
        advanced: true
        default: Text
        help: 官方原文：/f 取 XML 或 Text，**默认 Text**（Text 输出不带 XML 标签，更省地方）。XML 便于机器解析，Text 便于人读。两者实测都能跑。
        doc: official #options 的 /f:<Format>（XML | Text，"The default is Text."）
        values:
          - value: Text
            label: Text —— 不带 XML 标签（默认）
            isDefault: true
          - value: XML
            label: XML
    output:
      mode: stream
      showCommandLine: true
      resultNote: '实测 gl System 输出 410 字节、gl System /f:xml 635 字节，都退出码 0。Text 输出形如 name: System / enabled: true / type: Admin / logging: { logFileName: %SystemRoot%\System32\Winevt\Logs\System.evtx, retention: false, maxSize: 20971520 }。**大小写注意**：官方写作 /f:xml，本机对 /f:XML 与 /f:xml 都接受（选项与其取值都不区分大小写，见 /r 帮助页开头的 "Options and their values are not case-sensitive."）。**刻意不写 nextSteps**：这条动作的输出是 name: ... / logging: 这类字段行，从里面判断不出用户的下一步意图，硬写一个正则就是 0 命中的假推荐。'
    examples:
      - title: 查看 System 日志的配置（官方示例形态）
        args: ["gl", "System"]
        expectExitCode: 0
      - title: 以 XML 格式查看 System 日志配置（官方示例原文）
        args: ["gl", "System", "/f:xml"]
        expectExitCode: 0

  # ============================================================ 列出与查看
  - id: query-log-status
    category: 列出与查看
    title: 查看日志状态（gli / get-loginfo）
    command: gli
    description: 看某个日志的"现状"：文件创建时间、最后写入时间、文件体积、当前有多少条记录、最早那条的序号。想知道"日志有没有在写、是不是快满了"就看它。
    sources:
      - title: wevtutil 官方参考 —— {gli | get-loginfo} <Logname> [/lf:<Logfile>]
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
        retrieved: "2026-09-29"
        appliesTo: Windows 10/11
        note: 官方原文："{gli | get-loginfo} <Logname> [/lf:<Logfile>] Displays status information about an event log or log file. If the /lf option is used, <Logname> is a path to a log file. You can run wevtutil el to obtain a list of log names."；官方示例 "wevtutil gli Application"。**注意命令的长写法**：本机帮助与官方页面都写 `get-loginfo`（不是 get-log-info）。
    fields:
      - id: logName
        label: 日志名
        type: text
        style: positional
        required: true
        save: true
        placeholder: 例 Application
        help: '日志名来自 wevtutil el。名字不对会以退出码 15007 失败（stderr: Failed to read log status information for log ...）。'
        doc: official #parameters 的 {gli | get-loginfo} <Logname>（"You can run wevtutil el to obtain a list of log names."）
    output:
      mode: stream
      showCommandLine: true
      resultNote: '实测 gli Application 输出 227 字节、退出码 0，形如 creationTime: 2025-11-18T08:43:10.4329642Z / lastWriteTime: ... / fileSize: 20975616 / numberOfLogRecords: 27219。**未做 /lf**——实测它需要管理员（见 NOTES.md §7.3），所以没做成字段。'
    examples:
      - title: 查看 Application 日志的状态（官方示例原文）
        args: ["gli", "Application"]
        expectExitCode: 0

  # ============================================================ 列出与查看
  - id: list-publishers
    category: 列出与查看
    title: 列出事件提供程序（ep / enum-publishers）
    command: ep
    description: 列出本机所有"事件提供程序"（发布事件的组件，形如 Microsoft-Windows-Kernel-Power）。日志里的每条事件都来自某个提供程序；想知道某个组件叫什么名字，从这里找。
    sources:
      - title: wevtutil 官方参考 —— {ep | enum-publishers}
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
        retrieved: "2026-09-29"
        appliesTo: Windows 10/11
        note: 官方原文："{ep | enum-publishers} Displays the event publishers on the local computer."；本机 `ep /?` 的示例也是 "wevtutil ep"。与 el 一样，ep 不接受任何选项。
    fields: []
    output:
      mode: stream
      showCommandLine: true
      resultNote: 实测本机输出 38 675 字节 / 1 282 行、退出码 0、stderr 0 字节、**0 个非 ASCII 字节**。这些名字可以直接填进「查看提供程序配置」的发布者名，或写进 XPath 的 Provider[@Name='...']。
    nextSteps:
      # 同 list-logs：用捕获组让宿主的"一次命中一个选项"机制真的有用。
      - title: 查看提供程序 {publisher} 的配置
        action: query-publisher
        when: '(?m)^(?<publisher>[A-Za-z][\w/\-]*)\r?$'
        reason: 上面每一行都是一个发布者名，点它就能看这个提供程序能发哪些事件、有哪些渠道（最多列 6 条）
        values: { publisherName: "{publisher}" }
    examples:
      - title: 列出全部事件提供程序（官方示例形态）
        args: ["ep"]
        expectExitCode: 0

  # ============================================================ 列出与查看
  - id: query-publisher
    category: 列出与查看
    title: 查看提供程序配置（gp / get-publisher）
    command: gp
    description: 看某个事件提供程序的元数据：它的 GUID、资源文件、它写哪些日志（channels）、它定义的等级/操作码/任务/关键字，以及（加 /ge 时）它能发出的每一条事件的编号与消息模板。写事件查询前用它查名字与编号最可靠。
    sources:
      - title: wevtutil 官方参考 —— {gp | get-publisher} <Publishername> [/ge:<Metadata>] [/gm:<Message>] [/f:<Format>]
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
        retrieved: "2026-09-29"
        appliesTo: Windows 10/11
        note: 官方原文："{gp | get-publisher} <Publishername> [/ge:<Metadata>] [/gm:<Message>] [/f:<Format>] Displays the configuration information for the specified event publisher."；<Publishername> 一节写 "You can obtain a list of publisher names by typing wevtutil ep."；官方示例 "wevtutil gp Microsoft-Windows-Eventlog /ge:true"。选项 /ge（取事件的元数据）与 /gm（显示真实消息而不是数字 ID）都只接受 true/false。
    fields:
      - id: publisherName
        label: 提供程序名
        type: text
        style: positional
        required: true
        save: true
        placeholder: 例 Microsoft-Windows-Eventlog
        help: '名字来自 wevtutil ep（或事件 XPath 里的 Provider @Name）。名字不对会以退出码 2 失败（stderr: Failed to open metadata for publisher ...）。'
        doc: official #parameters 的 {gp | get-publisher} <Publishername>（"You can obtain a list of publisher names by typing wevtutil ep."）
      - id: getEvents
        label: 取事件元数据（/ge）
        type: bool
        style: flag
        prefix: "/ge:true"
        group: 详细程度
        default: false
        help: 官方原文：/ge "Gets metadata information for events that can be raised by this publisher."。加上它输出会大很多（实测本机 Microsoft-Windows-Eventlog 从 2 615 字节涨到 13 688 字节），因为它把该提供程序能发的每条事件都列出来。
        doc: official #options 的 /ge:<Metadata>（true | false）
      - id: getMessage
        label: 显示真实消息而不是数字 ID（/gm）
        type: bool
        style: flag
        prefix: "/gm:true"
        group: 详细程度
        advanced: true
        default: false
        help: '官方原文：/gm "Displays the actual message instead of the numeric message ID."。默认输出里消息是数字（例如 message: 2415919105），加上它才显示成文字。可单独使用（实测 gp Microsoft-Windows-Eventlog /gm:true 退出码 0）。'
        doc: official #options 的 /gm:<Message>（true | false）
      - id: format
        label: 输出格式（/f）
        type: enum
        style: attached
        prefix: "/f:"
        group: 详细程度
        advanced: true
        default: Text
        help: 官方原文：/f 取 XML 或 Text，**默认 Text**。XML 便于机器解析，Text 便于人读。
        doc: official #options 的 /f:<Format>（XML | Text，"The default is Text."）
        values:
          - value: Text
            label: Text —— 不带 XML 标签（默认）
            isDefault: true
          - value: XML
            label: XML
    output:
      mode: stream
      showCommandLine: true
      resultNote: 实测：`gp Microsoft-Windows-Eventlog` 2 615 字节；`/ge:true /gm:true` 13 688 字节；`/ge:true /f:xml` 9 078 字节；`gp Microsoft-Windows-Kernel-Power /ge:true /gm:true /f:xml` 108 196 字节（约 106 KB）。全部退出码 0。**输出可能很大**，界面要有等待预期。
    nextSteps:
      - title: 查询这个提供程序发出的事件
        action: query-channel-events
        reason: 上面列出了它写进哪些渠道（channels），把渠道名填进「查询事件」就能看它实际发过什么
    examples:
      - title: 查看 Microsoft-Windows-Eventlog 的配置（官方示例形态）
        args: ["gp", "Microsoft-Windows-Eventlog"]
        expectExitCode: 0
      - title: 含事件元数据（官方示例原文）
        args: ["gp", "Microsoft-Windows-Eventlog", "/ge:true"]
        expectExitCode: 0

  # ============================================================ 查询事件
  - id: query-channel-events
    category: 查询事件
    title: 查询事件（qe / query-events）
    command: qe
    description: 从某个日志里读事件，可以按 XPath 查询串筛选、控制方向与条数、选择输出格式。**这是本工具包的主力动作**：下面那些"查 chkdsk / 查蓝屏 / 查错误"的动作都是它的预设形态。"查不到东西"通常有两种：查询串写错（退出码 15001）或确实没有命中（退出码 0、输出为空）。
    sources:
      - title: wevtutil 官方参考 —— {qe | query-events} <Path> [/lf] [/sq] [/q] [/bm] [/sbm] [/rd] [/f] [/l] [/c] [/e]
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
        retrieved: "2026-09-29"
        appliesTo: Windows 10/11
        note: 官方原文："{qe | query-events} <Path> [...] Reads events from an event log, from a log file, or using a structured query. By default, you provide a log name for <Path>."；官方示例 "wevtutil qe Application /c:3 /rd:true /f:text"（"Display the three most recent events from the Application log in textual format"）。**路径必须紧跟在 qe 之后**（语法行里 <Path> 是命令后的第一个位置参数），所以本清单把 logName 字段声明在所有开关字段之前。
    fields:
      # 位置参数声明在最前：官方语法是 wevtutil qe <Path> [/OPTION:VALUE ...]
      - id: logName
        label: 日志名（日志或渠道名）
        type: text
        style: positional
        required: true
        save: true
        placeholder: 例 System
        help: 默认要填**日志名**（来自 `wevtutil el`，例如 System / Application / Microsoft-Windows-WindowsUpdateClient/Operational），不是 .evtx 文件路径。名字不对会以退出码 15007 失败。想直接读 .evtx 文件得加 /lf:true，而**实测那需要管理员**，所以本包没做这个开关（见 NOTES.md §7.3）。
        doc: official #parameters 的 {qe | query-events} <Path>（"By default, you provide a log name for <Path>."）
      - id: query
        label: XPath 查询串（/q）
        type: textarea
        style: attached
        prefix: "/q:"
        group: 筛选
        save: true
        placeholder: 例 *[System[(Level=1 or Level=2)]]
        help: 官方原文：/q "Defines the XPath query to filter the events that are read or exported. If this option is not specified, all events will be returned."。**这是 XPath 1.0**（不是 `Get-WinEvent -FilterHashtable` 那种写法，两者不能互换）。留空 = 取全部事件（System 日志实测有 4 万多条，务必配合下面的条数）。可直接抄的片段：按等级 `*[System[(Level=1 or Level=2)]]`（1=Critical、2=Error、3=Warning、4=Information、5=Verbose，实测有效）；按编号 `*[System[(EventID=1000)]]`；按提供程序 `*[System[Provider[@Name='Chkdsk']]]`；组合 `*[System[Provider[@Name='Microsoft-Windows-Wininit'] and (EventID=1001)]]`；按时间（**毫秒**，实测有效）`*[System[TimeCreated[timediff(@SystemTime) <= 86400000]]]`（一天内）。注意：**属性名写错不会报错，只会返回 0 条**（实测 `*[System[(Bogus=1)]]` 退出码 0、无输出），写完后先看条数对不对。
        doc: official #options 的 /q:<Query>（"Defines the XPath query to filter the events that are read or exported."）
      - id: count
        label: 最多读几条（/c）
        type: number
        style: attached
        prefix: "/c:"
        group: 数量与方向
        placeholder: 例 20
        help: '官方原文：/c "Sets the maximum number of events to read."。**实测必须 ≥ 1**：/c:0 与 /c:-5 都以退出码 87 失败（stderr: Invalid value for property count.）。留空 = 不限制（可能输出几十兆，见 NOTES.md §7.1）。**刻意不给默认值**——"返回全量还是取最近 N 条"是用户该自己决定的事。'
        doc: official #options 的 /c:<Count>（"Sets the maximum number of events to read."）
      - id: reverseDirection
        label: 从最新往旧读（/rd）
        type: bool
        style: flag
        prefix: "/rd:true"
        group: 数量与方向
        default: false
        help: 官方原文：/rd "Specifies the direction in which events are read. <Direction> can be true or false. If true, the most recent events are returned first."。**默认不加**：官方没写不加时是按什么方向读（实测不加时读的是最旧的几条），所以这里把"用 wevtutil 自己的默认方向"留作默认，要"最近 N 条"就自己勾上——官方示例 `wevtutil qe Application /c:3 /rd:true /f:text` 正是这么用的。
        doc: official #options 的 /rd:<Direction>（true | false）
      - id: format
        label: 输出格式（/f）
        type: enum
        style: attached
        prefix: "/f:"
        group: 输出
        default: Text
        help: 官方原文：/f 取 XML、Text 或 RenderedXml，**默认 XML**；"If Text is specified, prints events in an easy to read text format"；"printing events in Text or RenderedXml formats is slower than printing in XML format."。本清单把界面的默认设成 **Text**（人读优先，Text 会把事件正文渲染成文字，例如 chkdsk 的检查报告）；要看机器可解析的原始结构就选 XML；RenderedXml = XML + 渲染信息。**实测**：三者都跑通（System /c:3：XML 2 304 字节、Text 1 250 字节、RenderedXml 3 173 字节）。
        doc: official #options 的 /f:<Format>（XML | Text | RenderedXml）
        values:
          - value: Text
            label: Text —— 人读格式，带事件正文（推荐）
            isDefault: true
          - value: XML
            label: XML —— wevtutil 自己的默认格式，原始结构
          - value: RenderedXml
            label: RenderedXml —— XML + 渲染信息（最慢、最大）
      - id: locale
        label: 事件文本语言（/l，高级）
        type: text
        style: attached
        prefix: "/l:"
        group: 输出
        advanced: true
        placeholder: 例 zh-CN 或 en-US
        help: 官方原文：/l "Defines a locale string that is used to print event text in a specific locale. Only available when printing events in text format using the /f option."。**只在 Text 格式下有效**。本机实测填 `zz-ZZ` 这种不存在的语言也返回退出码 0、输出与不填时一样——**没能观测到它产生差异**（本机消息资源只有一种语言），所以留空 = 不指定是默认。见 NOTES.md §7.5。
        doc: official #options 的 /l:<Locale>（"Only available when printing events in text format using the /f option."）
      - id: element
        label: 包一层根元素（/e，高级）
        type: text
        style: attached
        prefix: "/e:"
        group: 输出
        advanced: true
        placeholder: 例 root
        help: 官方原文：/e "Includes a root element when displaying events in XML. <Element> is the string that you want within the root element. For example, /e:root would result in XML that contains the root element pair <root></root>."。**实测它只对 XML 输出生效**：`/f:xml /e:root` 的输出首行是 `<root>`，而 `/f:text /e:root` 的输出里找不到 root（与官方措辞一致，官方说的就是 "when displaying events in XML"）。留空 = 不加根元素。
        doc: official #options 的 /e:<Element>（"Includes a root element when displaying events in XML."）
    output:
      mode: stream
      showCommandLine: true
      resultNote: 实测（非管理员）：`qe System /c:3 /rd:true /f:text` 1 250 字节、退出码 0；`qe Application /c:2 /rd:true /f:text /q:"*[System[Provider[@Name='Chkdsk']]]"` 4 540 字节、命中 2 条；查询串语法不完整 → 退出码 15001；日志名不存在 → 15007；`/c:0` → 87。**注意"没有输出"不等于失败**：命中 0 条时退出码是 0、输出 0 字节。
    examples:
      - title: Application 日志最近三条（官方示例原文）
        args: ["qe", "Application", "/c:3", "/rd:true", "/f:text"]
        expectExitCode: 0
      - title: System 日志最近的错误与严重事件
        args: ["qe", "System", "/c:20", "/rd:true", "/f:text", "/q:*[System[(Level=1 or Level=2)]]"]
        expectExitCode: 0
      - title: 以 XML 输出（默认格式）+ 根元素
        args: ["qe", "System", "/c:3", "/rd:true", "/f:xml", "/e:root"]
        expectExitCode: 0

  # ============================================================ 查询事件
  - id: query-system-errors
    category: 查询事件
    title: 查系统里的错误与严重事件
    command: qe
    commandArgs: ["System", "/f:text"]
    description: 从 System 日志里挑出等级为 Critical(1) 或 Error(2) 的事件，从最新往旧读。装不上驱动、服务起不来、磁盘报错、TLS 失败都在这儿。**这是最该先看的一条查询**——很多"电脑出问题了"的答案就在这几条里。
    sources:
      - title: wevtutil 官方参考 —— /q（XPath 查询串）与 /rd、/c、/f
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
        retrieved: "2026-09-29"
        appliesTo: Windows 10/11
        note: '查询串形态依据官方 /q 一节（"VALUE is an XPath query to filter events read"）；**等级取值的含义来自实测**：本机 /q:"*[System[(Level=1 or Level=2)]]" 在 System 日志命中 8 050 条、输出里 Level: Error，加 (Level=3) 后命中 15 775 条（多出来的是 Warning），据此确认 1/2/3 分别是 Critical/Error/Warning。用法形态与官方示例 wevtutil qe Application /c:3 /rd:true /f:text 相同。'
    fields:
      - id: channel
        label: 从哪个日志查
        type: enum
        style: positional
        default: System
        help: 默认 System（系统日志）。换 Application 可以看应用崩溃（实测 Application 里同类查询命中 1 046 条）。其它日志名请用上面「查询事件」动作手填。
        doc: official #parameters 的 {qe | query-events} <Path>（"By default, you provide a log name for <Path>."）
        values:
          - value: System
            label: System —— 系统日志（默认）
            isDefault: true
          - value: Application
            label: Application —— 应用程序日志
      - id: count
        label: 最多读几条（/c）
        type: number
        style: attached
        prefix: "/c:"
        group: 数量
        default: 50
        help: 官方原文：/c "Sets the maximum number of events to read."；**实测必须 ≥ 1**（`/c:0` → 退出码 87）。默认 50 是本工具包按"人一次看得完"选的：本机 System 日志这类错误有 8 050 条，不加限制会输出 3 MB 以上。
        doc: official #options 的 /c:<Count>（"Sets the maximum number of events to read."）
      - id: query
        label: XPath 查询串（/q）
        type: textarea
        style: attached
        prefix: "/q:"
        group: 筛选
        save: true
        default: "*[System[(Level=1 or Level=2)]]"
        placeholder: 例 *[System[(Level=1 or Level=2)]]
        help: '官方原文：/q "Defines the XPath query to filter events read."。默认值就是"等级为 Critical(1) 或 Error(2)"（实测：本机 System 日志命中 8 050 条；1/2/3 = Critical/Error/Warning 是用"加 (Level=3) 后命中数从 8 050 涨到 15 775"对照出来的）。**格式注意**：/q: 后面直接跟查询串、中间**不能有空格**（实测写成 /q 与查询串两个参数会以退出码 87 失败：Too many arguments are specified.）；查询串里的冒号与单引号都不用你手动转义，宿主按 argv 数组传参、自动加引号（本机实测 Provider[@Name=''Chkdsk''] 这种带单引号的串也能跑通）。常用片段：按等级 *[System[(Level=1 or Level=2)]]；按编号 *[System[(EventID=1000)]]；按提供程序 *[System[Provider[@Name=''Chkdsk'']]]；按时间（**毫秒**）*[System[TimeCreated[timediff(@SystemTime) <= 604800000]]]。**属性名写错不会报错，只会返回 0 条**（实测 *[System[(Bogus=1)]] 退出码 0、无输出），所以"查不到"时先怀疑查询串。'
        doc: official #options 的 /q:<Query>（"Defines the XPath query to filter the events that are read or exported."）
    output:
      mode: stream
      showCommandLine: true
      resultNote: 实测 `qe System /c:3 /rd:true /f:text /q:"*[System[(Level=1 or Level=2)]]"` 退出码 0、3 条事件（首条 Event ID 36871、Source Schannel、Level Error）；同一查询不加 /c 命中 8 050 条、输出 3 367 610 字节。**这些事件说明等级过滤确实生效**（Level 一栏是 Error）。
    examples:
      - title: System 日志最近 50 条错误与严重事件
        args: ["qe", "System", "/c:50", "/rd:true", "/f:text", "/q:*[System[(Level=1 or Level=2)]]"]
        expectExitCode: 0

  # ============================================================ 查询事件
  - id: query-chkdsk
    category: 查询事件
    title: 查 chkdsk 的检查结果
    command: qe
    commandArgs: ["Application", "/f:text"]
    description: '**把 chkdsk 的完整检查报告从事件日志里翻出来**。chkdsk 默认把报告写进事件日志而不是屏幕，所以"我昨天扫了盘，结果呢？"的答案就在这里：每个阶段的处理量、有没有坏扇区、有没有发现问题。报告里连中文都是原样保留的。'
    sources:
      - title: wevtutil 官方参考 —— /q（XPath 查询串），配合 chkdsk 事件来源实测确定
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
        retrieved: "2026-09-29"
        appliesTo: Windows 10/11
        note: '查询串形态依据官方 /q 一节；**Provider 名 Chkdsk 与事件编号来自本机实测**：*[System[Provider[@Name=''Chkdsk'']]] 在 Application 日志命中 4 条（Event ID 26212 与 26226），正文里就是 chkdsk 的完整报告（含「检查 C: 上的文件系统」「坏扇区 0 KB」这些行）。这是"用工具把系统埋起来的结果翻出来"的典型，也是本工具包存在的主要理由（NOTES.md §1）。'
    fields:
      - id: count
        label: 最多读几条（/c）
        type: number
        style: attached
        prefix: "/c:"
        group: 数量
        default: 5
        help: 官方原文：/c "Sets the maximum number of events to read."；**实测必须 ≥ 1**。默认 5 是因为 chkdsk 的每条报告都很长（本机 2 条合计 4 540 字节）。
        doc: official #options 的 /c:<Count>（"Sets the maximum number of events to read."）
      - id: query
        label: XPath 查询串（/q）
        type: textarea
        style: attached
        prefix: "/q:"
        group: 筛选
        save: true
        default: "*[System[Provider[@Name='Chkdsk']]]"
        placeholder: 例 *[System[Provider[@Name='Chkdsk']]]
        help: '默认值就是"来源是 Chkdsk"（实测：本机 Application 日志命中 4 条，Event ID 26212 与 26226，正文里就是完整的 chkdsk 报告）。chkdsk 会写两类事件：**26212** = 只读/扫描模式跑完、**26226** = 扫描并修复；想只看后者就把查询串改成 *[System[(EventID=26226)]]（实测命中 3 条）。/q: 与查询串中间**不能有空格**（实测两个参数会退出码 87 失败）。'
        doc: official #options 的 /q:<Query>（"Defines the XPath query to filter the events that are read or exported."）
    output:
      mode: stream
      showCommandLine: true
      resultNote: 实测 `qe Application /c:2 /rd:true /f:text /q:"*[System[Provider[@Name='Chkdsk']]]"` 退出码 0、命中 2 条、4 540 字节；正文是完整报告（「Windows 已扫描文件系统并且没有发现问题。」「坏扇区 0 KB。」）。**没有 chkdsk 记录时退出码仍是 0、输出为空**——那不是命令失败。
    examples:
      - title: 查最近的 chkdsk 报告（两类都查）
        args: ["qe", "Application", "/c:5", "/rd:true", "/f:text", "/q:*[System[Provider[@Name='Chkdsk']]]"]
        expectExitCode: 0
      - title: 只查"扫描并修复"那一类（EventID=26226）
        args: ["qe", "Application", "/c:3", "/rd:true", "/f:text", "/q:*[System[(EventID=26226)]]"]
        expectExitCode: 0

  # ============================================================ 查询事件
  - id: query-application-errors
    category: 查询事件
    title: 查应用崩溃（应用程序错误）
    command: qe
    commandArgs: ["Application", "/f:text"]
    description: 从 Application 日志里挑出等级为 Critical 或 Error 的事件。程序闪退、安装失败、.NET 异常都记在这里，事件正文里通常直接写着出错的程序名与模块。
    sources:
      - title: wevtutil 官方参考 —— /q（XPath 查询串）与 /rd、/c、/f
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
        retrieved: "2026-09-29"
        appliesTo: Windows 10/11
        note: 查询串形态依据官方 /q 一节；**等级取值与命中量来自实测**：`*[System[(Level=1 or Level=2)]]` 在 Application 日志命中 1 046 条，输出里 `Source` 是 Application Error / .NET Runtime / Microsoft-Windows-AppModel-State，Event ID 1000/1002/13。
    fields:
      - id: count
        label: 最多读几条（/c）
        type: number
        style: attached
        prefix: "/c:"
        group: 数量
        default: 50
        help: 官方原文：/c "Sets the maximum number of events to read."；**实测必须 ≥ 1**。默认 50；本机 Application 日志这类事件有 1 046 条，不加限制会输出 640 KB 以上。
        doc: official #options 的 /c:<Count>（"Sets the maximum number of events to read."）
      - id: query
        label: XPath 查询串（/q）
        type: textarea
        style: attached
        prefix: "/q:"
        group: 筛选
        save: true
        default: "*[System[(Level=1 or Level=2)]]"
        placeholder: 例 *[System[(Level=1 or Level=2)]]
        help: '默认值 = 等级为 Critical 或 Error（实测：本机 Application 日志命中 1 046 条，Source 是 Application Error / .NET Runtime / Microsoft-Windows-AppModel-State，Event ID 1000/1002/13）。**只想看程序崩溃**就把查询串改成 *[System[(EventID=1000)]]（实测命中 2 条，Source 为 Application Error 与 .NET Runtime）。/q: 与查询串中间**不能有空格**（两个参数会退出码 87 失败）。'
        doc: official #options 的 /q:<Query>（"Defines the XPath query to filter the events that are read or exported."）
    output:
      mode: stream
      showCommandLine: true
      resultNote: 实测 `qe Application /c:3 /rd:true /f:text /q:"*[System[(Level=1 or Level=2)]]"` 退出码 0、命中 3 条（首条 Event ID 1000、Source "Application Error"）；不加 /c 命中 1 046 条、647 271 字节。
    examples:
      - title: Application 日志最近 50 条错误
        args: ["qe", "Application", "/c:50", "/rd:true", "/f:text", "/q:*[System[(Level=1 or Level=2)]]"]
        expectExitCode: 0

  # ============================================================ 查询事件
  - id: query-recent-critical-warnings
    category: 查询事件
    title: 查最近的警告（Level 3）
    command: qe
    commandArgs: ["System", "/f:text"]
    description: 挑出等级为 Warning(3) 的事件。"错误"是已经出事了，"警告"是快要出事：磁盘空间不够、驱动签名可疑、服务反复重启，都在这一档。
    sources:
      - title: wevtutil 官方参考 —— /q（XPath 查询串）与 /rd、/c、/f
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
        retrieved: "2026-09-29"
        appliesTo: Windows 10/11
        note: 查询串形态依据官方 /q 一节；**Level=3 就是 Warning 来自实测**：本机 `/q:"*[System[(Level=1 or Level=2) or (Level=3)]]"` 命中 15 775 条，而不含 (Level=3) 的同查询命中 8 050 条，差值 7 725 条即 Warning 档。
    fields:
      - id: count
        label: 最多读几条（/c）
        type: number
        style: attached
        prefix: "/c:"
        group: 数量
        default: 50
        help: 官方原文：/c "Sets the maximum number of events to read."；**实测必须 ≥ 1**。默认 50——本机 System 日志的 Warning 有 7 725 条。
        doc: official #options 的 /c:<Count>（"Sets the maximum number of events to read."）
      - id: query
        label: XPath 查询串（/q）
        type: textarea
        style: attached
        prefix: "/q:"
        group: 筛选
        save: true
        default: "*[System[(Level=3)]]"
        placeholder: 例 *[System[(Level=3)]]
        help: '默认值 = 等级为 Warning(3)。**Level=3 就是 Warning 是实测出来的**：本机 System 日志里 *[System[(Level=1 or Level=2) or (Level=3)]] 命中 15 775 条，不含 (Level=3) 的同查询命中 8 050 条，差值 7 725 = Warning 档。想只看最近一段时间就自己加时间条件，例如 *[System[(Level=3) and TimeCreated[timediff(@SystemTime) <= 259200000]]]（3 天 = 259200000 毫秒，官方 Remarks 没有给 timediff 的取值表，这个毫秒写法是实测确认可用的）。/q: 与查询串中间**不能有空格**。'
        doc: official #options 的 /q:<Query>（"Defines the XPath query to filter the events that are read or exported."）
    output:
      mode: stream
      showCommandLine: true
      resultNote: 实测 `qe System /c:3 /rd:true /f:text /q:"*[System[(Level=3)]]"` 退出码 0。**这条查询的命中量很大**（本机 System 日志 Warning 约 7 725 条），不填条数会输出数十兆，见 NOTES.md §7.1。
    examples:
      - title: System 日志最近 50 条警告
        args: ["qe", "System", "/c:50", "/rd:true", "/f:text", "/q:*[System[(Level=3)]]"]
        expectExitCode: 0

  # ============================================================ 查询事件
  - id: query-update-events
    category: 查询事件
    title: 查 Windows 更新与安装失败
    command: qe
    commandArgs: ["System", "/f:text"]
    description: 挑出 Windows 更新客户端（Microsoft-Windows-WindowsUpdateClient）记下的事件。更新装不上、反复重试、装完要重启，都会在 System 日志里留下这个来源的事件。
    sources:
      - title: wevtutil 官方参考 —— /q（XPath 查询串）与 /rd、/c、/f
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
        retrieved: "2026-09-29"
        appliesTo: Windows 10/11
        note: 查询串形态依据官方 /q 一节；**Provider 名来自实测**：`*[System[Provider[@Name='Microsoft-Windows-WindowsUpdateClient']]]` 在 System 日志命中 479 条（本机），输出里 Source 为 Microsoft-Windows-WindowsUpdateClient、Event ID 19/43/44。
    fields:
      - id: count
        label: 最多读几条（/c）
        type: number
        style: attached
        prefix: "/c:"
        group: 数量
        default: 30
        help: 官方原文：/c "Sets the maximum number of events to read."；**实测必须 ≥ 1**。默认 30（本机命中 479 条）。
        doc: official #options 的 /c:<Count>（"Sets the maximum number of events to read."）
      - id: query
        label: XPath 查询串（/q）
        type: textarea
        style: attached
        prefix: "/q:"
        group: 筛选
        save: true
        default: "*[System[Provider[@Name='Microsoft-Windows-WindowsUpdateClient']]]"
        placeholder: 例 *[System[Provider[@Name='Microsoft-Windows-WindowsUpdateClient']]]
        help: '默认值 = 来源为 Windows 更新客户端（实测：本机 System 日志命中 479 条，Event ID 19/43/44）。**只想看装不上的那些**就把查询串改成 *[System[Provider[@Name=''Microsoft-Windows-WindowsUpdateClient''] and (Level=1 or Level=2)]]（实测退出码 0、命中 3 条）。/q: 与查询串中间**不能有空格**。'
        doc: official #options 的 /q:<Query>（"Defines the XPath query to filter the events that are read or exported."）
    output:
      mode: stream
      showCommandLine: true
      resultNote: 实测 `qe System /c:3 /rd:true /f:text /q:"*[System[Provider[@Name='Microsoft-Windows-WindowsUpdateClient']]]"` 退出码 0、命中 3 条（Event ID 19/43/44）；不加 /c 命中 479 条、203 911 字节。
    examples:
      - title: 最近的更新客户端事件
        args: ["qe", "System", "/c:30", "/rd:true", "/f:text", "/q:*[System[Provider[@Name='Microsoft-Windows-WindowsUpdateClient']]]"]
        expectExitCode: 0

  # ============================================================ 查询事件
  - id: query-unexpected-shutdown
    category: 查询事件
    title: 查蓝屏与意外关机
    command: qe
    commandArgs: ["System", "/f:text"]
    description: 用事件编号找"系统没正常关机"的痕迹：41（内核在没干净关机的情况下重启，即蓝屏/断电/死机重启的典型标志）、1001（BugCheck，蓝屏记录，正文里带停止代码）、6008（上一次关机是意外的）。想确认"昨天是不是蓝屏了"就查它。
    sources:
      - title: wevtutil 官方参考 —— /q（XPath 查询串）与 /rd、/c、/f
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
        retrieved: "2026-09-29"
        appliesTo: Windows 10/11
        note: 查询串形态依据官方 /q 一节。**事件编号的选取依据**：本机 System 日志里 EventID=41、EventID=6008、以及 Microsoft-Windows-Wininit 的 EventID=1001 当前都命中 0 条（这台机器最近没蓝屏过），所以这三个编号是**按"这一类事件的标准编号"选的，未能在本机观测到命中样本**；实测确认的是"这三种查询串语法都被接受、退出码 0、命中 0 条时输出为空"。这一点如实记在 NOTES.md §7.6。
    fields:
      - id: count
        label: 最多读几条（/c）
        type: number
        style: attached
        prefix: "/c:"
        group: 数量
        default: 20
        help: 官方原文：/c "Sets the maximum number of events to read."；**实测必须 ≥ 1**。
        doc: official #options 的 /c:<Count>（"Sets the maximum number of events to read."）
      - id: query
        label: XPath 查询串（/q）
        type: textarea
        style: attached
        prefix: "/q:"
        group: 筛选
        save: true
        default: "*[System[(EventID=41) or (EventID=1001)]]"
        placeholder: 例 *[System[(EventID=41) or (EventID=1001)]]
        help: '默认值同时查两类（**41** = 内核在没有先干净关机的情况下重启，蓝屏/断电/死机重启的典型标志；**1001** = BugCheck，蓝屏记录，正文里带停止代码与内存转储信息）。想只查其中一个就把查询串改成 *[System[(EventID=1001)]]（只要蓝屏）或 *[System[(EventID=6008)]]（**6008** = 上一次关机是意外的）。/q: 与查询串中间**不能有空格**。'
        doc: official #options 的 /q:<Query>（"VALUE is an XPath query to filter events"）
    output:
      mode: stream
      showCommandLine: true
      resultNote: 实测三条查询串（41 或 1001 / 1001 / 6008）在 System 日志上都返回退出码 0、**0 条事件**（这台机器近期没有蓝屏或意外关机）——**所以"查到 0 条"正是本机当前的真实结论，不是命令失败**。见 NOTES.md §7.6。
    examples:
      - title: 查意外重启与蓝屏（EventID 41 或 1001）
        args: ["qe", "System", "/c:20", "/rd:true", "/f:text", "/q:*[System[(EventID=41) or (EventID=1001)]]"]
        expectExitCode: 0
      - title: 查 BugCheck（EventID 1001）
        args: ["qe", "System", "/c:20", "/rd:true", "/f:text", "/q:*[System[(EventID=1001)]]"]
        expectExitCode: 0

  # ============================================================ 导出
  - id: export-log
    category: 导出
    title: 导出日志为 .evtx 文件（epl / export-log）
    command: epl
    description: 把某个日志（或符合条件的部分事件）导出成一个 .evtx 文件，可以拿去别的机器看、或者存档。**这一步只新增文件**：它不删日志里的事件，所以比「清空日志」安全得多。默认**不覆盖**已存在的目标文件。
    danger: overwrite
    confirmText: 这会往你指定的目标文件写入事件数据（只新增/覆盖那个文件，**不会**改动或删除日志里的事件）。若目标文件已存在又没有勾选「直接覆盖」，wevtutil 会要求确认名字——宿主没有 stdin 可以回答，那条命令会直接失败。请先核对路径。确定继续？
    sources:
      - title: wevtutil 官方参考 —— {epl | export-log} <Path> <Exportfile> [/lf] [/sq] [/q] [/ow]
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
        retrieved: "2026-09-29"
        appliesTo: Windows 10/11
        note: 官方原文："{epl | export-log} <Path> <Exportfile> [/lf:<Logfile>] [/sq:<Structquery>] [/q:<Query>] [/ow:<Overwrite>] Exports events from an event log, from a log file, or using a structured query to the specified file."；/ow 原文："Specifies that the export file should be overwritten. <Overwrite> can be true or false. If true, and the export file specified in <Exportfile> already exists, it will be overwritten without confirmation."（**注意这里官方明确写了会有确认**）；官方示例 "wevtutil epl System C:\backup\system0506.evtx"。**本动作未实跑**（会写真实文件），见 NOTES.md §8.3。
    fields:
      # 官方语法是 epl <Path> <Exportfile> [选项]，两个位置参数都在开关之前
      - id: logName
        label: 日志名
        type: text
        style: positional
        required: true
        save: true
        placeholder: 例 System
        help: 要导出的日志名，来自 `wevtutil el`。导出整个 System 日志实测有 20 MB 量级，建议配合下面的查询串只导出需要的部分。
        doc: official #parameters 的 {epl | export-log} <Path> <Exportfile>（"By default, you provide a log name for <Path>."）
      - id: targetFile
        label: 导出到哪个文件（.evtx）
        type: file
        style: positional
        required: true
        save: true
        accept: [".evtx"]
        placeholder: 例 D:\backup\system.evtx
        help: 官方说明：<Exportfile> 是存放导出事件的文件路径。官方示例用 .evtx 扩展名（C:\backup\system0506.evtx）；导出的这个文件可以直接被「查询事件」之外的机器或事件查看器打开，也可以再用 wevtutil al 归档。
        doc: official #parameters 的 {epl | export-log} <Path> <Exportfile>（"<Exportfile> is a path to the file where the exported events will be stored."）
      - id: query
        label: XPath 查询串（/q，不填 = 全导出）
        type: textarea
        style: attached
        prefix: "/q:"
        group: 筛选
        advanced: true
        placeholder: 例 *[System[(Level=1 or Level=2)]]
        help: 官方原文：/q "Defines the XPath query to filter the events you want to export. If not specified, all events will be returned." 并提醒 "The command might take a long time if selecting many, but not all, events."。写法与「查询事件」的同一个字段完全一样（XPath 1.0）。留空 = 导出全部。
        doc: official #options 的 /q:<Query>（含"selecting many, but not all, events 可能很慢"的提醒）
      - id: overwrite
        label: 目标文件已存在时直接覆盖（/ow）
        type: bool
        style: flag
        prefix: "/ow:true"
        group: 覆盖
        default: false
        help: 官方原文：/ow "Specifies that the export file should be overwritten. <Overwrite> can be true or false. If true, and the export file specified in <Exportfile> already exists, it will be overwritten without confirmation."。**默认不勾**：不勾时官方文档说已经存在的文件要确认才覆盖，而宿主没有 stdin 可回答，会失败——但这比"默默覆盖掉你的备份文件"更安全。要覆盖就自己勾上。
        doc: official #options 的 /ow:<Overwrite>（"will be overwritten without confirmation"）
    output:
      mode: stream
      showCommandLine: true
      resultNote: '**未实跑**——它会真的写出文件。风险等级按规范 §2.9 定为 overwrite（只新增/覆盖目标文件，不动日志内容），所以用 confirmText 提示而不是降级成 execution: info。清单里的这条命令由「真机冒烟」那一轮**没有执行**，见 NOTES.md §8.3。'
    examples:
      - title: 把 System 日志导出到文件（官方示例形态）
        args: ["epl", "System", "D:\\backup\\system.evtx"]

  # ============================================================ 改动（危险区）
  - id: clear-log
    category: 改动（危险区）
    title: 清空日志（cl / clear-log）—— 不可逆
    command: cl
    danger: destructive
    confirmPhrase: "清空日志 {logName}"
    confirmText: 这会把该日志里的**全部事件永久删除**：事件查看器里再也看不到，chkdsk 报告、蓝屏记录、安装失败的历史都会一起消失，而且**无法撤销**（除非你同时填了备份文件）。系统自带的日志（System / Application / Security）清空时还会在日志里留下一条"日志已清除"的记录，但被清掉的内容回不来。请确认已想清楚。
    description: 清空一个日志里的所有事件，可选地在清空之前先把它们备份成 .evtx 文件。**这是本工具包里唯一会不可逆销毁数据、且默认无法用其它动作补救的操作**：日常排错几乎不需要它，所以它被单独放在「改动（危险区）」组里，并且需要逐字输入确认短语。
    sources:
      - title: wevtutil 官方参考 —— {cl | clear-log} <Logname> [/bu:<Backup>]
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
        retrieved: "2026-09-29"
        appliesTo: Windows 10/11
        note: 官方原文："{cl | clear-log} <Logname> [/bu:<Backup>] Clears events from the specified event log. The /bu option can be used to back up the cleared events."；/bu 原文："Specifies the path to a file where the cleared events will be stored. Include the .evtx extension in the name of the backup file."；官方示例 "wevtutil cl Application /bu:C:\admin\backups\al0306.evtx"（"Clear all of the events from the Application log after saving them"）。**本动作绝不实跑**（会真的删掉本机事件日志），见 NOTES.md §8.1。
    fields:
      - id: logName
        label: 日志名
        type: text
        style: positional
        required: true
        placeholder: 例 Application
        help: 要清空的日志名，来自 `wevtutil el`。**填 System 或 Application 会真的清掉本机的系统/应用日志记录**。名字不对会以退出码 15007 失败（不会"清空失败"以外的后果）。
        doc: official #parameters 的 {cl | clear-log} <Logname>（"You can retrieve a list of log names by typing wevtutil el."）
      - id: backupFile
        label: 清空前先备份到（/bu）
        type: file
        style: attached
        prefix: "/bu:"
        group: 备份
        save: true
        accept: [".evtx"]
        placeholder: 例 D:\backup\app-before-clear.evtx
        help: 官方原文：/bu "Specifies the path to a file where the cleared events will be stored. Include the .evtx extension in the name of the backup file."。**强烈建议填**：填了之后被清掉的事件还留在这个文件里，用事件查看器打开或拿 wevtutil 查都行。留空 = 直接清掉、不留备份。
        doc: official #options 的 /bu:<Backup>（"Include the .evtx extension in the name of the backup file."）
    output:
      mode: stream
      showCommandLine: true
      resultNote: '**本轮没有执行**（红线：会真的清掉本机事件日志）。因此这条动作的"实测退出码"一栏是空的——按规范 §2.9 它的风险等级是 destructive（不可逆毁掉现有数据），所以配 confirmPhrase 逐字确认，而不是降级成 execution: info 把功能藏起来（规范 §2.9 明确要求"再危险的操作也要在界面上留一条"）。理由与取舍见 NOTES.md §8.1。'
    examples:
      - title: 清空 Application 日志并先备份（官方示例原文）
        args: ["cl", "Application", "/bu:D:\\backup\\al-before-clear.evtx"]

  # ============================================================ 改动（危险区）
  - id: set-log-config
    category: 改动（危险区）
    title: 修改日志配置（sl / set-log）
    command: sl
    danger: overwrite
    confirmText: 这会**立即改动该日志的配置**：关掉日志会让它不再记录新事件，改小最大体积会让旧事件被更快覆盖，打开"保留旧事件"会让新事件在满时被丢弃。请逐项核对你要改的值——**界面里没填的那些开关不会出现在命令里，也就不改动对应设置**。确定继续？
    description: 改一个日志的配置：启用/停用、保留策略、最大体积、日志文件位置、隔离级别、以及只在专用会话日志上有效的等级/关键字过滤。**只填你想改的项**——留空的开关不会出现在命令行里。
    sources:
      - title: wevtutil 官方参考 —— {sl | set-log} <Logname> [/e] [/i] [/lfn] [/rt] [/ab] [/ms] [/l] [/k] [/ca] [/c]
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
        retrieved: "2026-09-29"
        appliesTo: Windows 10/11
        note: 官方原文："{sl | set-log} <Logname> [...] Modifies the configuration of the specified log."；各项取值见 #options：/e（true|false 启用或停用）、/rt（true = 满了保留旧事件并丢弃新事件，false = 覆盖最旧的事件）、/ab（true 时满时自动备份，**且 /rt 必须也是 true**）、/ms（字节，最小 1048576，且总会按 64KB 取整）、/lfn（事件日志服务存放该日志事件的**完整路径**）、/i（system|application|custom；custom 必须同时用 /ca 给安全描述符）、/l（只对专用会话日志有效，设 0 可移除等级过滤）、/k（64 位关键字掩码，只对专用会话日志有效）。本动作**未实跑**，见 NOTES.md §8.2。
    fields:
      - id: logName
        label: 日志名
        type: text
        style: positional
        required: true
        save: true
        placeholder: 例 Microsoft-Windows-WindowsUpdateClient/Operational
        help: 要改配置的日志名，来自 `wevtutil el`。**不要拿 System / Application / Security 试手**。官方还说明：若使用 /c（配置文件）就**不能**给日志名（日志名从配置文件里读）——本清单把两者做成"要么填日志名、要么用配置文件"，但没有做互斥校验（v1 的 visibleWhen 宿主尚未实现），请自己二选一，见 NOTES.md §9.2。
        doc: official #parameters 的 {sl | set-log} <Logname>（"If option /c is specified, <LOG_NAME> should not be specified since it is read from the config file."）
      - id: enabled
        label: 启用还是停用（/e）
        type: enum
        style: attached
        prefix: "/e:"
        group: 启用状态
        help: 官方原文：/e "Enables or disables a log. <Enabled> can be true or false."。**留空 = 不改**（默认不指定）。**停用日志会让它不再记录新事件**，勾选前请想清楚。
        doc: official #options 的 /e:<Enabled>（true | false）
        values:
          - value: ""
            label: 不修改（默认）
            isDefault: true
          - value: "true"
            label: "true —— 启用"
          - value: "false"
            label: "false —— 停用（不再记录新事件）"
      - id: retention
        label: 保留策略（/rt）
        type: enum
        style: attached
        prefix: "/rt:"
        group: 容量与保留
        help: 官方原文：/rt "Sets the log retention mode. <Retention> can be true or false. ... If an event log reaches its maximum size and the log retention mode is true, existing events are retained, and incoming events are discarded. If the log retention mode is false, incoming events overwrite the oldest events in the log."。**true = 满了丢新事件（保住旧证据）、false = 满了覆盖最旧事件（滚动）**。留空 = 不改。
        doc: official #options 的 /rt:<Retention>（true | false，含义见原文）
        values:
          - value: ""
            label: 不修改（默认）
            isDefault: true
          - value: "true"
            label: "true —— 保留旧事件、丢弃新事件"
          - value: "false"
            label: "false —— 用新事件覆盖最旧的事件"
      - id: autoBackup
        label: 满时自动备份（/ab）
        type: enum
        style: attached
        prefix: "/ab:"
        group: 容量与保留
        advanced: true
        help: 官方原文：/ab "Specifies the log auto-backup policy. ... If this value is true, the log will be backed up automatically when it reaches the maximum size. If this value is true, the retention (specified with the /rt option) must also be set to true." —— **注意这个前提**：开了 /ab 就必须同时有 /rt:true，否则配置会不成立。留空 = 不改。
        doc: official #options 的 /ab:<Auto>（true | false；附"必须同时 /rt:true"的前提）
        values:
          - value: ""
            label: 不修改（默认）
            isDefault: true
          - value: "true"
            label: "true —— 满时自动备份（前提：/rt 必须是 true）"
          - value: "false"
            label: "false —— 不自动备份"
      - id: maxSize
        label: 最大体积（字节，/ms）
        type: number
        style: attached
        prefix: "/ms:"
        group: 容量与保留
        placeholder: 例 20971520
        help: 官方原文：/ms "Sets the maximum size of the log in bytes. The minimum log size is 1048576 bytes (1024KB) and log files are always multiples of 64KB, so the value you enter will be rounded off accordingly."。**最小 1 MB，且会被取整到 64 KB 的倍数**。留空 = 不改。
        doc: official #options 的 /ms:<MaxSize>（最小值 1048576、按 64KB 取整）
      - id: logFileName
        label: 日志文件完整路径（/lfn）
        type: text
        style: attached
        prefix: "/lfn:"
        group: 高级
        advanced: true
        placeholder: 例 %SystemRoot%\System32\Winevt\Logs\MyChannel.evtx
        help: 官方原文：/lfn "Defines the log file name. <Logpath> is a full path to the file where the Event Log service stores events for this log."（**完整路径**）。改这个等于把这个日志的事件存到别处。留空 = 不改。
        doc: official #options 的 /lfn:<Logpath>（"a full path to the file"）
      - id: isolation
        label: 隔离级别（/i）
        type: enum
        style: attached
        prefix: "/i:"
        group: 高级
        advanced: true
        help: 官方原文：/i "Sets the log isolation mode. <Isolation> can be system, application or custom. ... If you specify custom isolation, you must also provide a security descriptor by using the /ca option."。选 custom 时必须同时填 /ca，否则配置不成立。留空 = 不改。
        doc: official #options 的 /i:<Isolation>（system | application | custom；custom 需配 /ca）
        values:
          - value: ""
            label: 不修改（默认）
            isDefault: true
          - value: system
            label: system —— 至少与 System 日志共享写权限
          - value: application
            label: application —— 至少与 Application 日志共享写权限
          - value: custom
            label: custom —— 自定义（必须同时填 /ca）
      - id: channelAccess
        label: 访问权限（SDDL，/ca）
        type: text
        style: attached
        prefix: "/ca:"
        group: 高级
        advanced: true
        placeholder: 例 O:BAG:SYD:(A;;0x1;;;IU)
        help: 官方原文：/ca "Sets the access permission for an event log. <Channel> is a security descriptor that uses the Security Descriptor Definition Language (SDDL)."（官方指向 MSDN 的 SDDL 说明）。选 custom 隔离级别时必须给。留空 = 不改。
        doc: official #options 的 /ca:<Channel>（SDDL 安全描述符）
      - id: level
        label: 等级过滤（/l，仅专用会话日志）
        type: number
        style: attached
        prefix: "/l:"
        group: 高级
        advanced: true
        placeholder: 例 0（0 = 移除过滤）
        help: 官方原文：/l "Defines the level filter of the log. <Level> can be any valid level value. This option is only applicable to logs with a dedicated session. You can remove a level filter by setting <Level> to 0."。**只对专用会话的日志有效**。留空 = 不改。
        doc: official #options 的 /l:<Level>（"only applicable to logs with a dedicated session"，0 = 移除）
      - id: keywords
        label: 关键字掩码（/k，仅专用会话日志）
        type: text
        style: attached
        prefix: "/k:"
        group: 高级
        advanced: true
        placeholder: 例 0x8000000000000000
        help: 官方原文：/k "Specifies the keywords filter of the log. <Keywords> can be any valid 64-bit keyword mask. This option is only applicable to logs with a dedicated session."。留空 = 不改。
        doc: official #options 的 /k:<Keywords>（64 位关键字掩码，仅专用会话日志）
      - id: configFile
        label: 用配置文件设置（/c，与上面各项二选一）
        type: file
        style: attached
        prefix: "/c:"
        group: 配置文件
        advanced: true
        accept: [".xml"]
        placeholder: 例 C:\config.xml
        help: 官方原文：/c "Specifies the path to a configuration file. This option will cause log properties to be read from the configuration file defined in <Config>. If you use this option, you must not specify a <Logname> parameter. The log name will be read from the configuration file."；而配置文件就是 `wevtutil gl <日志名> /f:xml` 的输出（官方 Remarks 一节给了完整样例）。**用了它就不要填上面的日志名**。
        doc: official #options 的 /c:<Config> + #remarks 的配置文件样例
    output:
      mode: stream
      showCommandLine: true
      resultNote: '**未实跑**——它会真的改写本机日志配置。清单只做声明：**没填的项不会出现在命令行里**，所以不会"顺手"把没想改的设置改掉。官方示例 wevtutil sl /c:config.xml 见 #examples。见 NOTES.md §8.2。'
    nextSteps:
      - title: 查看改完之后的配置
        action: query-log-config
        reason: 官方示例把「用 gl 导出 XML 配置 → 改 → 用 sl /c 导回」当作标准流程，所以改完再用 gl 核对一遍是它自己的用法
    examples:
      - title: 用配置文件设置日志属性（官方示例原文）
        args: ["sl", "/c:C:\\config.xml"]

  # ============================================================ 改动（危险区）
  - id: install-manifest
    category: 改动（危险区）
    title: 安装事件清单（im / install-manifest）
    command: im
    danger: overwrite
    confirmText: 这会按清单文件里的声明**往系统里注册事件提供程序与日志**（会写注册表与元数据）。清单文件的内容不会被界面检查——请自己确认它来自你信任的来源。已存在的提供程序/日志会根据清单里的定义被更新。确定继续？
    description: 从一个事件清单文件（`.man` / `.xml`，由开发者用 Windows Eventing SDK 编写）安装提供程序与日志。普通用户日常不需要它；它的存在是为了让"某个软件的事件源没注册上"这种情况有命令行可查。
    sources:
      - title: wevtutil 官方参考 —— {im | install-manifest} <Manifest> [/rf] [/mf] [/pf]
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
        retrieved: "2026-09-29"
        appliesTo: Windows 10/11
        note: 官方原文："{im | install-manifest} <Manifest> [/{rf | resourceFilePath}:value] [/{mf | messageFilePath}:value] [/{pf | parameterFilePath}:value] Installs event publishers and logs from a manifest."；/rf、/mf、/pf 分别替换清单里 Provider 元素的 ResourceFileName、MessageFileName、ParameterFileName 属性，"The value is the full path to the mentioned file."。官方示例 "wevtutil im myManifest.xml"（本机 `im /?` 的示例写的是 myManifest.man —— 同一件事，扩展名两种都可以）。**本动作未实跑**，见 NOTES.md §8.4。
    fields:
      - id: manifest
        label: 清单文件路径
        type: file
        style: positional
        required: true
        accept: [".man", ".xml"]
        placeholder: 例 D:\sdk\myManifest.man
        help: 官方说明：<Manifest> 是事件清单文件的路径；清单里定义的**全部**提供程序与日志都会被安装。清单格式见官方指向的 Windows Eventing SDK（MSDN）。**注意**：官方语法行把 /rf /mf /pf 写在方括号外、看起来像必需项，但官方示例 `wevtutil im myManifest.xml` 一个都没给、且本机 `/im /?` 的语法行 `wevtutil { im | install-manifest } <MANIFEST> [/OPTION:VALUE ...]` 把它们都放进可选位置——按"以官方示例为准"处理成可选，见 NOTES.md §6.4。
        doc: official #parameters 的 {im | install-manifest} <Manifest>（"File path to an event manifest. All publishers and logs defined in the manifest will be installed."）
      - id: resourceFilePath
        label: 替换资源文件路径（/rf）
        type: file
        style: attached
        prefix: "/rf:"
        group: 路径替换
        advanced: true
        placeholder: 例 C:\Windows\System32\wevtutil.exe
        help: 官方原文：/rf "ResourceFileName attribute of the Provider Element in the manifest to be replaced. The VALUE should be the full path to the resource file."。留空 = 不替换（用清单里写的值）。
        doc: official #parameters 的 /{rf | resourceFilePath}:value
      - id: messageFilePath
        label: 替换消息文件路径（/mf）
        type: file
        style: attached
        prefix: "/mf:"
        group: 路径替换
        advanced: true
        placeholder: 例 C:\Windows\System32\wevtutil.exe
        help: 官方原文：/mf "MessageFileName attribute of the Provider Element in the manifest to be replaced. The VALUE should be the full path to the message file."。留空 = 不替换。
        doc: official #parameters 的 /{mf | messageFilePath}:value
      - id: parameterFilePath
        label: 替换参数文件路径（/pf）
        type: file
        style: attached
        prefix: "/pf:"
        group: 路径替换
        advanced: true
        placeholder: 例 C:\Windows\System32\wevtutil.exe
        help: 官方原文：/pf "ParameterFileName attribute of the Provider Element in the manifest to be replaced. The VALUE should be the full path to the parameter file."。留空 = 不替换。
        doc: official #parameters 的 /{pf | parameterFilePath}:value
    output:
      mode: stream
      showCommandLine: true
      resultNote: '**未实跑**——它需要一份真实的事件清单文件，而且会往系统里注册提供程序与日志。清单里给了官方示例形态 (im myManifest.xml)。见 NOTES.md §8.4。'
    examples:
      - title: 安装清单里的提供程序与日志（官方示例形态）
        args: ["im", "D:\\sdk\\myManifest.xml"]

  # ============================================================ 改动（危险区）
  - id: uninstall-manifest
    category: 改动（危险区）
    title: 卸载事件清单（um / uninstall-manifest）
    command: um
    danger: destructive
    confirmPhrase: "卸载清单 {manifest}"
    confirmText: 这会把该清单里声明的提供程序与日志**从系统里注销掉**。已经写进日志里的事件不会因此消失，但依赖这个提供程序的消息渲染会失效（事件正文可能只显示数字 ID），而且**不能靠 wevtutil 撤销**——要恢复只能把同一个清单再 im 装一次。请确认你手上的清单文件与当初安装的是同一份。
    description: 把一份事件清单里声明的提供程序与日志从系统里卸载。与「安装事件清单」相对；作用范围就是那份清单声明的内容。
    sources:
      - title: wevtutil 官方参考 —— {um | uninstall-manifest} <Manifest>
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
        retrieved: "2026-09-29"
        appliesTo: Windows 10/11
        note: 官方原文："{um | uninstall-manifest} <Manifest> Uninstalls all publishers and logs from a manifest."；官方示例 "wevtutil um myManifest.xml"。**um 没有任何选项**（官方语法行与选项表里都没有），所以本动作只有清单路径一个字段。**本动作未实跑**，见 NOTES.md §8.4。
    fields:
      - id: manifest
        label: 清单文件路径
        type: file
        style: positional
        required: true
        accept: [".man", ".xml"]
        placeholder: 例 D:\sdk\myManifest.man
        help: 官方说明：<Manifest> 是事件清单文件的路径，清单里定义的**全部**提供程序与日志都会被卸载。卸载后要恢复，只能用同一份清单再执行一次「安装事件清单」。
        doc: official #parameters 的 {um | uninstall-manifest} <Manifest>（"Uninstalls all publishers and logs from a manifest."）
    output:
      mode: stream
      showCommandLine: true
      resultNote: '**未实跑**——它需要一份真实的事件清单文件，而且会真的从系统里注销提供程序与日志。见 NOTES.md §8.4。'
    examples:
      - title: 卸载清单里的提供程序与日志（官方示例形态）
        args: ["um", "D:\\sdk\\myManifest.xml"]
