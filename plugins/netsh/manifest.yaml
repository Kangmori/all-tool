  - id: advfirewall-firewall-show-rule
    category: 防火墙
    title: 查询防火墙规则
    description: >-
      按名字查询防火墙规则。`name=all` 会列出**全部**入站与出站规则
      （本机实测输出 **412866 B ≈ 403 KB**，会刷很久）。
      零命中时 netsh 打印 `No rules match the specified criteria.` 并返回**退出码 1**。
    command: "advfirewall"
    commandArgs: ["firewall", "show", "rule"]
    sources:
      - title: netsh advfirewall 官方参考 —— `firewall show rule`
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netsh-advfirewall
        retrieved: "2026-09-30"
        appliesTo: Windows 10/11
        note: >-
          页面：`firewall <show> rule name=<string>`，例子 `netsh advfirewall firewall show rule name=all`
          与 `netsh advfirewall firewall show rule name="MyRuleName" verbose`。
      - title: 本机 `netsh advfirewall firewall show rule` 实测输出
        url: file:///<仓库目录>/netsh 帮助快照（**未入库**）/advfirewall-firewall-show-rule-q.txt
        retrieved: "2026-09-30"
        appliesTo: Windows 11 26200 / netsh.exe 10.0.26100.8328
        note: >-
          不带 `name=` 直接跑会打印用法与退出码 1：
          `Usage: show rule name=<string> [profile=...] [type=static|dynamic] [verbose]`。
          本包只暴露 `name=`（其他可选参数见 NOTES §8「故意没做」）。
    fields:
      - id: ruleName
        label: 规则名（name=）
        type: text
        style: attached
        prefix: "name="
        required: true
        default: all
        placeholder: 例 all / Allow8080
        help: >-
          `all` = 全部规则（输出极大）；也可以用规则名或它的前缀。规则名含空格时必须带引号
          （官方例子 `name="allow browser"`），本字段生成的是**一个** token `name=<值>`，
          值里含空格时宿主会给整个 token 加引号。
          实测：`name=all` → 412866 B、退出码 0；`name=zzz__NoSuchRule__` →
          `No rules match the specified criteria.`、退出码 1。
        doc: 'official netsh-advfirewall 页的 `firewall show rule name=<string>` 与两个例子（`name=all`、`name="MyRuleName" verbose`）；本机 advfirewall-firewall-show-rule-q.txt 给出的 usage 行 `Usage: show rule name=<string>`'
    output:
      mode: stream
      showCommandLine: true
      resultNote: >-
        实测 `name=all` 输出 412866 B（≈403 KB）、退出码 0；`name=<不存在的名字>` 输出
        `No rules match the specified criteria.`、退出码 1。被规则名过滤时输出会小很多。
    examples:
      - title: 列出全部防火墙规则（输出很大）
        args: ["advfirewall", "firewall", "show", "rule", "name=all"]
        expectExitCode: 0

