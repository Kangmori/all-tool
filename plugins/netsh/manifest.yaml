      - title: netsh advfirewall 官方参考 —— `show allprofiles`
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netsh-advfirewall
        retrieved: "2026-09-30"
        appliesTo: Windows 10/11
        note: >-
          `netsh advfirewall show [allprofiles | currentprofile | domainprofile | privateprofile | publicprofile] <state> <firewallpolicy> <settings> <logging>`；
          参数表列出 state / firewallpolicy / settings / logging 各自含义。
      - title: 本机 `netsh advfirewall show allprofiles ?` 快照
        url: file:///<仓库目录>/netsh 帮助快照（**未入库**）/advfirewall-show-allprofiles-q.txt
        retrieved: "2026-09-30"
        appliesTo: Windows 11 26200 / netsh.exe 10.0.26100.8328
        note: '用法行 `Usage: show allprofiles [parameter]`，例子 `netsh advfirewall show allprofiles state`。'
    fields:
      - id: parameter
        label: 只看某一项（留空 = 全部属性）
        type: enum
        style: literal
        group: 高级
        advanced: true
        help: >-
          文档把四个参数列在 `show` 的说明里；**它们不是 `xxx=` 形式**，所以这里用 literal 原样输出。
          本机实测不带参数 2147 B、`state` 437 B，退出码都是 0。
        doc: 'official netsh-advfirewall 页 `show allprofiles <state|firewallpolicy|settings|logging>`；本机 `netsh advfirewall show allprofiles ?` 快照的 Parameters 一节'
        values:
          - value: ""
            label: 不指定（显示全部属性）
            isDefault: true
            args: []
          - value: state
            label: state —— 防火墙开/关
            args: ["state"]
          - value: firewallpolicy
            label: firewallpolicy —— 默认入站/出站行为
            args: ["firewallpolicy"]
          - value: settings
            label: settings —— 防火墙属性
            args: ["settings"]
          - value: logging
            label: logging —— 日志设置
            args: ["logging"]
    output:
      mode: stream
      showCommandLine: true
      resultNote: 实测不带参数 2147 B、退出码 0；`state` 437 B、退出码 0。查询不需要管理员。
