  - id: http-show-urlacl
    category: 代理与 Winsock
    title: 查看 URL 保留（urlacl）
    description: >-
      列出 HTTP.sys 的 URL 命名空间保留及其 DACL（哪些账号可以监听哪个 URL）。
      服务报「拒绝访问 / Access is denied」又确认端口没问题时，通常就是这里缺一条保留。
      留空 = 全部保留；填 URL = 只看那一条。
    command: "http"
    commandArgs: ["show", "urlacl"]
    sources:
      - title: netsh http 官方参考 —— `show urlacl`
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netsh-http
        retrieved: "2026-09-30"
        appliesTo: Windows 10/11
        note: >-
          语法行 `netsh http show urlacl [url=<string>]`；参数表：「Displays the DACLs for a specified reserved URL or for all reserved URLs」；
          例子 `netsh http show urlacl url=http://+:80/MyApp`。
      - title: 本机 `netsh http show urlacl ?` 快照
        url: file:///<仓库目录>/netsh 帮助快照（**未入库**）/http-show-urlacl-q.txt
        retrieved: "2026-09-30"
        appliesTo: Windows 11 26200 / netsh.exe 10.0.26100.8328
        note: '用法行 `Usage: show urlacl [url=]<string>`；`url=(null)` 省略时表示全部 URL。'
    fields:
      - id: url
        label: 保留的 URL（留空 = 全部）
        type: text
        style: separate
        prefix: "url"
        placeholder: 例 http://+:80/MyUri
        help: >-
          留空列出全部保留项（本机实测 3848 B）。填 URL 时**只写 URL 本身，不要写 `url=`** ——
          本字段会生成 `url` 与值两个 token，对应帮助里的 `[url=]<string>` 写法。
          本机两条实测：`url http://+:80/MyUri`（两个 token）输出 937 B 的该条保留项、退出码 0；
          `url=http://+:80/MyUri`（粘成一个 token）输出 46 B 的空标题 —— 两者都能跑但结果不同，
          本清单取**两个 token**那种（与文档的 `[url=]<string>` 一致，且真的查到了那条保留项）。
          宿主对含 `:` 与 `/` 的值会加引号。
        doc: 'official netsh-http 页的 `http show urlacl [url=<string>]` 与例子 `netsh http show urlacl url=http://+:80/MyApp`；本机 `netsh http show urlacl ?` 快照的 url 参数行（两种写法实测见 NOTES §3）'
    output:
      mode: stream
      showCommandLine: true
      resultNote: 实测留空 3848 B、退出码 0；指定一个不存在的 URL 时输出只有标题行（46 B）、退出码仍是 0。
    examples:
      - title: 列出全部 URL 保留
        args: ["http", "show", "urlacl"]
        expectExitCode: 0
      - title: 只看某一条 URL 保留
        args: ["http", "show", "urlacl", "http://+:80/Temporary_Listen_Addresses/"]
        expectExitCode: 0

