    title: 查看 HTTP 服务超时
    description: 显示 HTTP.sys 的空闲连接超时与请求头等待超时（秒）。
    command: "http"
    commandArgs: ["show", "timeout"]
    sources:
      - title: netsh http 官方参考 —— `show timeout`
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netsh-http
        retrieved: "2026-09-30"
        appliesTo: Windows 10/11
        note: '参数表：「Displays the timeout values set for the HTTP Service in seconds (`timeout`).」'
      - title: 本机 `netsh http show timeout` 实测输出
        url: file:///<仓库目录>/netsh 帮助快照（**未入库**）/http-show-timeout.txt
        retrieved: "2026-09-30"
        appliesTo: Windows 11 26200 / netsh.exe 10.0.26100.8328
        note: 实测 126 B、退出码 0（两个超时都是 120 秒）。
    fields: []
    output:
      mode: stream
      showCommandLine: true
      resultNote: 实测 126 B、退出码 0。
    examples:
      - title: 查看 HTTP 服务超时
        args: ["http", "show", "timeout"]
        expectExitCode: 0

