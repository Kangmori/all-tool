# yaml-language-server: $schema=../../docs/spec/manifest-v1.schema.json
#
# netsh —— Windows 自带的网络配置外壳（C:\Windows\System32\netsh.exe）。
#
# 参数知识来源（只有三类算数，见 playbook §0.2）：
#   1) 官方文档（Microsoft Learn，逐个 URL 都实际请求确认过 HTTP 200）：
#      · .../windows-commands/netsh                  → 总览：用法、`-c <Context>`、上下文/子上下文清单
#      · .../windows-commands/netsh-interface        → interface / ipv4 / ipv6 / portproxy 全部 `<show ...>` 语法
#      · .../windows-commands/netsh-wlan             → wlan 的 `show <...>` 清单与语法
#      · .../windows-commands/netsh-advfirewall      → advfirewall 的 `show <...>` 语法
#      · .../windows-commands/netsh-winhttp          → winhttp 的 `show <proxy|advproxy|tracing>`
#      · .../windows-commands/netsh-http             → http 的 `show <...>` 语法
#      · .../windows-commands/netsh-dnsclient        → dnsclient 的 `show <global|state|encryption>`
#   2) 本机 `netsh <上下文> ?` / `<上下文> show ?` 的真实输出（快照**不入库**，入 .gitignore）：
#      · `netsh ?`（2258 B，exit 1）、`netsh help`（2088 B，exit 0）、`netsh interface ?`（1241 B）
#      · `netsh interface ipv4 show ?`（1268 B）、`netsh interface ipv4 show config ?`（415 B）…
#   3) 官方文档与本机帮助**冲突时以官方为准**，差异逐条记进 NOTES.md §7。
#
# **这个包最关键的三条环境事实（全部实测，不是抄的）**：
#   ① 输出编码是 UTF-8，**不是** OEM/GBK。证据：`netsh interface ipv4 show config` 输出的原始字节里
#      中文接口名「以太网」是 e4 bb a5 e5 a4 aa e7 bd 91（合法 UTF-8）；同一串字节按 cp936 解出来是
#      「浠ュお缃?」乱码。本机控制台代码页是 936，所以这是**与其它 Windows 自带命令相反**的一例。
#   ② 退出码不是「0 = 成功」：`netsh ?` 退出码 1（而 `netsh help` 是 0）、
#      任何未知命令 1、接口名不存在 1、防火墙规则零命中 1、无线网卡被关闭时 1。
#   ③ `netsh interface ipv6 show config` **不存在**（本机实测 `The following command was not found`，退出码 1），
#      官方 netsh-interface 页的 ipv6 语法行里也确实没有它 —— 所以本包不收录（差分见 NOTES §7）。
#
# **多词子命令的表达方式（本包的核心规范用法，实测见 NOTES §3）**：
#   netsh 的上下文是**多级子命令**（`netsh interface ipv4 show config`），因此统一用
#   `command: <第一级>` + `commandArgs: [<第二级>, <第三级>, ...]`，即
#   一级一个 argv token，**不用** `-c` 把整条上下文塞进一个 token。
#   实测两条等价：`netsh -c interface ipv4 show config` 与 `netsh interface ipv4 show config`
#   输出都是 3084 B、退出码 0（前者多一个 `netsh>` 提示符，且会停在交互模式等输入）。
#
# 版本：netsh **没有**版本开关（实测 `netsh ?` / `netsh help` 都不打印版本），故不写
#       versionArgs / versionPattern / minVersion（R1）。exe 文件版本见 NOTES §1。
#
# 安全边界：本包 **39 个动作全部是只读查询**（覆盖 34 条不同的 netsh 命令）。`set` / `add` / `delete` /
#   `reset` / `winsock reset` / `interface ip reset` / `advfirewall reset` 等会改网络配置的动作
#   **一律不收录**（理由见 NOTES §8）——
#   这既是任务红线，也符合规范 §2.9「再危险也要留一条」的取舍：netsh 的写动作不是「风险大」，
#   而是「一次误点就会断网、且常常无法在非管理员账号下验证成功路径」，本包选择只做查询。

spec: 1
id: netsh
name: netsh
manifestVersion: 0.1.0
appVersion: Windows 10/11 自带（随系统版本发布；本机 netsh.exe 文件版本 10.0.26100.8328）
kind: system
summary: 查网络配置与状态
description: >-
  Windows 自带的网络配置外壳。本工具包只覆盖**只读查询**那一批：网卡列表与状态、
  IPv4/IPv6 地址与 DNS 服务器、路由表、邻居（ARP）缓存、无线接口与配置文件与可见网络、
  WinHTTP 与 Winsock 代理、防火墙配置与规则**查询**，以及 netsh 自身的帮助与上下文切换。
  会修改网络配置的 set / add / delete / reset 类动作刻意不收录。
homepage: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netsh
license: 随 Windows 操作系统分发（微软最终用户许可协议）
tags: [windows, 自带命令, 网络, 适配器, 路由, DNS, 无线, 防火墙, 代理]

sources:
  - title: netsh（Network shell）官方总览 —— Microsoft Learn
    url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netsh
    retrieved: "2026-09-30"
    appliesTo: Windows 10/11（页面标注 Windows 10 / 11 / Server 2016-2025）
    note: >-
      用法行 `netsh [-a <Aliasfile>] [-c <Context>] [-r <RemoteMachine>] [-u ...] [-p ...] [<Command> | -f <ScriptFile>]`；
      含上下文清单（interface / wlan / advfirewall / winhttp / http / dnsclient / winsock / …）与
      「子上下文」概念（interface 下有 ipv4 / ipv6 / tcp / udp / portproxy …）。本包用 ipv4 与 ipv6 的**全路径**写法，不用 `-c`。
  - title: netsh interface 官方参考（含 ipv4 / ipv6 / portproxy 的全部 `<show ...>` 语法）
    url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netsh-interface
    retrieved: "2026-09-30"
    appliesTo: Windows 10/11
    note: >-
      本包 ipv4 / ipv6 / portproxy 的每个动作都在这一页的语法行里逐条核对过（例如
      `netsh interface ipv4 show config [name=]<string>`、`netsh interface ipv4 show neighbors [interface=]<string> ...`）。
      **该页 ipv6 段没有 `show config`** —— 与本机实测一致（见 NOTES §7 第 1 条）。
  - title: netsh wlan 官方参考（全部 `show ...` 子命令）
    url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netsh-wlan
    retrieved: "2026-09-30"
    appliesTo: Windows 10/11
    note: >-
      语法块列出 `netsh wlan show all|drivers|filters|interfaces|networks|profiles|settings|tracing|wlanreport|...`。
      本包取 interfaces / profiles / networks / settings / drivers 五条只读项。
  - title: netsh advfirewall 官方参考
    url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netsh-advfirewall
    retrieved: "2026-09-30"
    appliesTo: Windows 10/11
    note: >-
      `netsh advfirewall show [allprofiles|currentprofile|domainprofile|privateprofile|publicprofile] <state|firewallpolicy|settings|logging>`、
      `netsh advfirewall show global <ipsec|statefulftp|statefulpptp|mainmode|categories>`；
      `firewall show rule name=<string>` 在该页的例子段出现（`netsh advfirewall firewall show rule name=all`）。
  - title: netsh winhttp 官方参考
    url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netsh-winhttp
    retrieved: "2026-09-30"
    appliesTo: Windows 10/11
    note: "`netsh winhttp show <advproxy|proxy|tracing>`；页面明确给了 `netsh winhttp show proxy` 这个例子。"
  - title: netsh http 官方参考
    url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netsh-http
    retrieved: "2026-09-30"
    appliesTo: Windows 10/11
    note: >-
      `netsh http show <cacheparam|iplisten|setting|timeout>` 与
      `netsh http show cachestate [url=]`、`servicestate [view=session|requestq|client] [verbose=yes|no]`、`urlacl [url=<string>]`。
  - title: netsh dnsclient 官方参考
    url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netsh-dnsclient
    retrieved: "2026-09-30"
    appliesTo: Windows 10/11
    note: "`netsh dnsclient show encryption [[server=]<IP address>]` 与 `netsh dnsclient show <global|state>`。"
  - title: 本机 `netsh ?` / `netsh help` / `netsh <上下文> [show] ?` 的真实输出快照
    url: file:///<仓库目录>/netsh 帮助快照（**未入库**，见 .gitignore；用 NOTES §10 的命令重新抓取）
    retrieved: "2026-09-30"
    appliesTo: Windows 11 26200 / netsh.exe 10.0.26100.8328（账号 kangmori\steve，**非管理员**）
    note: >-
      共 60+ 份快照，覆盖根上下文与 interface / interface ipv4 / interface ipv6 / interface tcp / interface udp /
      interface portproxy / wlan / advfirewall / winhttp / winsock / http / dnsclient 的 `?` 与 `show ?`。
      本包每个动作的 `doc` 都指向其中具体某一份。

locate:
  executable: netsh.exe
  searchPaths:
    - "%SystemRoot%\\System32"
  notFoundHint: netsh.exe 是 Windows 自带命令，正常情况下都在 C:\Windows\System32 下。

runtime:
  # 实测：输出是 UTF-8（证据见文件头注释 ① 与 NOTES §4）。**不是** oem/gbk ——
  # 本机控制台代码页是 936，所以写 oem 会让中文接口名全部乱码。
  encoding: utf-8
  useShell: false
  requiresAdmin: false
  workingDirectory: inherit
  # 防火墙规则全量查询实测输出 412 KB、`wlan show all` 实测 34 KB，都不快但也不会卡死，故不设超时上限。
  timeoutSeconds: 0
  preventConcurrentRuns: false
  usePseudoConsole: false

# 退出码：微软的 netsh 文档**没有**退出码章节（已逐个页面核对）。下面来自实测，见 NOTES §5。
exitCodes:
  - code: 0
    meaning: >-
      查询完成。注意：**「0」只代表命令被识别并执行了**，不代表有结果 ——
      `interface ipv6 show neighbors` 在本机输出 11737 B、退出码 0；
      而 `interface portproxy show all` 没有任何端口代理时输出 2 B（空）、退出码同样是 0。
    severity: ok
  - code: 1
    meaning: >-
      命令没跑成，或查询目标不存在。实测触发场景：未知上下文/子命令
      （`The following command was not found: ...`）、接口名不存在
      （`The filename, directory name, or volume label syntax is incorrect.`）、
      防火墙规则零命中（`No rules match the specified criteria.`）、
      无线网卡被关闭时 `wlan show networks`、以及根帮助 `netsh ?`。
    severity: error

actions:

  # ===================================================== 帮助与上下文
  - id: help
    category: 帮助与上下文
    title: 列出全部上下文（help）
    description: >-
      显示 netsh 根上下文里的命令与全部一级上下文（interface / wlan / advfirewall / winhttp / http /
      dnsclient / winsock / ipsec / trace …）。主窗口标题栏里那条总览命令。
    command: "help"
    sources:
      - title: netsh 官方总览 —— 上下文与子上下文
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netsh
        retrieved: "2026-09-30"
        appliesTo: Windows 10/11
        note: 页面写着「You can obtain a list of netsh contexts by running `netsh ?` or `netsh help`」。
    fields: []
    output:
      mode: stream
      showCommandLine: true
      resultNote: 实测本机输出 2088 B、退出码 0。（同一份内容用 `netsh ?` 取，退出码是 1。）
    examples:
      - title: 列出全部上下文
        args: ["help"]
        expectExitCode: 0

  - id: context-help
    category: 帮助与上下文
    title: 查看某个上下文的命令
    description: >-
      进入指定上下文并列出它的命令与子上下文。等价于在 netsh 里敲 `interface ?` 或 `interface help`。
      参数是**一级上下文名**，可以带通配写法（本机实测 `int` 与 `interface` 等价）。
    command: "help"
    commandArgs: ["{context}"]
    sources:
      - title: netsh 官方总览 —— 上下文
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netsh
        retrieved: "2026-09-30"
        appliesTo: Windows 10/11
        note: >-
          页面：「To view help for a command, type the command, followed by a space, and then type ?」，
          并给出 `netsh> interface help` 的完整示例输出。
    fields:
      - id: context
        label: 上下文
        type: text
        style: positional
        required: true
        default: interface
        placeholder: 例 interface / wlan / advfirewall / winhttp / http / dnsclient / winsock
        help: 只写一级上下文名，不要写子上下文（子上下文请用「查看某个子上下文的命令」）。
        doc: 'official 总览页的「Command contexts」一节（列出全部一级上下文）与本机 `netsh ?` 快照的命令清单'
    output:
      mode: stream
      showCommandLine: true
      resultNote: 实测 `interface help` 1241 B、`wlan help` 898 B、`advfirewall help` 980 B，退出码都是 0。
    examples:
      - title: interface 上下文的命令
        args: ["interface", "help"]
        expectExitCode: 0
      - title: wlan 上下文的命令
        args: ["wlan", "help"]
        expectExitCode: 0

  - id: subcontext-help
    category: 帮助与上下文
    title: 查看某个子上下文的命令
    description: >-
      两级上下文一起查，例如 `interface ipv4 ?`（本机实测输出 650 B）、
      `interface ipv4 show ?`（1268 B，列出全部 `show` 子命令）。
      想确认「这个子上下文里到底有什么能查」时用它。
    command: "help"
    commandArgs: ["{parent}", "{child}"]
    sources:
      - title: netsh interface 官方参考 —— ipv4 / ipv6 / portproxy 子上下文
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netsh-interface
        retrieved: "2026-09-30"
        appliesTo: Windows 10/11
        note: 页面的语法块按 `netsh interface ipv4 ...` / `netsh interface ipv6 ...` / `netsh interface portproxy ...` 分节。
    fields:
      - id: parent
        label: 一级上下文
        type: text
        style: positional
        required: true
        default: interface
        placeholder: 例 interface
        doc: 'official 总览页的子上下文清单；本机 `netsh interface ?` 快照（1241 B）'
      - id: child
        label: 子上下文
        type: text
        style: positional
        required: true
        default: ipv4
        placeholder: 例 ipv4 / ipv6 / tcp / udp / portproxy / firewall
        doc: 'official netsh-interface 页语法块的 ipv4 / ipv6 / portproxy；本机 `netsh interface ?` 快照里列的 6to4/ipv4/ipv6/tcp/udp/portproxy'
    output:
      mode: stream
      showCommandLine: true
      resultNote: 实测 `interface ipv4 help` 650 B、`interface ipv4 show ?` 1268 B、`interface ipv6 help` 763 B，退出码都是 0。
    examples:
      - title: ipv4 子上下文的命令
        args: ["interface", "ipv4", "help"]
        expectExitCode: 0
      - title: ipv4 里全部 show 子命令
        args: ["interface", "ipv4", "show", "?"]
        expectExitCode: 0

  # ===================================================== 网卡与接口
  - id: show-interfaces
    category: 网卡与接口
    title: 列出网卡与状态
    description: >-
      一条一行列出全部接口：管理状态（Enabled/Disabled）、连接状态
      （Connected/Disconnected）、类型（Dedicated）与接口名。
      带接口名时改为显示该接口的类型、管理状态与连接状态。**排查网络问题的第一条命令。**
    command: "interface"
    commandArgs: ["show", "interface"]
    sources:
      - title: netsh interface 官方参考 —— `netsh interface show ...`
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netsh-interface
        retrieved: "2026-09-30"
        appliesTo: Windows 10/11
        note: >-
          语法块首行 `netsh interface [6to4 | ... | set | show | tcp | ...]`；
          `show interface [name=]<string>` 的用法与例子来自本机 `netsh interface show interface ?` 快照（929 B，
          例子是 `show interface name="Wired Ethernet Connection"`）。
      - title: 本机 `netsh interface show interface ?` 快照
        url: file:///<仓库目录>/netsh 帮助快照（**未入库**）/interface-show-interface-q.txt
        retrieved: "2026-09-30"
        appliesTo: Windows 11 26200 / netsh.exe 10.0.26100.8328
        note: '参数一节只有一行：`name - Name of a specific interface to show current parameter settings.`'
    fields:
      - id: ifName
        label: 接口名（留空 = 全部接口）
        type: text
        style: positional
        placeholder: 例 以太网 / WLAN（也可用索引 18）
        group: 高级
        advanced: true
        help: >-
          留空列出全部接口。填名字时**只写名字**，不要写 `name=`（本机实测 `name=以太网` 与裸写 `以太网`
          输出都是 198 B、退出码 0）。名字含空格时宿主会自动加引号。
        doc: >-
          official netsh-interface 页的 `netsh interface show ...` 行 + 本机 `netsh interface show interface ?` 快照的 `name` 参数行
          （本机实测裸值与 `name=` 两种写法等价，见 NOTES §3）
    output:
      mode: stream
      showCommandLine: true
      resultNote: 实测「全部接口」409 B、退出码 0（本机 4 个接口，含 2 个 VMware 虚拟网卡）。
    examples:
      - title: 列出全部网卡
        args: ["interface", "show", "interface"]
        expectExitCode: 0

  - id: ipv4-show-config
    category: 网卡与接口
    title: 查看 IPv4 地址配置
    description: >-
      显示接口的 IPv4 配置：是否启用 DHCP、IP 地址、子网前缀与掩码、默认网关、网关与接口跃点、
      以及 DHCP 或静态配置的 DNS / WINS 服务器。**替代「网络和共享中心 → 详细信息」的那一屏。**
    command: "interface"
    commandArgs: ["ipv4", "show", "config"]
    sources:
      - title: netsh interface 官方参考 —— `ipv4 show config`
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netsh-interface
        retrieved: "2026-09-30"
        appliesTo: Windows 10/11
        note: >-
          语法行 `netsh interface ipv4 show config [name=]<string>`；参数表写着
          「`name` - Specifies the interface name or index」，且该节列出了输出字段
          （DHCP enabled / IP Address / Subnet Mask / Default Gateway / Gateway Metric / Interface Metric）。
      - title: 本机 `netsh interface ipv4 show config ?` 快照
        url: file:///<仓库目录>/netsh 帮助快照（**未入库**）/interface-ipv4-show-config-q.txt
        retrieved: "2026-09-30"
        appliesTo: Windows 11 26200 / netsh.exe 10.0.26100.8328
        note: '用法行 `Usage: show config [[name=]<string>]`，例子 `show config "Wired Ethernet Connection"`（说明名字含空格即可，无需写 name=）。'
    fields:
      - id: ifName
        label: 接口名或索引（留空 = 全部接口）
        type: text
        style: positional
        placeholder: 例 以太网 / 18
        help: >-
          只写名字或索引，不要写 `name=`。实测三种写法都可用且结果一致：
          留空（3084 B，全部接口）、`以太网`（531 B）、`name=以太网`（531 B）、`name=18`（531 B，按索引）。
        doc: >-
          official netsh-interface 页的 `ipv4 show config [name=]<string>` + 本机
          `netsh interface ipv4 show config ?` 快照的 `name` 参数行（多写法实测见 NOTES §3）
    output:
      mode: stream
      showCommandLine: true
      resultNote: 实测不带参数 3084 B、退出码 0；带接口名 531 B、退出码 0。
    examples:
      - title: 查看全部接口的 IPv4 配置
        args: ["interface", "ipv4", "show", "config"]
        expectExitCode: 0
      - title: 只看某个接口（按名字）
        args: ["interface", "ipv4", "show", "config", "以太网"]
        expectExitCode: 0

  - id: ipv6-show-addresses
    category: 网卡与接口
    title: 查看 IPv6 地址
    description: >-
      按接口列出 IPv6 地址，每条带地址类型（Dhcp / Public / Temporary / Other）、
      DAD 状态与有效/首选生存期。**注意：IPv6 没有 `show config`**（本机实测不是有效命令），
      所以这一条只能看地址，DNS 服务器用单独的动作。
    command: "interface"
    commandArgs: ["ipv6", "show", "addresses"]
    sources:
      - title: netsh interface 官方参考 —— `ipv6 show addresses`
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netsh-interface
        retrieved: "2026-09-30"
        appliesTo: Windows 10/11
        note: '语法行 `netsh interface ipv6 show addresses [interface=]<string> [level=]normal|verbose [store=]active|persistent`。'
      - title: 本机 `netsh interface ipv6 show addresses ?` 快照
        url: file:///<仓库目录>/netsh 帮助快照（**未入库**）/interface-ipv6-show-addresses-q.txt
        retrieved: "2026-09-30"
