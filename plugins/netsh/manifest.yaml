  - id: http-show-servicestate
    category: 代理与 Winsock
    title: 查看 HTTP 服务状态快照
    description: >-
      显示 HTTP.sys 当前状态的快照：活动会话、请求队列或客户端连接。
      判断「谁在占着 80/443、请求排在哪个队列里」时用它。
    command: "http"
    commandArgs: ["show", "servicestate"]
    sources:
      - title: netsh http 官方参考 —— `show servicestate`
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netsh-http
        retrieved: "2026-09-30"
        appliesTo: Windows 10/11
        note: >-
          语法行 `netsh http show servicestate [view=session|requestq|client] [verbose=yes|no]`；
          参数表说明 view 的三个取值，例子 `show servicestate view="session"`。
      - title: 本机 `netsh http show servicestate ?` 快照
        url: file:///<仓库目录>/netsh 帮助快照（**未入库**）/http-show-servicestate-q.txt
        retrieved: "2026-09-30"
        appliesTo: Windows 11 26200 / netsh.exe 10.0.26100.8328
        note: '用法行 `Usage: show servicestate [[view=]session|requestq|client] [[verbose=]yes|no]`；实测不带参数 4526 B、退出码 0。'
    fields:
      - id: view
        label: 查看角度
        type: enum
        style: literal
        group: 高级
        advanced: true
        help: >-
          对应文档里的 `view=session|requestq|client`。不选时 netsh 自己给默认视图
          （本机实测不带参数 4526 B、退出码 0；`view=session` 也是 4526 B）。
        doc: 'official netsh-http 页的 `http show servicestate [view=session|requestq|client] [verbose=yes|no]`；本机 `netsh http show servicestate ?` 快照的 view 参数行'
        values:
          - value: ""
            label: 不指定（netsh 默认视图）
            isDefault: true
            args: []
          - value: session
            label: session —— 活动会话
            args: ["view=session"]
          - value: requestq
            label: requestq —— 请求队列状态
            args: ["view=requestq"]
          - value: client
            label: client —— 客户端连接
            args: ["view=client"]
      - id: verbose
        label: 详细输出
        type: enum
        style: literal
        group: 高级
        advanced: true
        help: '对应文档里的 `verbose=yes|no`。yes 会连属性信息一起打印。'
        doc: 'official netsh-http 页的 `http show servicestate ... [verbose=yes|no]`；本机 `netsh http show servicestate ?` 快照的 verbose 参数行'
        values:
          - value: ""
            label: 不指定
            isDefault: true
            args: []
          - value: "yes"
            label: "yes —— 打印属性明细"
            args: ["verbose=yes"]
          - value: "no"
            label: "no —— 简要"
            args: ["verbose=no"]
    output:
      mode: stream
      showCommandLine: true
      resultNote: 实测不带参数 4526 B、退出码 0。
    examples:
      - title: 查看 HTTP 服务状态快照
        args: ["http", "show", "servicestate"]
        expectExitCode: 0
      - title: 只看活动会话
        args: ["http", "show", "servicestate", "view=session"]
        expectExitCode: 0
