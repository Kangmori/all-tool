      **没有参数**（官方与 `?` 都写着 no parameters）。
    command: "wlan"
    commandArgs: ["show", "interfaces"]
    sources:
      - title: netsh wlan 官方参考 —— `show interfaces`
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netsh-wlan
        retrieved: "2026-09-30"
        appliesTo: Windows 10/11
        note: '语法块含 `netsh wlan show interfaces`；参数表：「`interfaces` - Lists all wireless LAN interfaces detected on the system.」'
      - title: 本机 `netsh wlan show interfaces ?` 快照
        url: file:///<仓库目录>/netsh 帮助快照（**未入库**）/wlan-show-interfaces-q.txt
        retrieved: "2026-09-30"
        appliesTo: Windows 11 26200 / netsh.exe 10.0.26100.8328
        note: '帮助明确写「There are no parameters for this command.」'
    fields: []
    output:
      mode: stream
      showCommandLine: true
      resultNote: 实测 420 B、退出码 0（本机 1 个无线接口 WLAN，State=disconnected，无线电状态为 Hardware On / Software Off）。
    examples:
      - title: 查看无线接口
        args: ["wlan", "show", "interfaces"]
        expectExitCode: 0

  - id: wlan-show-profiles
    category: 无线（WLAN）
    title: 查看无线配置文件
    description: >-
      列出本机保存的无线配置文件（每条带 SSID 与描述）。留空 = 只列清单；
      填了名字 = 显示该配置文件的完整内容（XML 式的键值）。
    command: "wlan"
    commandArgs: ["show", "profiles"]
    sources:
      - title: netsh wlan 官方参考 —— `show profiles`
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netsh-wlan
        retrieved: "2026-09-30"
        appliesTo: Windows 10/11
        note: >-
          语法块含 `netsh wlan show profiles`；参数表：「`profiles` - Lists all configured wireless network profiles.」。
          本机 `netsh wlan show profiles ?` 快照（1228 B）给出完整参数：`name`（配置文件名的子串匹配）、
          `interface`、`key`（只有写 `key=clear` 且调用者是**本地管理员**时才显示明文密钥）。
      - title: 本机 `netsh wlan show profiles ?` 快照
        url: file:///<仓库目录>/netsh 帮助快照（**未入库**）/wlan-show-profiles-q.txt
        retrieved: "2026-09-30"
        appliesTo: Windows 11 26200 / netsh.exe 10.0.26100.8328
        note: >-
          帮助里的例子 `show profiles name="profile 1" interface="Wireless Network Connection"`。
          另注意：`key=clear` **本包不收录**（需要管理员，且属于「读取已保存的 Wi-Fi 明文密码」，
          不适合做成一个点的动作；见 NOTES §8）。
    fields:
      - id: profileName
        label: 配置文件名（留空 = 只列清单）
        type: text
        style: separate
        prefix: "name"
        placeholder: 例 王のWIFI
        help: >-
          留空只列配置文件名与描述；填了名字则打印该配置文件的完整内容（可用通配符，
          本机实测 `name=*` → 23667 B，把 17 个配置文件全展开）。
          本机的配置文件是按 **SSID** 命名的（例如 `王のWIFI`、`上海未知生物研究所_5G`），
          所以 `name=WLAN`（拿无线接口名去查）会报 `Profile "WLAN" is not found on the system.`、退出码 1 ——
          那**不是**命令写错，而是接口名与配置文件名的概念不同（见 NOTES §7）。
        doc: 'official netsh-wlan 页的 `netsh wlan show profiles` + 本机 `netsh wlan show profiles ?` 快照的 name 参数行与例子 `show profiles name="profile 1"`'
    output:
      mode: stream
      showCommandLine: true
      resultNote: 实测不带参数 906 B、退出码 0。
    examples:
      - title: 列出全部无线配置文件
        args: ["wlan", "show", "profiles"]
        expectExitCode: 0

  - id: wlan-show-networks
    category: 无线（WLAN）
    title: 查看可见无线网络
    description: >-
      列出当前可见的无线网络（SSID、信号、认证与加密方式）。
      加 `mode=bssid` 时再展开每个 SSID 下可见的 BSSID 明细。
      **本机实测退出码 1**：无线网卡无线电被关（Radio: Software Off）时 netsh 报
      `The wireless local area network interface is powered down and doesn't support the requested operation.`。
    command: "wlan"
    commandArgs: ["show", "networks"]
    sources:
      - title: netsh wlan 官方参考 —— `show networks`
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netsh-wlan
        retrieved: "2026-09-30"
        appliesTo: Windows 10/11
        note: '语法块含 `netsh wlan show networks`；参数表：「`networks` - Displays all visible wireless networks in range.」'
      - title: 本机 `netsh wlan show networks ?` 快照
        url: file:///<仓库目录>/netsh 帮助快照（**未入库**）/wlan-show-networks-q.txt
        retrieved: "2026-09-30"
        appliesTo: Windows 11 26200 / netsh.exe 10.0.26100.8328
        note: '参数：`interface`（无线接口名）与 `mode`（`ssid` / `bssid`，例子写 `show networks mode=Bssid`）。'
    fields:
      - id: interface
        label: 无线接口名（留空 = 全部）
        type: text
        style: attached
        prefix: "interface="
        placeholder: 例 WLAN
        group: 高级
        advanced: true
        help: >-
          留空列出所有接口可见的网络。本机只有一个名为 WLAN 的无线接口。
          **这里是 `attached` 而不是 `positional`**：本机实测裸写 `show networks WLAN` 会被当成非法参数
          （`One or more parameters for the command are not correct or missing.`、退出码 1），
          必须写 `interface=WLAN` —— 与 `wlan show drivers` 正相反（见 NOTES §3）。
        doc: 'official netsh-wlan 页的 `netsh wlan show networks` + 本机 `netsh wlan show networks ?` 快照的 interface 参数行（两种写法实测见 NOTES §3）'
      - id: mode
        label: 明细模式
        type: enum
        style: literal
        group: 高级
        advanced: true
        help: >-
          对应帮助里的 `mode=ssid/bssid`。不选 = 只列 SSID；bssid = 额外列出每个 SSID 的可见 BSSID。
          **本机没法验证 bssid 的差异**：无线关着，两种写法都返回同一个错误（见 NOTES §9）。
        doc: '本机 `netsh wlan show networks ?` 快照的参数节（`mode - Get detailed bssid information.`）与例子 `show networks mode=Bssid`'
        values:
          - value: ""
            label: 不指定（只列 SSID）
            isDefault: true
            args: []
          - value: bssid
            label: bssid —— 展开 BSSID 明细
            args: ["mode=bssid"]
    output:
      mode: stream
      showCommandLine: true
      resultNote: >-
        实测退出码 **1**：本机无线网卡无线电处于 Software Off（`wlan show interfaces` 可见），
        netsh 直接报 wired-down 错误、输出 135 B。这不是本工具包的问题，是环境状态。
    examples:
      - title: 列出可见无线网络
        args: ["wlan", "show", "networks"]

