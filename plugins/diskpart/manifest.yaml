  - id: format
    title: 格式化当前卷
    description: >-
      格式化当前卷（可指定文件系统与卷标）。**格式化会清空该卷上的数据**，所以不由宿主执行——
      命令拼好后由你复制到终端里自己回车。
    category: 危险操作
    command: ""
    execution: info
    sessionCommand: "format fs={fs} label={label} quick"
    requires: [volume]
    requiresHint: 先执行「选择卷」
    danger: destructive
    confirmText: 官方语法：format volume [/FS:file-system] [/V:label] [/Q] ...；/Q 是快速格式化，仍然会清空卷上的数据。
    fields:
      - id: fs
        label: 文件系统
        type: enum
        style: positional
        required: true
        values:
          - { value: ntfs, label: "ntfs —— Windows 默认", isDefault: true }
          - { value: refs, label: "refs —— 弹性文件系统（服务器场景）" }
          - { value: fat, label: "fat —— 老式 FAT16" }
          - { value: fat32, label: "fat32 —— U 盘常用，单文件上限 4 GB" }
          - { value: exfat, label: "exfat —— 大容量移动介质" }
        help: 可选值见「查看当前卷支持的文件系统」（filesystems 动作）。
        doc: official format 页语法 /FS:file-system
      - id: label
        label: 卷标
        type: text
        style: positional
        required: false
        placeholder: "DATA"
        doc: official format 页语法 /V:label
    output:
      mode: stream
      showCommandLine: true
    sources:
      - title: Microsoft Learn —— diskpart 的 format 命令
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/format
        retrieved: "2026-09-29"
        appliesTo: Windows 10/11
        note: "语法：format volume [/FS:file-system] [/V:label] [/Q] [/L[:state]] [/A:size] [/C] [/I:state] [/X] [/P:passes] [/S:state]（另有 FAT/FAT32 专用形式）。"

  - id: convert-gpt
