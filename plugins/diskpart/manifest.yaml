        retrieved: "2026-09-29"
        appliesTo: Windows 10/11
        note: "语法：convert { basic | dynamic | gpt | mbr }。"
      - title: Microsoft Learn —— diskpart（主页面命令表）
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/diskpart
        retrieved: "2026-09-29"
        appliesTo: Windows 10/11
        note: "主页面说明磁盘分区风格 MBR / GPT，以及运行 diskpart 需要管理员权限。"

