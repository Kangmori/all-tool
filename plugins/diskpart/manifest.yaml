    sessionCommand: "offline disk"
    requires: [disk]
    requiresHint: 先执行「选择磁盘」
    danger: destructive
    confirmText: 脱机后该磁盘上的卷在系统里不可访问，直到重新联机。
    fields: []
    output:
      mode: stream
      showCommandLine: true
    sources:
      - title: Microsoft Learn —— diskpart 的 offline 命令
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/offline
        retrieved: "2026-09-29"
        appliesTo: Windows 10/11
        note: "语法：offline { disk | volume }。"

