        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/delete
        retrieved: "2026-09-29"
        appliesTo: Windows 10/11
        note: "语法：delete { disk | partition | volume }；参数表：Delete partition —— Deletes a partition。"

  - id: delete-volume
    title: 删除卷
