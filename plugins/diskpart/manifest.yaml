    requiresHint: 先执行「选择磁盘」
    danger: destructive
    confirmText: 官方把 convert 描述为转换分区风格；对含数据的分区表改动属于不可逆操作。
    fields: []
    output:
      mode: stream
      showCommandLine: true
    sources:
