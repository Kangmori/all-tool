# yaml-language-server: $schema=../../docs/spec/manifest-v1.schema.json
#
# cleanmgr —— Windows 自带的磁盘清理工具（C:\Windows\System32\cleanmgr.exe）。
#
# **这个工具包的性质与前面几个完全不同，先把话说在前面（都实测过，见 NOTES.md §7）**：
#   1) cleanmgr 是 **GUI 子系统程序**。实测 `cleanmgr /?` **既不输出到 stdout 也不输出到 stderr**
#      （两者都是 0 字节），而是**弹出一个 Windows 对话框**（窗口标题实测为 "USAGE"）并一直等用户点确定。
#      我的抓取脚本因此加了超时保护，8 秒后取窗口标题当证据并杀掉进程 —— 否则脚本会永久挂住（真的挂过 300 秒）。
#      结论：宿主在 stdout 里**什么也看不到**，界面只能靠"命令已结束 + 退出码"来判断。
#   2) 它**真的会删文件**。所以 /sagerun、/tuneup、/lowdisk、/verylowdisk、/autoclean 这些
#      会动手的动作全部标 destructive 或 overwrite 并写了 confirmText；本批**一律未实跑**。
#   3) /sageset 会弹设置对话框（同样什么也不输出）。
#
# 参数知识来源：
#   1) 官方文档 https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/cleanmgr
#      离线快照 Microsoft Learn 官方文档（见各动作的 sources）/cleanmgr.html（参数表 9 行）
#   2) 补充文档 https://learn.microsoft.com/en-us/troubleshoot/windows-server/backup-and-storage/automating-disk-cleanup-tool
#      离线快照 Microsoft Learn 官方文档（见各动作的 sources）/cleanmgr-aux.html（讲 /sageset + /sagerun 的组合用法）
#   3) 本机实测：`cleanmgr /?` 不产生任何控制台输出（见上）
#
# **没有用本机 /? 核对开关** —— 因为它没有控制台帮助。这是本批唯一一个"只能靠官方文档"的工具包，
# 已如实记在 NOTES.md §2.3 与 §7。也正因为如此，本清单**只收录官方参数表里明确列出的 8 个开关**。
#
# 版本：Windows 自带命令没有 --version 开关，故不写 versionArgs/versionPattern（R1）。
# 编码：没有控制台输出，encoding 实际不起作用；仍写 oem 与本批其它包保持一致（见 NOTES.md §5）。

spec: 1
id: cleanmgr
name: cleanmgr
manifestVersion: 0.1.0
appVersion: Windows 10/11 自带（随系统版本发布）
description: 磁盘清理工具。可以手动选择要清理的项目，也可以把选择结果存成编号（/sageset + /sagerun）以后无人值守地重复执行。Windows 自带，是 GUI 程序。
homepage: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/cleanmgr
license: 随 Windows 操作系统分发（微软最终用户许可协议）
tags: [windows, 自带命令, 磁盘, 清理, GUI 程序]

sources:
  - title: cleanmgr 命令官方参考（Microsoft Learn）
    url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/cleanmgr
    retrieved: "2026-09-27"
    appliesTo: Windows 10/11
    note: 离线快照 Microsoft Learn 官方文档（见各动作的 sources）/cleanmgr.html。语法行：cleanmgr [/d <driveletter>] [/sageset:n] [/sagerun:n] [/TUNEUP:n] [/LOWDISK] [/VERYLOWDISK]；参数表另有 /autoclean。
  - title: 自动化磁盘清理工具（Microsoft Learn 疑难解答文档）
    url: https://learn.microsoft.com/en-us/troubleshoot/windows-server/backup-and-storage/automating-disk-cleanup-tool
    retrieved: "2026-09-27"
    appliesTo: Windows 10/11
    note: 离线快照 Microsoft Learn 官方文档（见各动作的 sources）/cleanmgr-aux.html。这份文档解释 /sageset:n 与 /sagerun:n 的配合方式：先用 /sageset 在对话框里勾选并保存到编号 n，再用 /sagerun:n 按该编号执行。
  - title: 本机 `cleanmgr /?` 的实测结论
    url: file:///D:/AI/All Tool/本机帮助快照（**未入库**，可用下列命令重新抓取）/cleanmgr.txt
    retrieved: "2026-09-27"
    appliesTo: Windows 11 26200 / cleanmgr.exe 文件版本 10.0.26100.8521
    note: '（没有可用的控制台帮助）快照文件里记录的实测结果是：stdout 0 字节、stderr 0 字节、8 秒超时、超时瞬间的窗口标题为 "USAGE"。这条事实意味着本工具包的开关只能靠官方文档核对，无法用 /? 交叉验证。'

locate:
  executable: cleanmgr.exe
  searchPaths:
    - "%SystemRoot%\\System32"
  notFoundHint: cleanmgr.exe 是 Windows 自带命令，正常情况下都在 C:\Windows\System32 下。

runtime:
  encoding: oem
  useShell: false
  requiresAdmin: false
  workingDirectory: inherit
  timeoutSeconds: 0
  preventConcurrentRuns: true
  # **不开伪控制台**：cleanmgr 是 GUI 程序，给它接伪控制台也没有任何控制台输出，
  # 只会多一层无用的 ANSI 解析。
  usePseudoConsole: false

# 退出码：微软的 cleanmgr 文档没有退出码章节（已核对）。**也无法实测**：
# 会动手的动作按安全红线不跑，只看 /? 又得不到退出码（它是 GUI 对话框，实测靠超时强杀）。
# 所以这里只写两条最保守的，并在 NOTES.md §4 明确标注"未实测"。
exitCodes:
  # 块式写法，理由见 plugins/ping/manifest.yaml 的同一处注释。
  - code: 0
    meaning: 退出码 0（含义未实测 —— 官方无文档，GUI 程序的控制台退出码不可靠）
    severity: ok
  - code: 1
    meaning: 退出码 1（含义未实测，同样无文档依据）
    severity: error

actions:

  # ================================================================= 交互设置
  - id: sageset
    category: 交互设置
    title: 打开设置对话框并保存清理项（/sageset）
    description: 弹出磁盘清理的设置对话框，勾选要清理的项目；选择结果会存进注册表，用编号 n 以后引用。
    command: ""
    danger: none
    sources:
      - title: cleanmgr 官方参考 —— /sageset 参数
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/cleanmgr#parameters
        retrieved: "2026-09-27"
        appliesTo: Windows 10/11
        note: 文档原文：/sageset:n Displays the Disk Cleanup Settings dialog box and also creates a registry key to store the settings that you select. 疑难解答文档进一步说明它"只保存选择、不执行清理"。
    fields:
      # 官方语法是 /sageset:n —— 开关与编号必须在**同一个 argv token** 里。
      # 做法：prefix 写 "/sageset:"（带冒号）、separator 写空、style 用 attached。
      # ArgvBuilder 的 non-separate 分支是 `prefix + separator + value`，于是得到单个 token
      # `/sageset:1`。**这是本批唯一一处"prefix 末尾带冒号"的写法**，容易看漏，故在此说明。
      # （曾用过 literal 枚举把 n 限制在 1..10，那是过度保守；换成下面这种写法后 n 自由。）
      - id: preset
        label: 清理项编号
        type: number
        style: attached
        prefix: "/sageset:"
        separator: ""
        switchBase: "/sageset"
        required: true
        default: 1
        group: 编号
        placeholder: 例 1
        help: 官方语法 /sageset:n。这个 n 就是你给"一套勾选"起的编号，之后用 /sagerun:n 引用同一套。
        doc: "official #parameters 的 /sageset:n；官方示例行 cleanmgr /sageset:1"
    output:
      mode: stream
      showCommandLine: true
      resultNote: 这是 GUI 动作：会弹出对话框，控制台没有任何输出（实测）。请在桌面上完成勾选并关闭对话框。
    examples:
      - title: 打开设置对话框并保存到编号 1（官方示例）
        args: ["/sageset:1"]

  # ================================================================= 执行清理
  - id: sagerun
    category: 执行清理
    title: 按已保存的编号执行清理（/sagerun）
    description: 按之前 /sageset:n 保存的勾选执行磁盘清理。**会真的删除文件**。
    command: ""
    danger: destructive
    requiresAdmin: false
    confirmText: 这会按编号 n 保存的勾选**真的删除磁盘上的文件**（临时文件、回收站、缩略图缓存等），删除后不可恢复。请确认这个编号的勾选是你想要的。确定继续？
    sources:
      - title: cleanmgr 官方参考 —— /sagerun 与 /d 参数
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/cleanmgr#parameters
        retrieved: "2026-09-27"
        appliesTo: Windows 10/11
        note: 文档原文：/sagerun:n Runs the specified tasks that are assigned to the n value if you use the /sageset option. All drives on the computer are enumerated and the selected profile runs against every drive. /d 的说明另注明 "/d option isn't utilized with /sagerun:n"。
    fields:
      # 与 sageset 同样的写法：prefix 末尾带冒号 + separator 空 + attached，
      # 生成单个 token `/sagerun:1`。
      - id: preset
        label: 要执行的清理项编号
        type: number
        style: attached
        prefix: "/sagerun:"
        separator: ""
        switchBase: "/sagerun"
        required: true
        default: 1
        group: 编号
        placeholder: 例 1
        help: 官方语法 /sagerun:n。n 必须是之前用 /sageset:n 保存过的编号，否则命令不会做任何事。
        doc: "official #parameters 的 /sagerun:n；官方示例行 cleanmgr /sagerun:1"
      # **刻意没有 /d 字段**：官方文档明确写 /d 不与 /sagerun 一起使用
      #（"/d option isn't utilized with /sagerun:n"）。把一个人填了不起作用的字段放上来，
      # 正是"发明参数"的变体 —— 所以这里不放。要用 /d 请用「打开指定驱动器的清理对话框」动作。
    output:
      mode: stream
      showCommandLine: true
      resultNote: 未实跑（会删文件）。见 NOTES.md §9.1。控制台不会有输出（GUI 程序）。
    examples:
      - title: 按编号 1 执行清理（官方示例，未实跑）
        args: ["/sagerun:1"]

  # ================================================================= 执行清理
  - id: tuneup
    category: 执行清理
    title: 对同一编号先设置再执行（/tuneup）
    description: 官方文档：对同一个 n 依次执行 /sageset 与 /sagerun。也就是打开对话框让你勾选，然后立刻按这个勾选清理。
    command: ""
    danger: destructive
    requiresAdmin: false
    confirmText: 这个动作 = 对同一编号先弹出设置对话框、再立刻按该勾选**真的删除文件**。删除不可恢复。确定继续？
    sources:
      - title: cleanmgr 官方参考 —— /tuneup 参数
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/cleanmgr#parameters
        retrieved: "2026-09-27"
        appliesTo: Windows 10/11
        note: 文档原文：/tuneup:n Run /sageset and /sagerun for the same n. 官方示例行 cleanmgr /tuneup:1
    fields:
      # 同样：prefix 末尾带冒号 + separator 空 + attached → 单个 token `/TUNEUP:1`。
      # 注意官方语法行写的是大写 /TUNEUP:n（参数表里写 /tuneup:n），程序不区分大小写，
      # 本清单照语法行用大写。
      - id: preset
        label: 要设置并执行的编号
        type: number
        style: attached
        prefix: "/TUNEUP:"
        separator: ""
        switchBase: "/TUNEUP"
        required: true
        default: 1
        group: 编号
        placeholder: 例 1
        help: 官方语法 /TUNEUP:n，等价于对同一个 n 依次执行 /sageset 与 /sagerun。
        doc: "official #parameters 的 /TUNEUP:n；官方示例行 cleanmgr /tuneup:1"
    output:
      mode: stream
      showCommandLine: true
      resultNote: 未实跑（会删文件）。见 NOTES.md §9.1。
    examples:
      - title: 对编号 1 先设置再执行（官方示例，未实跑）
        args: ["/tuneup:1"]

  # ================================================================= 自动清理
  - id: lowdisk
    category: 自动清理
    title: 用默认设置清理（/lowdisk）
    description: 官方文档：用默认设置运行。会在**所有驱动器**上按默认勾选清理。可能仍有用户提示。
    command: ""
    danger: destructive
    requiresAdmin: false
    confirmText: 这会用默认设置在所有驱动器上清理，**真的删除文件**且不可恢复。确定继续？
    sources:
      - title: cleanmgr 官方参考 —— /lowdisk 与 /verylowdisk
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/cleanmgr#parameters
        retrieved: "2026-09-27"
        appliesTo: Windows 10/11
        note: 文档原文：/lowdisk Run with the default settings. /verylowdisk Run with the default settings, no user prompts.
    fields:
      - id: lowdisk
        label: 用默认设置清理（/lowdisk）
        type: bool
        style: flag
        prefix: "/LOWDISK"
        default: true
        doc: "official #parameters 的 /lowdisk"
    output:
      mode: stream
      showCommandLine: true
      resultNote: 未实跑（会删文件）。见 NOTES.md §9.1。

  # ================================================================= 自动清理
  - id: verylowdisk
    category: 自动清理
    title: 用默认设置清理且不询问（/verylowdisk）
    description: 官方文档：用默认设置运行，且**没有任何用户提示**。适合无人值守脚本 —— 也正因为如此它最不该被随手点。
    command: ""
    danger: destructive
    requiresAdmin: false
    confirmText: 这会用默认设置在**所有驱动器**上清理且**完全不做任何询问**，删除的文件不可恢复。这与无人值守脚本用的是同一条命令。确定继续？
    sources:
      - title: cleanmgr 官方参考 —— /verylowdisk
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/cleanmgr#parameters
        retrieved: "2026-09-27"
        appliesTo: Windows 10/11
        note: 文档原文：/verylowdisk Run with the default settings, no user prompts.
    fields:
      - id: verylowdisk
        label: 默认设置且不询问（/VERYLOWDISK）
        type: bool
        style: flag
        prefix: "/VERYLOWDISK"
        default: true
        doc: "official #parameters 的 /verylowdisk"
    output:
      mode: stream
      showCommandLine: true
      resultNote: 未实跑（会删文件且无提示）。见 NOTES.md §9.1。

  # ================================================================= 自动清理
  - id: autoclean
    category: 自动清理
    title: 删除升级 Windows 后残留的文件（/autoclean）
    description: 官方文档：自动删除升级 Windows 之后留下的文件（通常就是旧的 Windows 安装）。
    command: ""
    danger: destructive
    requiresAdmin: false
    confirmText: 这会删除 Windows 升级后残留的文件（例如旧的 Windows 安装），删除后**无法回退到升级前的系统**。确定继续？
    sources:
      - title: cleanmgr 官方参考 —— /autoclean
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/cleanmgr#parameters
        retrieved: "2026-09-27"
        appliesTo: Windows 10/11
        note: 文档原文：/autoclean Automatically deletes the files that are left behind after you upgrade Windows. 注意：这个开关只出现在参数表里，不在语法行里。
    fields:
      - id: autoclean
        label: 清理升级残留（/autoclean）
        type: bool
        style: flag
        prefix: "/autoclean"
        default: true
        doc: "official #parameters 的 /autoclean（只在参数表中出现，语法行未列）"
    output:
      mode: stream
      showCommandLine: true
      resultNote: 未实跑（破坏性）。见 NOTES.md §9.1。

  # ================================================================= 预览
  - id: drive-report
    category: 预览
    title: 打开指定驱动器的清理对话框（/d）
    description: 打开指定驱动器的磁盘清理对话框，让你先看看有哪些项目、各占多少空间。只弹对话框，不执行清理。
    command: ""
    danger: none
    sources:
      - title: cleanmgr 官方参考 —— /d 参数
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/cleanmgr#parameters
        retrieved: "2026-09-27"
        appliesTo: Windows 10/11
        note: '文档原文：/d <driveletter> Specifies the drive that you want Disk Cleanup to clean. 另注明该选项不与 /sagerun:n 一起使用。'
    fields:
      - id: drive
        label: 驱动器号
        type: enum
        style: literal
        switchBase: "/d"
        default: "C:"
        help: 官方语法是 /d <driveletter> 两个 token（不是一个）。TEXT 字段做不到"前缀与值分两个 token 且中间有空格"，所以这里用 literal 把两个 token 一起写进 args —— 这是规范缺口，见 NOTES.md §8。
        doc: "official #parameters 的 /d <driveletter>"
        values:
          - value: "C:"
            label: "C:（系统盘）"
            args: ["/d", "C:"]
            isDefault: true
          - value: "D:"
            label: "D:"
            args: ["/d", "D:"]
          - value: "E:"
            label: "E:"
            args: ["/d", "E:"]
    output:
      mode: stream
      showCommandLine: true
      resultNote: 这是 GUI 动作：会弹出对话框，控制台没有任何输出（实测）。
