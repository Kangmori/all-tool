    sources:
      - title: bsdtar 官方手册（FreeBSD tar(1)，微软 tar on Windows 页面指向的同一份手册）
        url: https://man.freebsd.org/cgi/man.cgi?query=tar&sektion=1&manpath=FreeBSD+14.3-RELEASE
        retrieved: "2026-09-29"
        appliesTo: bsdtar 3.8.x（本机 3.8.4）
        note: >-
          -u Like -r, but new entries are added only if they have a modification date newer than the corresponding entry in the archive. Note that this only works on uncompressed archives stored in regular files. The -f option is required；-C directory；-f file。
      - title: 本机 `tar --help` 与本机实跑核对（bsdtar 3.8.4）
        url: file:///%SystemRoot%/System32/tar.exe
        retrieved: "2026-09-29"
        appliesTo: bsdtar 3.8.4（Windows 11 26200）
        note: >-
          本机 `tar --help`（1376 字节）+ 原型命令实跑核对：`tar -uf test.tar -C src a.txt` 退出码 0；`tar -uvf test.tar -C src .` 退出码 0 并打印 a 开头的文件名，说明该次运行确实把条目写了进去（源文件的 mtime 与归档内条目同为创建时的时刻）。

    output:
      mode: stream
      showCommandLine: true
    examples:
      - title: 增量更新 test.tar
        args: ["-u", "-f", "test.tar", "-C", "src", "a.txt"]
        expectExitCode: 0
