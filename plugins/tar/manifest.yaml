        retrieved: "2026-09-29"
        appliesTo: bsdtar 3.8.x（本机 3.8.4）
        note: >-
          --exclude pattern（Do not process files or directories that match the specified pattern. Note that exclusions take precedence over patterns or filenames specified on the command line）；-X filename, --exclude-from filename（Read a list of exclusion patterns from the specified file. See --exclude for more information about the handling of exclusions）；-c Create a new archive；-a, --auto-compress；-C directory；-f file。
