  # ============================================================ 追加/更新
  - id: append
    category: 追加/更新
    title: 往已有归档里追加文件（-r，仅未压缩的 .tar）
    description: >-
      把新文件追加到已有归档的末尾。**只对未压缩的普通 .tar 文件有效**——
      对 .tar.gz/.zip 用 -r 会失败，请改用「创建归档」重建。
    command: ""
    commandArgs: ["-r"]
    danger: overwrite
    confirmText: 会就地修改这个归档文件。若归档里已有同名条目，会**同时存在两份**（解压时后一份覆盖前一份）。
    fields:
      - id: archive
        label: 要修改的归档（必须是未压缩的 .tar）
        type: file
        style: positional
        required: true
        save: true
        accept: [.tar]
        help: 手册：-r … Note that this only works on uncompressed archives stored in regular files. The -f option is required.
        doc: 'bsdtar 手册 -r（Like -c, but new entries are appended to the archive）与 -f file'
      - id: chdir
        label: 先切换到目录（-C）
        type: directory
        style: separate
        prefix: "-C"
        save: true
        doc: bsdtar 手册 -C directory, --cd directory, --directory directory
      - id: inputs
        label: 追加进去的文件/文件夹
        type: paths
        style: positional
        required: true
        repeatable: true
        doc: 'bsdtar 手册 -r 的 [files | directories]'
    sources:
      - title: bsdtar 官方手册（FreeBSD tar(1)，微软 tar on Windows 页面指向的同一份手册）
        url: https://man.freebsd.org/cgi/man.cgi?query=tar&sektion=1&manpath=FreeBSD+14.3-RELEASE
        retrieved: "2026-09-29"
        appliesTo: bsdtar 3.8.x（本机 3.8.4）
        note: >-
          -r Like -c, but new entries are appended to the archive. Note that this only works on uncompressed archives stored in regular files. The -f option is required；-C directory；-f file。语法行：tar {-r | -u} -f archive-file [options] [files | directories]。
      - title: 本机 `tar --help` 与本机实跑核对（bsdtar 3.8.4）
        url: file:///%SystemRoot%/System32/tar.exe
        retrieved: "2026-09-29"
        appliesTo: bsdtar 3.8.4（Windows 11 26200）
        note: >-
          本机 `tar --help`（1376 字节）+ 原型命令实跑核对：`tar -rf test.tar -C src a.txt` 退出码 0（test.tar 是未压缩 .tar）；随后 `tar -tvf test.tar` 里能看到 a.txt 出现两次，印证手册说的“追加会产生重复条目”。

    output:
      mode: stream
      showCommandLine: true
    examples:
      - title: 往 test.tar 追加 a.txt
        args: ["-r", "-f", "test.tar", "-C", "src", "a.txt"]
        expectExitCode: 0

