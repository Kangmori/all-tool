        prefix: "--show-version-specifiers"
        default: false
        doc: "#uv-tool-list（--show-version-specifiers，帮助快照 tool-list.txt 第 8 行）"
      - id: showPaths
        label: 显示环境与可执行文件路径
        type: bool
        style: flag
        prefix: "--show-paths"
        default: false
        doc: "#uv-tool-list（--show-paths，帮助快照 tool-list.txt 第 6 行）"
      - id: showPython
        label: 显示所用 Python 版本
        type: bool
        style: flag
        prefix: "--show-python"
        advanced: true
        default: false
        doc: "#uv-tool-list（--show-python，帮助快照 tool-list.txt 第 13 行）"
      - id: outdated
        label: 只列出可升级的工具
        type: bool
        style: flag
        prefix: "--outdated"
        advanced: true
        default: false
        help: 需要联网。
        doc: "#uv-tool-list（--outdated，帮助快照 tool-list.txt 第 14 行）"
    output:
      mode: capture
      showCommandLine: true
    examples:
      - { title: 列出已装工具, args: ["tool", "list"] }
      - { title: 连路径一起看, args: ["tool", "list", "--show-paths"] }

  - id: tool-install
    category: 全局工具
    title: 安装全局工具
    description: 把一个 Python 包提供的命令行工具装成全局可用（uv tool install）
    command: tool
    commandArgs: ["install"]
    danger: overwrite
    confirmText: 会下载并安装该包到 uv 的工具目录，并在 shims/bin 里放置可执行入口（同名工具会被替换）。
    sources:
      - title: uv CLI 参考 —— uv tool install
        url: https://docs.astral.sh/uv/reference/cli/#uv-tool-install
        retrieved: "2026-09-27"
        appliesTo: "0.11.15"
        note: 帮助快照 docs/reference/uv-help/tool-install.txt
    fields:
      - id: package
        label: 包名
        type: text
        style: positional
        required: true
        placeholder: 例如 ruff
        doc: "#uv-tool-install（<PACKAGE>，帮助快照 tool-install.txt 第 6 行）"
      - id: with
        label: 附加依赖
        type: text
        style: separate
        prefix: "--with"
        repeatable: true
        placeholder: 每行一个
        doc: "#uv-tool-install（--with / -w，帮助快照 tool-install.txt 第 9 行）"
      - id: force
        label: 强制安装
        type: bool
        style: flag
        prefix: "--force"
        default: false
        doc: "#uv-tool-install（--force，帮助快照 tool-install.txt 第 29 行）"
      - id: python
        label: Python 解释器
        type: text
        style: separate
        prefix: "--python"
        advanced: true
        doc: "#uv-tool-install（--python / -p，帮助快照 tool-install.txt 第 71 行起）"
      - id: editable
        label: 以可编辑方式安装本地包
        type: bool
        style: flag
        prefix: "--editable"
        advanced: true
        default: false
        doc: "#uv-tool-install（--editable / -e，帮助快照 tool-install.txt 第 13 行）"
    output:
      mode: stream
      showCommandLine: true

  - id: tool-run
    category: 全局工具
    title: 临时运行工具
    description: 不安装地运行某个 Python 包提供的命令（uv tool run，即 uvx）
    command: tool
    commandArgs: ["run"]
    danger: overwrite
    confirmText: 会按需下载并缓存该包及其依赖（缓存写在 uv 的 cache 目录里）。
    sources:
      - title: uv CLI 参考 —— uv tool run
        url: https://docs.astral.sh/uv/reference/cli/#uv-tool-run
        retrieved: "2026-09-27"
        appliesTo: "0.11.15"
        note: 帮助快照 docs/reference/uv-help/tool-run.txt。本机 locate.alternativeNames 里的 uvx 就是它的别名。
    fields:
      - id: fromPackage
        label: 提供命令的包
        type: text
        style: separate
        prefix: "--from"
        placeholder: 例如 ruff
        help: 命令名与包名不同时用它指定包。
        doc: "#uv-tool-run（--from，帮助快照 tool-run.txt 第 6 行）"
      - id: with
        label: 附加依赖
        type: text
        style: separate
        prefix: "--with"
        repeatable: true
        placeholder: 每行一个
        doc: "#uv-tool-run（--with / -w，帮助快照 tool-run.txt 第 8 行）"
      - id: isolated
        label: 隔离运行
        type: bool
        style: flag
        prefix: "--isolated"
        advanced: true
        default: false
        help: 忽略已安装的同名工具，用独立环境跑。
        doc: "#uv-tool-run（--isolated，帮助快照 tool-run.txt 第 21 行）"
      - id: python
        label: Python 解释器
        type: text
        style: separate
        prefix: "--python"
        advanced: true
        doc: "#uv-tool-run（--python / -p，帮助快照 tool-run.txt 第 61 行起）"
      - id: command
        label: 命令
        type: text
        style: positional
        required: true
        placeholder: 例如 ruff
        help: 与 uv run 一样，第一个非开关参数是命令名，其后参数原样转交。
        doc: "#uv-tool-run（[COMMAND]，帮助快照 tool-run.txt 第 3 行）"
      - id: commandArgs
        label: 命令参数
        type: textarea
        style: positional
        positionalMode: perLine
        help: 一行一个参数。
        doc: "帮助快照 tool-run.txt 第 3 行（[COMMAND] 之后的参数透传）"
    output:
      mode: stream
      showCommandLine: true

  # =============================================================== uv cache
  - id: cache-dir
    category: 缓存
    title: 查看缓存目录
    description: 打印 uv 的缓存目录（uv cache dir）
    command: cache
    commandArgs: ["dir"]
    sources:
      - title: uv CLI 参考 —— uv cache dir
        url: https://docs.astral.sh/uv/reference/cli/#uv-cache-dir
        retrieved: "2026-09-27"
        appliesTo: "0.11.15"
        note: 帮助快照 docs/reference/uv-help/cache-dir.txt
    fields: []
    output:
      mode: capture
      showCommandLine: true
      openOnFinish: explorer
    examples:
      - { title: 打印缓存目录, args: ["cache", "dir"] }

  - id: cache-clean
    category: 缓存
    title: 清理缓存
    description: 清空 uv 的缓存，或只清指定包的缓存（uv cache clean）
    command: cache
    commandArgs: ["clean"]
    danger: destructive
    confirmText: 会删除 uv 缓存目录里的内容（不填包名时是全部）。删除后下次运行需要重新下载，但不会破坏已装好的项目环境。
    sources:
      - title: uv CLI 参考 —— uv cache clean
        url: https://docs.astral.sh/uv/reference/cli/#uv-cache-clean
        retrieved: "2026-09-27"
        appliesTo: "0.11.15"
        note: 帮助快照 docs/reference/uv-help/cache-clean.txt
    fields:
      - id: packages
        label: 只清理这些包
        type: text
        style: positional
        repeatable: true
        placeholder: 留空表示清空整个缓存
        doc: "#uv-cache-clean（[PACKAGE]...，帮助快照 cache-clean.txt 第 6 行）"
      - id: force
        label: 强制清理（忽略占用检查）
        type: bool
        style: flag
        prefix: "--force"
        default: false
        doc: "#uv-cache-clean（--force，帮助快照 cache-clean.txt 第 9 行）"
    output:
      mode: stream
      showCommandLine: true

  # =============================================================== uv build
  - id: build
    category: 构建与发布
    title: 构建发行包
    description: 把项目构建成 sdist 与 wheel（uv build），产物写到 dist/
    command: build
    danger: overwrite
    confirmText: 会在输出目录写入（勾选"清空输出目录"时先删除）构建产物，并可能创建 .gitignore。
    sources:
      - title: uv CLI 参考 —— uv build
        url: https://docs.astral.sh/uv/reference/cli/#uv-build
        retrieved: "2026-09-27"
        appliesTo: "0.11.15"
        note: 帮助快照 docs/reference/uv-help/build.txt
    fields:
      - id: src
        label: 源码目录或 sdist
        type: directory
        style: positional
        placeholder: 默认当前目录
        doc: "#uv-build（[SRC]，帮助快照 build.txt 第 6 行）"
      - id: outDir
        label: 输出目录
        type: directory
        style: separate
        prefix: "--out-dir"
        save: true
        placeholder: 默认 dist
        doc: "#uv-build（--out-dir / -o，帮助快照 build.txt 第 14 行）"
      - id: wheel
        label: 只构建 wheel
        type: bool
        style: flag
        prefix: "--wheel"
        default: false
        doc: "#uv-build（--wheel，帮助快照 build.txt 第 19 行）"
      - id: sdist
        label: 只构建 sdist
        type: bool
        style: flag
        prefix: "--sdist"
        default: false
        doc: "#uv-build（--sdist，帮助快照 build.txt 第 17 行）"
      - id: clear
        label: 先清空输出目录
        type: bool
        style: flag
        prefix: "--clear"
        advanced: true
        default: false
        help: 会删除输出目录里的旧产物。
        doc: "#uv-build（--clear，帮助快照 build.txt 第 24 行）"
      - id: noBuildLogs
        label: 隐藏构建后端日志
        type: bool
        style: flag
        prefix: "--no-build-logs"
        advanced: true
        default: false
        doc: "#uv-build（--no-build-logs，帮助快照 build.txt 第 20 行）"
      - id: python
        label: Python 解释器
        type: text
        style: separate
        prefix: "--python"
        advanced: true
        doc: "#uv-build（--python / -p，帮助快照 build.txt 第 37 行）"
    output:
      mode: stream
      showCommandLine: true
      openOnFinish: explorer

  # =============================================================== uv version
  - id: version-show
    category: 环境
    title: 查看项目版本
    description: 读取当前项目的版本号（uv version）。读的是 pyproject.toml，不是 uv 自己的版本。
    command: version
    sources:
      - title: uv CLI 参考 —— uv version
        url: https://docs.astral.sh/uv/reference/cli/#uv-version
        retrieved: "2026-09-27"
        appliesTo: "0.11.15"
        note: 帮助快照 docs/reference/uv-help/version.txt
    fields:
      - id: short
        label: 只输出版本号本身
        type: bool
        style: flag
        prefix: "--short"
        default: false
        doc: "#uv-version（--short，帮助快照 version.txt 第 13 行）"
      - id: outputFormat
        label: 输出格式
        type: enum
        style: separate
        prefix: "--output-format"
        advanced: true
        default: "text"
        doc: "#uv-version（--output-format，帮助快照 version.txt 第 14 行）"
        values:
          - { value: text, label: 文本（默认）, isDefault: true }
          - { value: json, label: JSON }
    output:
      mode: capture
      showCommandLine: true
      resultNote: 该命令读取当前项目的 pyproject.toml；在含中文项目名的项目里会以退出码 2 和错误信息结束。

  - id: version-set
    category: 环境
    title: 修改项目版本
    description: 设定或递增当前项目的版本号（uv version <值> / --bump），会改写 pyproject.toml
    command: version
    danger: overwrite
    confirmText: 会改写 pyproject.toml 里的 version 字段（并可能重新锁定项目）。
    sources:
      - title: uv CLI 参考 —— uv version
        url: https://docs.astral.sh/uv/reference/cli/#uv-version
        retrieved: "2026-09-27"
        appliesTo: "0.11.15"
        note: 帮助快照 docs/reference/uv-help/version.txt
    fields:
      - id: value
        label: 新版本号
        type: text
        style: positional
        placeholder: 例如 1.2.0（留空则配合下面的递增方式）
        doc: "#uv-version（[VALUE]，帮助快照 version.txt 第 6 行）"
      - id: bump
        label: 按语义化规则递增
        type: enum
        style: separate
        prefix: "--bump"
        default: ""
        doc: "#uv-version（--bump，帮助快照 version.txt 第 9 行）"
        values:
          - { value: "", label: 不递增（直接用上面的版本号） }
          - { value: major, label: 主版本 major }
          - { value: minor, label: 次版本 minor }
          - { value: patch, label: 补丁 patch }
          - { value: stable, label: 转稳定版 stable }
          - { value: alpha, label: 预发布 alpha }
          - { value: beta, label: 预发布 beta }
          - { value: rc, label: 预发布 rc }
          - { value: post, label: 后置版本 post }
          - { value: dev, label: 开发版 dev }
      - id: dryRun
        label: 试运行（不写入）
        type: bool
        style: flag
        prefix: "--dry-run"
        advanced: true
        default: false
        doc: "#uv-version（--dry-run，帮助快照 version.txt 第 12 行）"
      - id: noSync
        label: 不自动同步环境
        type: bool
        style: flag
        prefix: "--no-sync"
        advanced: true
        default: false
        doc: "#uv-version（--no-sync，帮助快照 version.txt 第 16 行）"
    output:
      mode: stream
      showCommandLine: true

  # =============================================================== uv self
  - id: self-version
    category: 诊断
    title: 查看 uv 自身版本
    description: 显示 uv 自己的版本（uv self version）。要查 uv 版本时用这个，不要用 uv version。
    command: self
    commandArgs: ["version"]
    sources:
      - title: uv CLI 参考 —— uv self version
        url: https://docs.astral.sh/uv/reference/cli/#uv-self-version
        retrieved: "2026-09-27"
        appliesTo: "0.11.15"
        note: 帮助快照 docs/reference/uv-help/self-version.txt
    fields:
      - id: short
        label: 只输出版本号本身
        type: bool
        style: flag
        prefix: "--short"
        default: false
        doc: "#uv-self-version（--short，帮助快照 self-version.txt 第 6 行）"
      - id: outputFormat
        label: 输出格式
        type: enum
        style: separate
        prefix: "--output-format"
        advanced: true
        default: "text"
        doc: "#uv-self-version（--output-format，帮助快照 self-version.txt 第 7 行）"
        values:
          - { value: text, label: 文本（默认）, isDefault: true }
          - { value: json, label: JSON }
    output:
      mode: capture
      showCommandLine: true
    examples:
      - { title: 只输出版本号, args: ["self", "version", "--short"] }
      - { title: 完整信息, args: ["self", "version"] }

  # =============================================================== uv help
  - id: help
    category: 其它
    title: 查看帮助
    description: 显示 uv 或某个命令的文档（uv help [命令...]）
    command: help
    sources:
      - title: uv CLI 参考 —— uv help
        url: https://docs.astral.sh/uv/reference/cli/#uv-help
        retrieved: "2026-09-27"
        appliesTo: "0.11.15"
        note: 帮助快照 docs/reference/uv-help/help.txt 与 _uv.txt
    fields:
      - id: command
        label: 命令
        type: text
        style: positional
        repeatable: true
        placeholder: 例如 sync，或 pip install（多行表示多级命令）
        help: 可留空查看总览；填多行可查二级命令，例如第一行 pip、第二行 install。
        doc: "#uv-help（[COMMAND]...，帮助快照 help.txt）"
    output:
      mode: capture
      showCommandLine: true
    examples:
      - { title: 总览, args: ["help"] }
      - { title: 查看 sync 的文档, args: ["help", "sync"] }
      - { title: 查看二级命令, args: ["help", "pip", "install"] }
