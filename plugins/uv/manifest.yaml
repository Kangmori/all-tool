# yaml-language-server: $schema=../../docs/spec/manifest-v1.schema.json
#
# uv（Astral 的 Python 包与环境管理器）工具包 —— 第三个样板，用来检验 playbook 在第二个作者手里是否够用。
#
# 参数知识来源（两类，均可离线复核）：
#   1) 官方 CLI 参考文档 https://docs.astral.sh/uv/reference/cli/
#      抓取与转换方式见 docs/reference/README.md，落盘为
#      docs/reference/uv-docs/cli-reference.html / cli-reference.md
#      该页每个命令都有独立锚点（#uv-sync、#uv-pip-install …），字段的 doc 直接指锚点。
#   2) 本机 uv 0.11.15 的帮助快照 docs/reference/uv-help/<命令>.txt（由 scripts/fetch-uv-help.ps1 抓取）
#
# 覆盖原则：只覆盖真实常用项，未做的命令与开关在 NOTES.md 里逐条记录。
# 本文件里出现的每个命令与开关，都能在上面两类来源里指出出处。

spec: 1
id: uv
name: uv
manifestVersion: 0.1.0
appVersion: "0.11.15"
description: Astral 的极速 Python 包管理器与环境管理器。管理项目依赖、虚拟环境、Python 版本与全局命令行工具。
homepage: https://docs.astral.sh/uv/
license: MIT OR Apache-2.0（uv 自身双许可）
tags: [python, 包管理, 虚拟环境, 依赖]
category: Python 与包管理

sources:
  - title: uv CLI 参考（官方文档，覆盖全部命令与开关）
    url: https://docs.astral.sh/uv/reference/cli/
    retrieved: "2026-09-27"
    appliesTo: "0.11.15"
    note: 离线快照 docs/reference/uv-docs/cli-reference.html（HTML）与 cli-reference.md（pandoc 转出的 Markdown）。抓取方式见 docs/reference/README.md。字段的 doc 字段指向该页的锚点，例如 #uv-sync。
  - title: 本机 uv 0.11.15 的内置帮助快照（每个命令一个文件）
    url: file:///D:/AI/swpj/docs/reference/uv-help/
    retrieved: "2026-09-27"
    appliesTo: "0.11.15"
    note: 由 scripts/fetch-uv-help.ps1 抓取，49 个命令的帮助 + index.json + _meta.json。它是"与已安装版本严格对应"的来源，且比官方长文档更紧凑（含每个开关的默认值）。各动作的 sources 里按文件名引用具体哪一个。

locate:
  executable: uv.exe
  alternativeNames: [uv, uvx]
  searchPaths:
    - "%USERPROFILE%\\.local\\bin"
    - "%USERPROFILE%\\scoop\\shims"
    - "%LOCALAPPDATA%\\Microsoft\\WinGet\\Links"
  versionArgs: ["--version"]
  # 实测（2026-09-27，uv 0.11.15）：`uv --version` 首行非空，输出为
  #   uv 0.11.15 (3cffe97c2 2026-05-18 x86_64-pc-windows-msvc)
  # 捕获组 = 0.11.15。仍显式写 (?m) 以兼容宿主的多行匹配语义（见 docs/spec/manifest-v1.md §3）。
  #
  # 正则写成 `uvx?` 是为了兼容 alternativeNames 里的 uvx：
  # winget 同目录下装了两个 exe（uv.exe 与 uvx.exe），若 uv.exe 不在搜索目录里而回退到 uvx.exe，
  # `uvx --version` 打印的是 "uvx 0.11.15 (...)"。**实测**：写成 ^uv\s 时对 uvx 的输出匹配失败，
  # 于是宿主会取不到版本号。uvx 随 uv 一起安装（同一目录、同一版本号），所以这个回退是合理的。
  versionPattern: "(?m)^uvx?\\s+([0-9]+\\.[0-9]+\\.[0-9]+)"
  minVersion: "0.8.0"
  notFoundHint: 可用 winget install astral-sh.uv、scoop install uv，或从 https://docs.astral.sh/uv/getting-started/installation/ 安装。

runtime:
  # 实测：uv 是 Rust 写的，stdout/stderr 均为 UTF-8，与 scoop 的 GBK 相反。
  # 证据（字节序列）见 NOTES.md §5。因此这里必须显式写 utf-8 而不是 auto。
  encoding: utf-8
  useShell: false
  requiresAdmin: false
  workingDirectory: inherit
  timeoutSeconds: 0
  preventConcurrentRuns: false
  # 不开伪控制台：uv 用 --no-progress 之外的普通进度输出（实测重定向后进度信息仍在 stderr 里），
  # 且开 ConPTY 会让 uv 认为自己在真终端里从而强制彩色与 ANSI 重绘。NOTES.md §6 有说明。
  usePseudoConsole: false

# 退出码：**官方文档里没有退出码章节**（已实测确认：reference/ 与 reference/cli/ 均无 "exit code" 字样）。
# 下面三条来自 2026-09-27 的真机实测，见 NOTES.md §4。
exitCodes:
  - { code: 0, meaning: 成功,                                                    severity: ok }
  - { code: 1, meaning: 运行期错误（网络失败、解析失败、包不存在等）,            severity: error }
  - { code: 2, meaning: 命令行用法错误或项目上下文缺失（参数不认识、找不到 pyproject.toml）, severity: error }

actions:

  # =============================================================== uv run
  - id: run
    category: 运行
    title: 运行命令或脚本
    description: 在项目环境里运行命令（uv run）。会按需同步环境，可能下载并安装依赖。
    command: run
    danger: overwrite
    confirmText: uv run 会按 pyproject.toml / uv.lock 同步项目环境，可能下载并安装依赖、改写虚拟环境。仅在你信任该项目时执行。
    sources:
      - title: uv CLI 参考 —— uv run
        url: https://docs.astral.sh/uv/reference/cli/#uv-run
        retrieved: "2026-09-27"
        appliesTo: "0.11.15"
        note: 帮助快照 docs/reference/uv-help/run.txt
    fields:
      # 字段声明顺序 = argv 顺序，对 uv run 尤其关键：uv 把第一个非开关参数当作"要运行的程序"，
      # 之后的参数全部原样转交给它。所以 uv 自己的开关必须声明在 command 之前。
      - id: with
        label: 临时附加的包
        type: text
        style: separate
        prefix: "--with"
        repeatable: true
        placeholder: 例如 requests
        help: 在运行环境里额外装上这些包（可多行，每行一个）。此开关必须写在要运行的命令之前。
        doc: "#uv-run（--with，帮助快照 run.txt 第 37 行）"
      - id: python
        label: Python 解释器
        type: text
        style: separate
        prefix: "--python"
        group: 高级
        advanced: true
        placeholder: 例如 3.12 或路径
        doc: "#uv-run（--python / -p，帮助快照 run.txt 第 184 行）"
      - id: noProject
        label: 不查找项目
        type: bool
        style: flag
        prefix: "--no-project"
        group: 高级
        advanced: true
        default: false
        help: 完全不查找 pyproject.toml，在临时环境里跑。适合"只想用某个工具跑一条命令"。
        doc: "#uv-run（--no-project，帮助快照 run.txt 第 61 行）"
      - id: noSync
        label: 不同步环境
        type: bool
        style: flag
        prefix: "--no-sync"
        group: 高级
        advanced: true
        default: false
        doc: "#uv-run（--no-sync，帮助快照 run.txt 第 47 行）"
      - id: locked
        label: 锁定模式（不允许改 uv.lock）
        type: bool
        style: flag
        prefix: "--locked"
        group: 高级
        advanced: true
        default: false
        doc: "#uv-run（--locked，帮助快照 run.txt 第 49 行）"
      - id: module
        label: 按模块运行（-m）
        type: bool
        style: flag
        prefix: "--module"
        group: 高级
        advanced: true
        default: false
        help: 勾选后，下面的"命令"被当作 Python 模块名，等价于 python -m <模块>。
        doc: "#uv-run（--module / -m，帮助快照 run.txt 第 24 行）"
      - id: command
        label: 要运行的命令
        type: text
        style: positional
        required: true
        placeholder: 例如 pytest
        help: uv 把第一个非开关参数当作要运行的程序名，其后的参数原样转交给它。
        doc: "#uv-run（Usage: uv run [OPTIONS] [COMMAND]，帮助快照 run.txt 第 3 行）"
      - id: commandArgs
        label: 命令参数
        type: textarea
        style: positional
        positionalMode: perLine
        help: 一行一个参数，原样追加在命令之后，交给被运行的程序。
        doc: "帮助快照 run.txt 第 3 行（[COMMAND] 之后的参数透传）"
    output:
      mode: stream
      showCommandLine: true
    examples:
      - { title: 查看 uv 在这个项目里能看到的 Python 版本, args: ["run", "--no-project", "--python", "3.14", "python", "--version"] }
      - { title: 不查找项目地运行一条命令, args: ["run", "--no-project", "python", "-c", "print(1)"] }

  # =============================================================== uv init
  - id: init
    category: 项目
    title: 新建项目
    description: 创建一个新的 Python 项目骨架（uv init），会写入 pyproject.toml 等文件。
    command: init
    danger: overwrite
    confirmText: 会在目标目录里创建项目文件（pyproject.toml、README.md、.python-version 等），同名文件可能被改写。
    sources:
      - title: uv CLI 参考 —— uv init
        url: https://docs.astral.sh/uv/reference/cli/#uv-init
        retrieved: "2026-09-27"
        appliesTo: "0.11.15"
        note: 帮助快照 docs/reference/uv-help/init.txt
    fields:
      - id: path
        label: 项目目录
        type: directory
        style: positional
        required: true
        save: true
        placeholder: 留空或填 . 表示当前目录
        doc: "#uv-init（[PATH]，帮助快照 init.txt 第 6 行）"
      - id: name
        label: 项目名
        type: text
        style: separate
        prefix: "--name"
        placeholder: 默认取目录名
        doc: "#uv-init（--name，帮助快照 init.txt 第 9 行）"
      - id: lib
        label: 作为库（可被打包发布）
        type: bool
        style: flag
        prefix: "--lib"
        default: false
        doc: "#uv-init（--lib，帮助快照 init.txt 第 14 行）"
      - id: bare
        label: 只生成 pyproject.toml
        type: bool
        style: flag
        prefix: "--bare"
        group: 高级
        advanced: true
        default: false
        doc: "#uv-init（--bare，帮助快照 init.txt 第 10 行）"
      - id: vcs
        label: 版本控制
        type: enum
        style: separate
        prefix: "--vcs"
        group: 高级
        advanced: true
        default: ""
        doc: "#uv-init（--vcs，帮助快照 init.txt 第 18 行）"
        values:
          - { value: "", label: 默认（git，若在 git 仓库外则自动判断） }
          - { value: git, label: git }
          - { value: none, label: 不初始化 }
      - id: python
        label: Python 版本
        type: text
        style: separate
        prefix: "--python"
        advanced: true
        placeholder: 例如 3.12
        doc: "#uv-init（--python / -p，帮助快照 init.txt 第 30 行）"
    output:
      mode: stream
      showCommandLine: true

  # =============================================================== uv add
  - id: add
    category: 包
    title: 添加依赖
    description: 把依赖加入项目并更新锁文件与环境（uv add）
    command: add
    danger: overwrite
    confirmText: 会改写 pyproject.toml 与 uv.lock，并同步虚拟环境（可能下载安装依赖）。
    sources:
      - title: uv CLI 参考 —— uv add
        url: https://docs.astral.sh/uv/reference/cli/#uv-add
        retrieved: "2026-09-27"
        appliesTo: "0.11.15"
        note: 帮助快照 docs/reference/uv-help/add.txt
    fields:
      - id: packages
        label: 包
        type: text
        style: positional
        required: true
        repeatable: true
        placeholder: "例如 requests 或 ruff==0.5.0"
        help: 可填多行，每行一个 PEP 508 需求（含版本约束）。
        doc: "#uv-add（[PACKAGES]...，帮助快照 add.txt 第 6 行）"
      - id: dev
        label: 加入开发依赖组
        type: bool
        style: flag
        prefix: "--dev"
        default: false
        doc: "#uv-add（--dev，帮助快照 add.txt 第 15 行）"
      - id: optional
        label: 作为可选依赖（extra）
        type: text
        style: separate
        prefix: "--optional"
        placeholder: extra 名
        doc: "#uv-add（--optional，帮助快照 add.txt 第 17 行）"
      - id: group
        label: 指定的依赖组
        type: text
        style: separate
        prefix: "--group"
        advanced: true
        placeholder: 比如 dev / docs
        doc: "#uv-add（--group，帮助快照 add.txt 第 19 行）"
      - id: editable
        label: 以可编辑方式安装
        type: bool
        style: flag
        prefix: "--editable"
        group: 高级
        advanced: true
        default: false
        doc: "#uv-add（--editable，帮助快照 add.txt 第 21 行）"
      - id: noSync
        label: 不自动同步环境
        type: bool
        style: flag
        prefix: "--no-sync"
        group: 高级
        advanced: true
        default: false
        help: 只改 pyproject.toml 与 uv.lock，不装包。
        doc: "#uv-add（--no-sync，帮助快照 add.txt 第 38 行）"
      - id: python
        label: Python 解释器
        type: text
        style: separate
        prefix: "--python"
        group: 高级
        advanced: true
        doc: "#uv-add（--python / -p，帮助快照 add.txt 第 167 行）"
    output:
      mode: stream
      showCommandLine: true

  # =============================================================== uv remove
  - id: remove
    category: 包
    title: 移除依赖
    description: 从项目里移除依赖（uv remove）
    command: remove
    danger: overwrite
    confirmText: 会改写 pyproject.toml 与 uv.lock，并同步虚拟环境（卸载对应包）。
    sources:
      - title: uv CLI 参考 —— uv remove
        url: https://docs.astral.sh/uv/reference/cli/#uv-remove
        retrieved: "2026-09-27"
        appliesTo: "0.11.15"
        note: 帮助快照 docs/reference/uv-help/remove.txt
    fields:
      - id: packages
        label: 要移除的包
        type: text
        style: positional
        required: true
        repeatable: true
        placeholder: 每行一个包名
        doc: "#uv-remove（<PACKAGES>...，帮助快照 remove.txt 第 5 行）"
      - id: dev
        label: 从开发依赖组移除
        type: bool
        style: flag
        prefix: "--dev"
        default: false
        doc: "#uv-remove（--dev，帮助快照 remove.txt 第 9 行）"
      - id: group
        label: 指定的依赖组
        type: text
        style: separate
        prefix: "--group"
        advanced: true
        doc: "#uv-remove（--group，帮助快照 remove.txt 第 13 行）"
      - id: noSync
        label: 不自动同步环境
        type: bool
        style: flag
        prefix: "--no-sync"
        group: 高级
        advanced: true
        default: false
        doc: "#uv-remove（--no-sync，帮助快照 remove.txt 第 14 行）"
    output:
      mode: stream
      showCommandLine: true

  # =============================================================== uv sync
  - id: sync
    category: 环境
    title: 同步环境
    description: 按 pyproject.toml 与 uv.lock 把虚拟环境同步到位（uv sync）。会下载安装依赖。
    command: sync
    danger: overwrite
    confirmText: 会写入 .venv（安装/卸载包，默认还会移除多余包），并可能更新 uv.lock。
    sources:
      - title: uv CLI 参考 —— uv sync
        url: https://docs.astral.sh/uv/reference/cli/#uv-sync
        retrieved: "2026-09-27"
        appliesTo: "0.11.15"
        note: 帮助快照 docs/reference/uv-help/sync.txt
    fields:
      - id: extra
        label: 启用的 extra
        type: text
        style: separate
        prefix: "--extra"
        repeatable: true
        placeholder: 每行一个 extra 名
        doc: "#uv-sync（--extra，帮助快照 sync.txt 第 6 行）"
      - id: allExtras
        label: 启用全部 extra
        type: bool
        style: flag
        prefix: "--all-extras"
        default: false
        doc: "#uv-sync（--all-extras，帮助快照 sync.txt 第 10 行）"
      - id: noDev
        label: 不要开发依赖
        type: bool
        style: flag
        prefix: "--no-dev"
        default: false
        doc: "#uv-sync（--no-dev，帮助快照 sync.txt 第 14 行）"
      - id: inexact
        label: 不移除多余包
        type: bool
        style: flag
        prefix: "--inexact"
        group: 高级
        advanced: true
        default: false
        doc: "#uv-sync（--inexact，帮助快照 sync.txt 第 31 行）"
      - id: locked
        label: 锁定模式（不允许改 uv.lock）
        type: bool
        style: flag
        prefix: "--locked"
        group: 高级
        advanced: true
        default: false
        doc: "#uv-sync（--locked，帮助快照 sync.txt 第 43 行）"
      - id: dryRun
        label: 试运行（不实际改动）
        type: bool
        style: flag
        prefix: "--dry-run"
        group: 高级
        advanced: true
        default: false
        doc: "#uv-sync（--dry-run，帮助快照 sync.txt 第 47 行）"
      - id: check
        label: 只检查是否已同步
        type: bool
        style: flag
        prefix: "--check"
        group: 高级
        advanced: true
        default: false
        help: 不安装任何东西；环境与项目不一致时以非零退出码报告。
        doc: "#uv-sync（--check，帮助快照 sync.txt 第 71 行）"
      - id: python
        label: Python 解释器
        type: text
        style: separate
        prefix: "--python"
        group: 高级
        advanced: true
        doc: "#uv-sync（--python / -p，帮助快照 sync.txt 第 178 行）"
    output:
      mode: stream
      showCommandLine: true
    examples:
      - { title: 只检查环境是否与项目一致（不安装任何东西）, args: ["sync", "--check"] }

  # =============================================================== uv lock
  - id: lock
    nextSteps:
      - title: 按锁文件同步环境
        action: sync
        reason: 锁文件更新后应当同步一次环境
    category: 环境
    title: 更新锁文件
    description: 重新解析依赖并写入 uv.lock（uv lock）。会联网解析版本。
    command: lock
    danger: overwrite
    confirmText: 会改写 uv.lock。
    sources:
      - title: uv CLI 参考 —— uv lock
        url: https://docs.astral.sh/uv/reference/cli/#uv-lock
        retrieved: "2026-09-27"
        appliesTo: "0.11.15"
        note: 帮助快照 docs/reference/uv-help/lock.txt
    fields:
      - id: check
        label: 只检查锁文件是否最新
        type: bool
        style: flag
        prefix: "--check"
        default: false
        help: 不写文件；不一致时以非零退出码报告。适合放进 CI。
        doc: "#uv-lock（--check，帮助快照 lock.txt 第 6 行）"
      - id: dryRun
        label: 试运行（不写锁文件）
        type: bool
        style: flag
        prefix: "--dry-run"
        advanced: true
        default: false
        doc: "#uv-lock（--dry-run，帮助快照 lock.txt 第 9 行）"
      - id: upgrade
        label: 允许升级
        type: bool
        style: flag
        prefix: "--upgrade"
        advanced: true
        default: false
        help: 忽略已有输出文件里钉住的版本，重新选版本。
        doc: "#uv-lock（--upgrade / -U，帮助快照 lock.txt 第 39 行）"
      - id: script
        label: 针对某个脚本
        type: file
        style: separate
        prefix: "--script"
        advanced: true
        accept: [.py]
        doc: "#uv-lock（--script，帮助快照 lock.txt 第 10 行）"
    output:
      mode: stream
      showCommandLine: true
    examples:
      - { title: 检查锁文件是否最新（只读，不改文件）, args: ["lock", "--check"] }
      - { title: 试运行：看看会改什么, args: ["lock", "--dry-run"] }

  # =============================================================== uv export
  - id: export
    category: 环境
    title: 导出锁文件
    description: 把 uv.lock 导出成 requirements.txt / pylock.toml / CycloneDX（uv export）
    command: export
    danger: overwrite
    confirmText: 若填了输出文件，会覆盖该文件。
    sources:
      - title: uv CLI 参考 —— uv export
        url: https://docs.astral.sh/uv/reference/cli/#uv-export
        retrieved: "2026-09-27"
        appliesTo: "0.11.15"
        note: 帮助快照 docs/reference/uv-help/export.txt
    fields:
      - id: format
        label: 导出格式
        type: enum
        style: separate
        prefix: "--format"
        default: ""
        doc: "#uv-export（--format，帮助快照 export.txt 第 6 行）"
        values:
          - { value: "", label: 默认（requirements.txt） }
          - { value: requirements.txt, label: requirements.txt }
