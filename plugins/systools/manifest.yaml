spec: 1
id: systools
name: 系统工具
manifestVersion: 0.1.0
kind: system
summary: >-
  Windows 自带工具的快捷入口（仿系统配置 msconfig 的「工具」选项卡）：任务管理器、设备管理器、
  服务、事件查看器、磁盘管理、控制面板项、辅助工具等。每个动作都通过
  `cmd /c start "" <工具>` 打开，**不捕获输出、不等待窗口关闭**，
  工具独立运行——关掉本工具不会把它们一起带走。
appVersion: "10.0"
runtime:
  encoding: oem

locate:
  executable: cmd.exe
  alternativeNames: [cmd.exe]
  versionArgs: ["/c", "ver"]
  versionPattern: "(?m)Version\\s+([0-9.]+)"
  minVersion: "6.1"
  notFoundHint: >-
    找不到 cmd.exe。Windows 一定自带它；如果出现这一条，请检查系统文件是否被改动。

actions:
  - id: taskmgr
    category: 任务与进程
    title: 任务管理器
    description: >-
      查看进程、性能、启动项、服务与用户会话。 通过 `cmd /c start "" taskmgr.exe` 打开。
    command: ""
    executable: cmd.exe
    fixedArgs: ["/c", "start", "", "taskmgr.exe"]
    sources:
      - title: "Windows 命令索引（系统自带工具入口）"
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/windows-commands
        retrieved: "2026-10-01"
        note: "本包是**本地系统工具的快捷入口**，不是第三方命令的包装：每一项都是 Windows 自带程序，因此出处写系统的 windows-commands 索引页，具体行为以本机实测为准。"
    fields: []

