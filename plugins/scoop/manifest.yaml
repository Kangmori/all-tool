# yaml-language-server: $schema=../../docs/spec/manifest-v1.schema.json
#
# Scoop 工具包（第二个样板，用来检验 manifest v1 能否表达 28 个命令、子命令与需要提权的操作）。
#
# 参数知识来源（全部在本仓库里，可离线复核）：
#   1. 本机帮助快照（**未入库**，可用下列命令重新抓取）/*.txt   —— 本机 scoop 0.5.3 的 28 个命令的结构化帮助
#                                            （由 scripts/fetch-scoop-help.ps1 生成，_meta.json 记了版本与日期）
#   2. Scoop 官方 wiki（对应页面见各动作的 sources）/*.md    —— 官方 wiki 全站克隆
# 本文件里出现的每个命令、开关、位置参数都能在上面两处指出出处；没有出处的一律不写。
#
# 实测决定的三件事（详见 NOTES.md）：
#   * 启动方式：本机 scoop 的 shim 是 scoop.ps1，但 CreateProcess 无法直接执行 .ps1
#     （实测报 "not a valid application for this OS platform"），所以 locate.executable 用同目录的 scoop.cmd。
#   * versionPattern：scoop --version 的版本号在第二行（形态随 git 状态变化），实测 (?m) + 跨行正则能稳定取到。
#   * runtime.encoding：本机实测 stdout/stderr 都是 GBK(cp936)，不是 UTF-8。

spec: 1
id: scoop
name: Scoop
manifestVersion: "0.1.0"
appVersion: "0.5.3"
summary: 安装与管理软件
description: "Scoop —— Windows 上的命令行安装器（Git 风格）。管理 bucket、安装/更新/卸载应用、维护 shim、查看下载缓存。"
homepage: https://scoop.sh/
license: "Unlicense 或 MIT（软件自带 LICENSE 的 SPDX 标识：UNLICENSE or MIT）"
tags: [包管理, 安装器, 系统工具]
quickActions:
  - title: 检查可用更新
    action: status
  - title: 更新全部应用
    action: update
  - title: 查看已安装列表
    action: list

sources:
  - title: "scoop 0.5.3 本机帮助快照（28 个命令的结构化帮助输出）"
    url: https://github.com/ScoopInstaller/Scoop/wiki
    retrieved: "2026-09-27"
    appliesTo: "0.5.3"
    note: "由 scripts/fetch-scoop-help.ps1 生成本机安装版本的帮助；每个命令一个 <command>.txt，本文件逐动作引用。"
  - title: "Scoop 官方 wiki（整站克隆）"
    url: https://github.com/ScoopInstaller/Scoop/wiki/Home
    retrieved: "2026-09-27"
    appliesTo: "wiki 快照 2026-09-27"
    note: "补充全局语义：Buckets / Global-Installs / Persistent-data / Dependencies / FAQ / Scoop-Folder-Layout / Using-Scoop-behind-a-proxy。"

locate:
  # scoop.ps1 无法被 CreateProcess 直接执行（实测），scoop.cmd 可以，且能正确传递参数与退出码。
  executable: scoop.cmd
  searchPaths:
    - "%SCOOP%\\shims"
    - "%USERPROFILE%\\scoop\\shims"
    - "%SCOOP_GLOBAL%\\shims"
    - "%ProgramData%\\scoop\\shims"
  versionArgs: ["--version"]
  # 实测：第一行固定是 "Current Scoop version:"，版本号在第二行，且第二行有两种形态——
  #   git 可用且非 master 分支时： "<hash> chore(release): Bump to version 0.5.3 (resync) (#6436)"
  #   否则读 CHANGELOG：          "v0.5.3 - Released at 2025-08-11"
  # 两种形态都用同一条跨行正则取到（实测捕获组 = 0.5.3）。
  versionPattern: '(?m)Current Scoop version:\s*\r?\n.*?v?([0-9]+\.[0-9]+\.[0-9]+)'
  minVersion: "0.5.3"
  notFoundHint: "没有找到 scoop.cmd。安装方式见 wiki 的 Quick-Start（PowerShell 里执行：irm get.scoop.sh | iex）；装好后 scoop.cmd 位于 %USERPROFILE%\\scoop\\shims。"

runtime:
  # 实测：宿主这样启动（CreateProcess + 重定向 stdio）时，scoop 的 stdout/stderr 都是 GBK cp936：
  #   '系统' 的字节是 cf b5 cd b3（GBK），按 UTF-8 解码会得到 'ϵͳ'。
  encoding: gbk
  useShell: false
  requiresAdmin: false
  workingDirectory: inherit
  timeoutSeconds: 0
  preventConcurrentRuns: false

# 来源：本机帮助快照（**未入库**，可用下列命令重新抓取）/virustotal.txt 的 "Exit codes" 一节（唯一有退出码文档的命令），
#       外加实跑核对：scoop 的顶层分发用 `& $cmd_path`（lib/commands.ps1:38）且 bin/scoop.ps1 不传播 $LASTEXITCODE，
#       所以除"顶层命令名不认识"外，失败路径实测也返回 0。宿主不能只靠退出码判断成败。
exitCodes:
  - { code: 0,  meaning: "命令已执行完毕。注意：参数缺失、应用不存在等失败情形实测同样返回 0，不能仅凭退出码判定成功。", severity: ok }
  - { code: 1,  meaning: "顶层命令名不被识别（实测：scoop nosuchcommand）。scoop 的帮助文本还把它列为 virustotal 的参数解析错误码。", severity: error }
  - { code: 2,  meaning: "仅 virustotal 文档：至少一个包被 VirusTotal 标记为不安全（可与 4/8 组合，如 6 = 2|4）。本机未实跑。", severity: warning }
  - { code: 4,  meaning: "仅 virustotal 文档：查询时至少抛出一个异常。本机未实跑。", severity: warning }
  - { code: 8,  meaning: "仅 virustotal 文档：至少一个包因找不到清单而无法查询。本机未实跑。", severity: warning }
  - { code: 16, meaning: "仅 virustotal 文档：未配置 VirusTotal API key。本机未实跑。", severity: error }

actions:

  # =================================================================== help
  - id: help
    category: 其它
    title: 查看帮助
    description: "列出全部命令，或查看某个命令的完整帮助（scoop help）"
    command: help
    sources:
      - title: "scoop help help（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "文件全文只有一行用法：Usage: scoop help <command>；'不带参数列出全部命令' 见 wiki 的 Commands.md 与 Quick-Start.md"
      - title: "Scoop wiki —— Commands（帮助界面说明）"
        url: https://github.com/ScoopInstaller/Scoop/wiki/Commands
        retrieved: "2026-09-27"
        appliesTo: "wiki 快照 2026-09-27"
        note: "scoop help 列出命令；scoop help <command> 显示单个命令的详细帮助。"
    fields:
      - id: cmd
        label: 命令名
        type: text
        style: positional
        placeholder: "alias / install / config / 留空"
        help: "留空 = 列出全部 28 个命令及一句话说明；填命令名 = 显示该命令的完整帮助。"
        doc: scoop help help
    output:
      mode: capture
      showCommandLine: true
    examples:
      - { title: "列出全部命令", args: ["help"], expectExitCode: 0 }
      - { title: "查看 install 的帮助", args: ["help", "install"], expectExitCode: 0 }

  # =================================================================== alias
  - id: alias-list
    category: 别名
    title: 别名 —— 列出
    description: "列出已定义的自定义子命令（scoop alias list）"
    command: alias
    commandArgs: ["list"]
    sources:
      - title: "scoop help alias（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "子命令 add / rm / list 与 -v, --verbose（works only for \"list\"）均出自此文件。"
    fields:
      - id: verbose
        label: 详细输出
        type: bool
        style: flag
        prefix: "--verbose"
        default: false
        help: "等价于 -v。显示别名的描述与表头（仅对 list 子命令有效）。"
        doc: scoop help alias
    output:
      mode: capture
      showCommandLine: true
    examples:
      - { title: "列出别名并显示描述", args: ["alias", "list", "--verbose"], expectExitCode: 0 }

  - id: alias-add
    category: 别名
    title: 别名 —— 新增
    description: "新增一个自定义 scoop 子命令（scoop alias add）"
    command: alias
    commandArgs: ["add"]
    sources:
      - title: "scoop help alias（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "用法：scoop alias add <name> <command> [<description>]；示例见文件里的两条 alias add。"
    fields:
      - id: name
        label: 别名
        type: text
        style: positional
        required: true
        placeholder: "例如 rm / upgrade"
        doc: scoop help alias
      - id: body
        label: 要执行的命令
        type: textarea
        style: positional
        required: true
        placeholder: "scoop uninstall $args[0]"
        help: "原样写命令文本（不要加 PowerShell 的引号，它们会被当成命令的一部分）。文档示例：scoop uninstall $args[0]；scoop update *。因为本机走 scoop.cmd（经 cmd.exe）转发，文本里的 %NAME% 会被环境变量展开，请避开。"
        doc: scoop help alias
      - id: description
        label: 描述
        type: text
        style: positional
        placeholder: "Uninstall an app"
        doc: scoop help alias
    output:
      mode: stream
      showCommandLine: true

  - id: alias-rm
    category: 别名
    title: 别名 —— 删除
    description: "删除一个自定义 scoop 子命令（scoop alias rm）。会删除 shim 目录里的 scoop-<name>.ps1 并清掉配置项。"
    command: alias
    commandArgs: ["rm"]
    danger: destructive
    confirmText: "将删除该别名对应的 scoop-<name>.ps1 与配置记录，无法撤销。"
    sources:
      - title: "scoop help alias（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "用法：scoop alias rm <name>"
    fields:
      - id: name
        label: 别名
        type: text
        style: positional
        required: true
        doc: scoop help alias
    output:
      mode: stream
      showCommandLine: true

  # =================================================================== bucket
  - id: bucket-list
    category: 桶管理
    title: Bucket —— 列出
    description: "列出本机已添加的 bucket（scoop bucket list）"
    command: bucket
    commandArgs: ["list"]
    sources:
      - title: "scoop help bucket（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "用法行：scoop bucket add|list|known|rm [<args>]"
      - title: "Scoop wiki —— Buckets（bucket list 的用途）"
        url: https://github.com/ScoopInstaller/Scoop/wiki/Buckets
        retrieved: "2026-09-27"
        appliesTo: "wiki 快照 2026-09-27"
        note: "scoop bucket list 用来确认 bucket 是否已添加；bucket 是装着应用清单的 git 仓库。"
    fields: []
    output:
      mode: capture
      showCommandLine: true
    examples:
      - { title: "列出已添加的 bucket", args: ["bucket", "list"], expectExitCode: 0 }

  - id: bucket-known
    category: 桶管理
    title: Bucket —— 列出已知 bucket
    description: "列出社区已知的 bucket 名（scoop bucket known）"
    command: bucket
    commandArgs: ["known"]
    sources:
      - title: "scoop help bucket（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "To list all known buckets, use: scoop bucket known"
      - title: "Scoop wiki —— Buckets（known buckets）"
        url: https://github.com/ScoopInstaller/Scoop/wiki/Buckets
        retrieved: "2026-09-27"
        appliesTo: "wiki 快照 2026-09-27"
        note: "已知 bucket 列表来自 buckets.json，用 scoop bucket known 查看。"
    fields: []
    output:
      mode: capture
      showCommandLine: true
    examples:
      - { title: "列出已知 bucket", args: ["bucket", "known"], expectExitCode: 0 }

  - id: bucket-add
    category: 桶管理
    title: Bucket —— 添加
    description: "添加一个 bucket（git 仓库）（scoop bucket add）"
    command: bucket
    commandArgs: ["add"]
    sources:
      - title: "scoop help bucket（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "用法：scoop bucket add <name> [<repo>]；已知 bucket（如 extras）可省略 <repo>。"
      - title: "Scoop wiki —— Buckets（添加 bucket）"
        url: https://github.com/ScoopInstaller/Scoop/wiki/Buckets
        retrieved: "2026-09-27"
        appliesTo: "wiki 快照 2026-09-27"
        note: "scoop bucket add <name-of-bucket> <location-of-git-repo>；extras 这类已知 bucket 只需名字。"
    fields:
      - id: name
        label: Bucket 名
        type: text
        style: positional
        required: true
        placeholder: "例如 extras"
        doc: scoop help bucket
      - id: repo
        label: 仓库地址
        type: text
        style: positional
        placeholder: "https://github.com/ScoopInstaller/Extras.git"
        help: "只能是已知 bucket（main / extras / versions …）时才可留空。"
        doc: scoop help bucket
    output:
      mode: stream
      showCommandLine: true

  - id: bucket-rm
    category: 桶管理
    title: Bucket —— 删除
    description: "删除一个 bucket 及其本地清单（scoop bucket rm）。会递归删除 bucket 目录。"
    command: bucket
    commandArgs: ["rm"]
    danger: destructive
    confirmText: "将递归删除该 bucket 的本地目录（%USERPROFILE%\\scoop\\buckets\\<name>），无法撤销。"
    sources:
      - title: "scoop help bucket（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "用法行含 rm 子命令；scoop bucket rm <name> 的用法字符串来自命令实现自身的 usage 文本。"
    fields:
      - id: name
        label: Bucket 名
        type: text
        style: positional
        required: true
        doc: scoop help bucket
    output:
      mode: stream
      showCommandLine: true

  # =================================================================== cache
  - id: cache-show
    category: 缓存
    title: 缓存 —— 查看
    description: "查看下载缓存（scoop cache show），可只显示某些应用"
    command: cache
    commandArgs: ["show"]
    sources:
      - title: "scoop help cache（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "用法：scoop cache show|rm [app(s)]；scoop cache show 显示缓存内容。"
    fields:
      - id: apps
        label: 只看这些应用
        type: multiselect
        style: positional
        repeatable: true
        placeholder: "应用名，可填多个；留空 = 全部"
        help: "文档里 '*' 表示全部。"
        doc: scoop help cache
    output:
      mode: capture
      showCommandLine: true
    examples:
      - { title: "查看全部缓存", args: ["cache", "show"], expectExitCode: 0 }

  - id: cache-rm
    category: 缓存
    title: 缓存 —— 删除
    description: "删除下载缓存（scoop cache rm）。删除后相关安装需要重新下载。"
    command: cache
    commandArgs: ["rm"]
    danger: destructive
    confirmText: "将删除下载缓存文件（或整个缓存目录下的文件），无法撤销；相关应用重装时需要重新下载。"
    sources:
      - title: "scoop help cache（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "scoop cache rm <app> 删除指定应用的下载；scoop cache rm * 清空；也可用 -a/--all 代替 *。"
    fields:
      - id: all
        label: 清空全部缓存
        type: bool
        style: flag
        prefix: "--all"
        default: false
        help: "等价于文档里的 scoop cache rm *。与下面的应用名二选一；同时给出时 scoop 以清空全部处理。"
        doc: scoop help cache
      - id: apps
        label: 要删除缓存的应用
        type: multiselect
        style: positional
        repeatable: true
        placeholder: "应用名，可填多个"
        doc: scoop help cache
    output:
      mode: stream
      showCommandLine: true

  # =================================================================== cat
  - id: cat
    category: 定位与查看
    title: 查看应用清单
    description: "显示指定应用的 manifest JSON（scoop cat）"
    command: cat
    sources:
      - title: "scoop help cat（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "用法：scoop cat <app>；若配置了 cat_style，会用 bat 美化输出（见 scoop help config）。"
    fields:
      - id: app
        label: 应用
        type: text
        style: positional
        required: true
        placeholder: "例如 7zip"
        doc: scoop help cat
    output:
      mode: capture
      showCommandLine: true
    examples:
      - { title: "查看 7zip 的清单", args: ["cat", "7zip"], expectExitCode: 0 }

  # =================================================================== checkup
  - id: checkup
    nextSteps:
      - title: 更新全部应用
        action: update
        reason: 检查完就可以顺手更新
    category: 诊断
    title: 环境体检
    description: "运行一组诊断检查，找出可能导致 scoop 出问题的地方（scoop checkup）"
    command: checkup
    sources:
      - title: "scoop help checkup（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "用法：scoop checkup；'Performs a series of diagnostic tests to try to identify things that may cause problems with Scoop.'"
    fields: []
    output:
      mode: capture
      showCommandLine: true
    examples:
      - { title: "运行体检", args: ["checkup"], expectExitCode: 0 }

  # =================================================================== cleanup
  - id: cleanup
    category: 应用管理
    title: 清理旧版本
    description: "删除应用的旧版本目录与过期缓存（scoop cleanup）"
    command: cleanup
    danger: destructive
    confirmText: "将永久删除该应用保留下来的旧版本目录（以及可选的过期下载缓存），无法撤销。"
    sources:
      - title: "scoop help cleanup（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "用法：scoop cleanup <app> [options]；-a/--all、-g/--global、-k/--cache 均出自此文件。"
      - title: "Scoop wiki —— FAQ（旧版本的保留与清理）"
        url: https://github.com/ScoopInstaller/Scoop/wiki/FAQ
        retrieved: "2026-09-27"
        appliesTo: "wiki 快照 2026-09-27"
        note: "更新应用后旧版本会保留，直到用 scoop cleanup 删除。"
    fields:
      - id: all
        label: 清理全部应用
        type: bool
        style: flag
        prefix: "--all"
        default: false
        help: "等价于文档里的 scoop cleanup *。"
        doc: scoop help cleanup
      - id: app
        label: 应用
        type: multiselect
        style: positional
        repeatable: true
        placeholder: "应用名；用 --all 时可留空"
        doc: scoop help cleanup
      - id: global
        label: 全局安装
        type: bool
        style: flag
        prefix: "--global"
        default: false
        group: 高级
        advanced: true
        help: "清理全局安装的应用（-g）。全局安装需要管理员权限。"
        doc: scoop help cleanup
      - id: cache
        label: 同时删除过期缓存
        type: bool
        style: flag
        prefix: "--cache"
        default: false
        group: 高级
        advanced: true
        help: "等价于 -k：顺带删掉过期的下载缓存。"
        doc: scoop help cleanup
    output:
      mode: stream
      showCommandLine: true

  # =================================================================== config
  - id: config-get
    category: 配置
    title: 配置 —— 读取
    description: "读取全部配置，或某个配置项的值（scoop config）"
    command: config
    sources:
      - title: "scoop help config（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "用法：scoop config [rm] name [value]；不带参数打印全部设置，带 name 打印单项。下面枚举的取值名全部来自该文件的 Settings 一节。"
      - title: "Scoop wiki —— Using Scoop behind a proxy（config 读写的实例）"
