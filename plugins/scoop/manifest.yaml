          - { value: global_path, label: "global_path —— 全局安装根目录" }
          - { value: cache_path, label: "cache_path —— 下载缓存目录" }
          - { value: gh_token, label: "gh_token —— GitHub API token" }
          - { value: virustotal_api_key, label: "virustotal_api_key —— VirusTotal API key" }
          - { value: cat_style, label: "cat_style —— bat 的样式（用于 scoop cat）" }
          - { value: ignore_running_processes, label: "ignore_running_processes —— 目标进程在跑时是否继续" }
          - { value: private_hosts, label: "private_hosts —— 需要额外认证的私有主机" }
          - { value: hold_update_until, label: "hold_update_until —— 暂停 scoop 自身更新到指定日期" }
