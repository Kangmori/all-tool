  # =================================================================== download
  - id: download
    category: 应用管理
    title: 只下载不安装
    description: "把应用下载到缓存并校验哈希，但不安装（scoop download）"
    command: download
    danger: overwrite
    sources:
      - title: "scoop help download（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "用法：scoop download <app> [options]；-f/--force、-s/--skip-hash-check、-u/--no-update-scoop、-a/--arch 均出自此文件。"
      - title: "Scoop wiki —— Quick Start（install/update/download/virustotal 会顺带更新 scoop）"
        url: https://github.com/ScoopInstaller/Scoop/wiki/Quick-Start
        retrieved: "2026-09-27"
        appliesTo: "wiki 快照 2026-09-27"
        note: "scoop install / update <app> / download / virustotal 会在必要时自动先更新 scoop 自身——这就是 -u/--no-update-scoop 存在的原因。"
    fields:
      - id: apps
        label: 应用
        type: multiselect
        style: positional
        required: true
        repeatable: true
        placeholder: "应用名、应用@版本、清单 URL 或本地 json 路径"
        help: "文档给的四种写法：git；gh@2.7.0；https://…/runat.json；path\\to\\app.json"
        doc: scoop help download
      - id: arch
        label: 架构
        type: enum
        style: separate
        prefix: "--arch"
        help: "等价于 -a <32bit|64bit|arm64>。只在该应用支持指定架构时有意义。"
        doc: scoop help download
        values:
          - { value: "", label: "默认（按系统与 default_architecture）", isDefault: true }
          - { value: 32bit, label: "32bit" }
          - { value: 64bit, label: "64bit" }
          - { value: arm64, label: "arm64" }
      - id: force
        label: 强制重新下载
        type: bool
        style: flag
        prefix: "--force"
        default: false
        help: "等价于 -f：覆盖缓存中已有的下载。"
        doc: scoop help download
      - id: skipHashCheck
        label: 跳过哈希校验
        type: bool
        style: flag
        prefix: "--skip-hash-check"
        default: false
        group: 高级
        advanced: true
        help: "等价于 -s。文档原文：use with caution!"
        doc: scoop help download
      - id: noUpdateScoop
        label: 不先更新 scoop
        type: bool
        style: flag
        prefix: "--no-update-scoop"
        default: false
        group: 高级
        advanced: true
        help: "等价于 -u：scoop 过期时不先自动更新。"
        doc: scoop help download
    output:
      mode: stream
      showCommandLine: true

