  # =================================================================== create
  - id: create
    category: 其它
    title: 生成应用清单骨架
    description: "根据一个下载 URL 生成自定义 manifest 骨架（scoop create）。该命令是交互式向导，会依次询问应用名与版本。"
    command: create
    danger: overwrite
    confirmText: "会在进程当前目录写出 <应用名>.json；同名文件会被覆盖。"
    sources:
      - title: "scoop help create（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "用法：scoop create <url>；Create your own custom app manifest。"
      - title: "Scoop wiki —— Creating an app manifest"
        url: https://github.com/ScoopInstaller/Scoop/wiki/Creating-an-app-manifest
        retrieved: "2026-09-27"
        appliesTo: "wiki 快照 2026-09-27"
        note: "说明应用清单是 JSON，放在 bucket 目录里；scoop create 用来起一个骨架。"
    fields:
      - id: url
        label: 下载地址
        type: text
        style: positional
        required: true
        placeholder: "https://example.com/app-1.0.zip"
        help: "注意两点：(1) 本命令在生成过程中会用 Read-Host 询问应用名与版本，属于交互式向导，宿主如果拿不到 stdin，进程会一直等输入；在宿主实现交互式输入之前不要把本动作当成可用功能。(2) 清单无法让用户选输出目录——scoop create 不接受任何目录参数，而任何字段都会变成一个 argv token（见 NOTES.md 的规范缺口）。生成的文件会落在宿主进程的当前目录。"
        doc: scoop help create
    output:
      mode: stream
      showCommandLine: true

