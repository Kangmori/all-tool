          - { value: no_junction, label: "no_junction —— 不使用 current 版本别名" }
          - { value: scoop_repo, label: "scoop_repo —— scoop 源码仓库地址" }
          - { value: scoop_branch, label: "scoop_branch —— master 或 develop" }
          - { value: proxy, label: "proxy —— [username:password@]host:port" }
          - { value: autostash_on_conflict, label: "autostash_on_conflict —— 更新冲突时自动 stash" }
