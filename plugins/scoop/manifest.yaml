          - { value: show_update_log, label: "show_update_log —— 是否显示 scoop update 的提交变更" }
          - { value: show_manifest, label: "show_manifest —— 安装前显示清单并询问" }
          - { value: shim, label: "shim —— shim 构建：kiennq / scoopcs / 71" }
