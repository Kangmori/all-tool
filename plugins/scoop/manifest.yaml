      - id: global
        label: 全局 shim
        type: bool
        style: flag
        prefix: "--global"
        default: false
        help: "等价于 -g。需要管理员权限。"
        doc: scoop help shim
    output:
      mode: stream
      showCommandLine: true

  # =================================================================== status
  - id: status
    nextSteps:
      # when 的正则是**对着真实输出验证过**的（2026-09-27，scoop 0.5.3）：
      # `scoop status --local` 打印的是表格，形如
      #     Name        Installed Version Latest Version   Missing Dependencies Info
      #     ffmpeg      9.0.1             9.0.2
      # 下面这条只命中"已装版本 + 最新版本"两列都有值的数据行（实测命中当时有更新的 5 行），
      # 不会命中表头与分隔行。最初凭印象写的 "Updates are available" 在真实输出里 0 命中——
      # 所以这里必须写经过实测的模式，不能靠猜。
      - title: 一键更新全部
        action: update
        when: '(?m)^\S+\s+\d\S*\s+\d'
        reason: 表格里有"已装版本 ≠ 最新版本"的应用
      - title: 清掉旧版本释放空间
        action: cleanup
        when: '(?m)^\S+\s+\d\S*\s+\d'
        reason: 更新之后通常会留下旧版本
      # 逐应用更新：把表格里每个「有可用更新」的应用各列一个按钮，点一下就把应用名填进 update 的 apps 字段。
      # 正则只取「行首应用名 + 至少两个空格 + 以数字开头的版本」，表头与分隔行都命不中；
      # 依据是本机 scoop 0.5.3 的真实输出（快照存本机专属库 snapshots/scoop-status/status.txt）。
      # 本规则**用了占位符 {1}**，所以按命中行数展开成多个按钮；
      # 上面「一键更新全部」没写占位符，因此只出一个按钮（避免出现好几个重复按钮）。
      - title: 更新 {1}
        action: update
        when: '(?m)^([A-Za-z0-9][\w.+-]*)\s+\d\S*\s+\d'
        values: { apps: "{1}" }
        reason: 只升级这一个应用
        maxOptions: 12
    category: 应用管理
    title: 状态检查
    description: "显示已安装应用的状态与可更新版本（scoop status）"
    command: status
    sources:
      - title: "scoop help status（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "用法：scoop status；-l, --local（只看本地已安装应用，不做远端抓取）。"
      - title: "Scoop wiki —— App Manifest Autoupdate（status 依赖本地 bucket 的新旧）"
        url: https://github.com/ScoopInstaller/Scoop/wiki/App-Manifest-Autoupdate
        retrieved: "2026-09-27"
        appliesTo: "wiki 快照 2026-09-27"
        note: "scoop status 是拿已装版本与本机 bucket/仓库副本比较；副本不新会给出过时的版本信息，建议先 scoop update。"
    fields:
      - id: local
        label: 只看本地
        type: bool
        style: flag
        prefix: "--local"
        default: true
        help: "等价于 -l：不做远端抓取。不勾选时 scoop 会对 scoop 自身与每个 bucket 执行 git fetch（会写入 .git 的远端跟踪引用）。"
        doc: scoop help status
    output:
      mode: capture
      showCommandLine: true
      resultNote: "不勾选 --local 时会先 git fetch scoop 与所有 bucket（网络 + 写 .git），所以默认勾选。"
    examples:
      - { title: "仅本地状态检查", args: ["status", "--local"], expectExitCode: 0 }

  # =================================================================== uninstall
  - id: uninstall
    category: 应用管理
    title: 卸载应用
    description: "卸载一个或多个应用（scoop uninstall）"
    command: uninstall
    danger: destructive
    confirmText: "将卸载应用并删除其安装目录与 shim；勾选 --purge 还会永久删除持久化数据（persist）。无法撤销。"
    sources:
      - title: "scoop help uninstall（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "用法：scoop uninstall <app> [options]；-g/--global、-p/--purge 出自此文件。"
      - title: "Scoop wiki —— Persistent data（-p/--purge 会删掉持久化数据）"
        url: https://github.com/ScoopInstaller/Scoop/wiki/Persistent-data
        retrieved: "2026-09-27"
        appliesTo: "wiki 快照 2026-09-27"
        note: "默认卸载会保留 ~/scoop/persist/<app>；scoop uninstall -p nodejs 才会把持久化数据一起删掉。"
      - title: "Scoop wiki —— Uninstalling Scoop（卸载 scoop 自身会二次确认）"
        url: https://github.com/ScoopInstaller/Scoop/wiki/Uninstalling-Scoop
        retrieved: "2026-09-27"
        appliesTo: "wiki 快照 2026-09-27"
        note: "scoop uninstall scoop 会先说明将要发生什么并等待输入 y 确认；本工具包不提供交互输入，请自行确认。"
    fields:
      - id: apps
        label: 应用
        type: multiselect
        style: positional
        required: true
        repeatable: true
        doc: scoop help uninstall
      - id: global
        label: 全局安装的应用
        type: bool
        style: flag
        prefix: "--global"
        default: false
        help: "等价于 -g。需要管理员权限。"
        doc: scoop help uninstall
      - id: purge
        label: 同时删除持久化数据
        type: bool
        style: flag
        prefix: "--purge"
        default: false
        help: "等价于 -p：把 persist 数据一起删掉（默认会保留）。"
        doc: scoop help uninstall
    output:
      mode: stream
      showCommandLine: true

  # =================================================================== update
  - id: update
    category: 应用管理
    title: 更新应用 / 更新 scoop
    description: "更新指定应用；不填应用时更新 scoop 自身（scoop update）"
    command: update
    danger: overwrite
    sources:
      - title: "scoop help update（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "用法：scoop update <app> [options]；-f、-g、-i、-k、-s、-q、-a/--all 均出自此文件；不带 <app> 时更新 scoop 自身。"
      - title: "Scoop wiki —— FAQ（更新全部应用用 *）"
        url: https://github.com/ScoopInstaller/Scoop/wiki/FAQ
        retrieved: "2026-09-27"
        appliesTo: "wiki 快照 2026-09-27"
        note: "scoop update 更新 scoop 与清单；scoop update * 更新全部应用。"
      - title: "Scoop wiki —— Global-Installs（--global 需要管理员）"
        url: https://github.com/ScoopInstaller/Scoop/wiki/Global-Installs
        retrieved: "2026-09-27"
        appliesTo: "wiki 快照 2026-09-27"
        note: "更新全局安装的应用同样需要管理员权限，例如 sudo scoop update git -g。"
    fields:
      - id: apps
        label: 应用
        type: multiselect
        style: positional
        repeatable: true
        placeholder: "留空 = 更新 scoop 自身"
        help: "文档：scoop update 更新 scoop；scoop update <app> 更新该应用；可用 * 表示全部应用（等价于 --all）。"
        doc: scoop help update
      - id: all
        label: 更新全部应用
        type: bool
        style: flag
        prefix: "--all"
        default: false
        help: "等价于 -a，也等价于文档里的 *。"
        doc: scoop help update
      - id: force
        label: 强制更新
        type: bool
        style: flag
        prefix: "--force"
        default: false
        help: "等价于 -f：即使没有更新版本也强制更新。"
        doc: scoop help update
      - id: quiet
        label: 安静模式
        type: bool
        style: flag
        prefix: "--quiet"
        default: false
        help: "等价于 -q：隐藏多余信息。"
        doc: scoop help update
      - id: global
        label: 全局安装的应用
        type: bool
        style: flag
        prefix: "--global"
        default: false
        group: 高级
        advanced: true
        help: "等价于 -g。需要管理员权限。"
        doc: scoop help update
      - id: independent
        label: 不自动安装依赖
        type: bool
        style: flag
        prefix: "--independent"
        default: false
        group: 高级
        advanced: true
        help: "等价于 -i。"
        doc: scoop help update
      - id: noCache
        label: 不使用下载缓存
        type: bool
        style: flag
        prefix: "--no-cache"
        default: false
        group: 高级
        advanced: true
        help: "等价于 -k。"
        doc: scoop help update
      - id: skipHashCheck
        label: 跳过哈希校验
        type: bool
        style: flag
        prefix: "--skip-hash-check"
        default: false
        group: 高级
        advanced: true
        help: "等价于 -s。文档原文：use with caution!"
        doc: scoop help update
    output:
      mode: stream
      showCommandLine: true

  # =================================================================== virustotal
  - id: virustotal
    category: 应用管理
    title: VirusTotal 查询
    description: "在 virustotal.com 上查询应用的哈希或下载 URL（scoop virustotal）。需要先配置 virustotal_api_key。"
    command: virustotal
    sources:
      - title: "scoop help virustotal（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "用法：scoop virustotal [* | app1 app2 ...] [options]；-a/-s/-n/-u/-p 与 Exit codes 一节均出自此文件。"
      - title: "Scoop wiki —— Quick Start（virustotal 会顺带更新 scoop）"
        url: https://github.com/ScoopInstaller/Scoop/wiki/Quick-Start
        retrieved: "2026-09-27"
        appliesTo: "wiki 快照 2026-09-27"
        note: "scoop virustotal 与 install / update / download 一样，会在必要时先更新 scoop 自身——这就是 -u/--no-update-scoop 的用途。"
    fields:
      - id: apps
        label: 应用
        type: multiselect
        style: positional
        repeatable: true
        placeholder: "应用名；用 --all 时可留空"
        help: "文档：单个 '*' 或 -a/--all 表示检查全部已安装应用。"
        doc: scoop help virustotal
      - id: all
        label: 检查全部已安装应用
        type: bool
        style: flag
        prefix: "--all"
        default: false
        doc: scoop help virustotal
      - id: scan
        label: 提交下载 URL 分析
        type: bool
        style: flag
        prefix: "--scan"
        default: false
        group: 高级
        advanced: true
        help: "VirusTotal 上没有信息的包，把下载 URL 送去分析（需要已配置 API key）。"
        doc: scoop help virustotal
      - id: noDepends
        label: 不检查依赖
        type: bool
        style: flag
        prefix: "--no-depends"
        default: false
        group: 高级
        advanced: true
        help: "默认会连依赖一起检查，勾选后只查指定的包。"
        doc: scoop help virustotal
      - id: noUpdateScoop
        label: 不先更新 scoop
        type: bool
        style: flag
        prefix: "--no-update-scoop"
        default: false
        group: 高级
        advanced: true
        doc: scoop help virustotal
    output:
      mode: stream
      showCommandLine: true
      resultNote: "会联网访问 virustotal.com，并可能先执行 scoop 自身更新；未配置 API key 时按文档应返回 16（本机未实跑）。"

  # =================================================================== which
  - id: which
    category: 定位与查看
    title: 定位程序
    description: "定位用 scoop 安装的 shim / 可执行文件路径（scoop which）"
    command: which
    sources:
      - title: "scoop help which（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "用法：scoop which <command>；Locate the path to a shim/executable that was installed with Scoop。"
      - title: "Scoop wiki —— SSH on Windows（用 which 判断实际生效的程序）"
        url: https://github.com/ScoopInstaller/Scoop/wiki/SSH-on-Windows
        retrieved: "2026-09-27"
        appliesTo: "wiki 快照 2026-09-27"
        note: "可以用 scoop which ssh 看当前生效的是系统自带还是 scoop 装的 ssh。"
    fields:
      - id: command
        label: 命令名
        type: text
        style: positional
        required: true
        placeholder: "例如 7z / ssh"
        doc: scoop help which
    output:
      mode: capture
      showCommandLine: true
    examples:
      - { title: "定位 7z", args: ["which", "7z"], expectExitCode: 0 }
