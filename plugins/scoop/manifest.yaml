    sources:
      - title: "scoop help shim（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "用法：scoop shim add <shim_name> <command_path> [<args>...]；另有 -g/--global 与关于 '--' 终止符的 HINT。"
    fields:
      - id: shimName
        label: Shim 名
