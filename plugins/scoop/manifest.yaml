  # =================================================================== import
  - id: import
    category: 导入导出
    title: 导入安装清单
    description: "按 scoopfile.json 复刻安装：设置配置、添加 bucket、安装应用（scoop import）"
    command: import
    danger: overwrite
    sources:
      - title: "scoop help import（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "用法：scoop import <path/url to scoopfile.json>；Imports apps, buckets and configs。"
      - title: "Scoop wiki —— Uninstalling Scoop（scoopfile 的来历）"
        url: https://github.com/ScoopInstaller/Scoop/wiki/Uninstalling-Scoop
        retrieved: "2026-09-27"
        appliesTo: "wiki 快照 2026-09-27"
        note: "scoop uninstall scoop 会告知将要做什么并等待确认；import 是其反向操作，用来复刻整套安装。"
    fields:
      - id: scoopfile
        label: Scoopfile
        type: file
        style: positional
        required: true
        accept: [.json]
        placeholder: "Desktop\\scoopfile.json 或 https://…/scoopfile.json"
        help: "会覆盖同名配置项、添加缺失的 bucket，并安装清单里的应用。"
        doc: scoop help import
    output:
      mode: stream
      showCommandLine: true

  # =================================================================== info
  - id: info
    category: 应用管理
    title: 应用信息
    description: "显示应用的信息（已装版本、来源、官网、bin、快捷方式等）（scoop info）"
    command: info
    sources:
      - title: "scoop help info（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "用法：scoop info <app> [options]；-v, --verbose（Show full paths and URLs）。"
      - title: "Scoop wiki —— FAQ（info 能看到同一应用的多个已装版本）"
        url: https://github.com/ScoopInstaller/Scoop/wiki/FAQ
        retrieved: "2026-09-27"
        appliesTo: "wiki 快照 2026-09-27"
        note: "scoop list 只显示最新版本；scoop info <app> 才能看到该应用安装过的全部版本。"
    fields:
      - id: app
        label: 应用
        type: text
        style: positional
        required: true
        placeholder: "例如 7zip"
        doc: scoop help info
      - id: verbose
        label: 显示完整路径与 URL
        type: bool
        style: flag
        prefix: "--verbose"
        default: false
        help: "等价于 -v。实测：该模式下 scoop 会顺带统计目录大小，遇到损坏的链接会把 PowerShell 错误记录写到 stderr。"
        doc: scoop help info
    output:
      mode: capture
      showCommandLine: true
      resultNote: "实测 scoop info <app> --verbose 可能向 stderr 输出 PowerShell 错误记录（本机是 7zip 的 persist 链接损坏）；两路输出都要展示。"
    examples:
      - { title: "查看 7zip 的信息", args: ["info", "7zip"], expectExitCode: 0 }

  # =================================================================== install
  - id: install
    category: 应用管理
    title: 安装应用
    description: "安装一个或多个应用（scoop install）"
    command: install
    danger: overwrite
    sources:
      - title: "scoop help install（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "用法：scoop install <app> [options]；-g、-i、-k、-s、-u、-a/--arch 均出自此文件；四种 app 写法（名字、名字@版本、清单 URL、本地 json）也出自此文件。"
      - title: "Scoop wiki —— Global-Installs（-g/--global 需要管理员）"
        url: https://github.com/ScoopInstaller/Scoop/wiki/Global-Installs
        retrieved: "2026-09-27"
        appliesTo: "wiki 快照 2026-09-27"
        note: "Global installs require admin permissions，因为安装到 %ProgramData%\\scoop 并设置系统环境变量。"
      - title: "Scoop wiki —— FAQ（安装指定版本）"
        url: https://github.com/ScoopInstaller/Scoop/wiki/FAQ
        retrieved: "2026-09-27"
        appliesTo: "wiki 快照 2026-09-27"
        note: "scoop install [app]@[version]，例如 scoop install git@2.23.0.windows.1；同一应用可以并存多个版本。"
    fields:
      - id: apps
        label: 应用
        type: multiselect
        style: positional
        required: true
        repeatable: true
        placeholder: "git / gh@2.7.0 / https://…/runat.json / D:\\path\\app.json"
        help: "文档给出的四种写法都支持；安装指定版本用 应用@版本。"
        doc: scoop help install
      - id: arch
        label: 架构
        type: enum
        style: separate
        prefix: "--arch"
        help: "等价于 -a <32bit|64bit|arm64>。"
        doc: scoop help install
        values:
          - { value: "", label: "默认（按系统与 default_architecture）", isDefault: true }
          - { value: 32bit, label: "32bit" }
          - { value: 64bit, label: "64bit" }
          - { value: arm64, label: "arm64" }
      - id: global
        label: 全局安装
        type: bool
        style: flag
        prefix: "--global"
        default: false
        help: "等价于 -g。需要管理员权限；本机当前用户不是管理员，勾选会失败。"
        doc: scoop help install
      - id: independent
        label: 不自动安装依赖
        type: bool
        style: flag
        prefix: "--independent"
        default: false
        group: 高级
        advanced: true
        help: "等价于 -i。"
        doc: scoop help install
      - id: noCache
        label: 不使用下载缓存
        type: bool
        style: flag
        prefix: "--no-cache"
        default: false
        group: 高级
        advanced: true
        help: "等价于 -k。"
        doc: scoop help install
      - id: skipHashCheck
        label: 跳过哈希校验
        type: bool
        style: flag
        prefix: "--skip-hash-check"
        default: false
        group: 高级
        advanced: true
        help: "等价于 -s。文档原文：use with caution!"
        doc: scoop help install
      - id: noUpdateScoop
        label: 不先更新 scoop
        type: bool
        style: flag
        prefix: "--no-update-scoop"
        default: false
        group: 高级
        advanced: true
        help: "等价于 -u。"
        doc: scoop help install
    output:
      mode: stream
      showCommandLine: true

  # =================================================================== list
  - id: list
    nextSteps:
      - title: 看看有没有可用更新
        action: status
        reason: 先查状态，再决定要不要更新
    category: 应用管理
    title: 已安装列表
    description: "列出已安装的应用，可按查询词过滤（scoop list）"
    command: list
    sources:
      - title: "scoop help list（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "用法：scoop list [query]；Lists all installed apps, or the apps matching the supplied query。"
      - title: "Scoop wiki —— FAQ（list 只显示最新版本）"
        url: https://github.com/ScoopInstaller/Scoop/wiki/FAQ
        retrieved: "2026-09-27"
        appliesTo: "wiki 快照 2026-09-27"
        note: "scoop list 显示的是最新安装的版本，不是全部版本。"
    fields:
      - id: query
        label: 查询词
        type: text
        style: positional
        placeholder: "留空 = 全部"
        doc: scoop help list
    output:
      mode: capture
      showCommandLine: true
    examples:
      - { title: "列出全部已安装应用", args: ["list"], expectExitCode: 0 }

  # =================================================================== prefix
  - id: prefix
    category: 定位与查看
    title: 应用安装路径
    description: "返回应用的安装路径（scoop prefix）"
    command: prefix
    sources:
      - title: "scoop help prefix（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "用法：scoop prefix <app>；Returns the path to the specified app。"
      - title: "Scoop wiki —— The 'Current' Version Alias（路径是 current 别名）"
        url: https://github.com/ScoopInstaller/Scoop/wiki/The-'Current'-Version-Alias
        retrieved: "2026-09-27"
        appliesTo: "wiki 快照 2026-09-27"
        note: "应用目录下的 current 是指向当前版本的目录联接（junction）。"
    fields:
      - id: app
        label: 应用
        type: text
        style: positional
        required: true
        placeholder: "例如 7zip"
        doc: scoop help prefix
    output:
      mode: capture
      showCommandLine: true
    examples:
      - { title: "查看 7zip 的安装路径", args: ["prefix", "7zip"], expectExitCode: 0 }

  # =================================================================== reset
  - id: reset
    category: 应用管理
    title: 重置（切换版本）
    description: "把某个应用重新设为激活版本，解决 shim / 环境变量冲突（scoop reset）"
    command: reset
    danger: overwrite
    sources:
      - title: "scoop help reset（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "用法：scoop reset <app>；可用 '*' 或 -a/--all 重置全部。"
      - title: "Scoop wiki —— FAQ（用 reset 切换已安装版本）"
        url: https://github.com/ScoopInstaller/Scoop/wiki/FAQ
        retrieved: "2026-09-27"
        appliesTo: "wiki 快照 2026-09-27"
        note: "scoop reset [app]@[version] 切换激活版本，且只在已安装的版本之间切换；不带版本则以最新已装版本为准。"
    fields:
      - id: apps
        label: 应用（可带 @版本）
        type: multiselect
        style: positional
        repeatable: true
        placeholder: "terraform / terraform@0.11.14"
        help: "文档给的形式：scoop reset [app]@[version]；不带版本时用最新已安装版本。"
        doc: scoop help reset
      - id: all
        label: 重置全部应用
        type: bool
        style: flag
        prefix: "--all"
        default: false
        help: "等价于文档里的 scoop reset *。"
        doc: scoop help reset
    output:
      mode: stream
      showCommandLine: true

  # =================================================================== search
  - id: search
    category: 应用管理
    title: 搜索应用
    description: "在本地 bucket 里搜索可安装的应用（scoop search）"
    command: search
    sources:
      - title: "scoop help search（本机 0.5.3 的结构化帮助输出）"
        url: https://github.com/ScoopInstaller/Scoop/wiki
        retrieved: "2026-09-27"
        appliesTo: "0.5.3"
        note: "用法：scoop search <query>；不带 query 时列出全部可用应用；query 的匹配规则取决于 use_sqlite_cache（见文件里两行说明）。"
      - title: "Scoop wiki —— Quick Start（按命令名搜索）"
        url: https://github.com/ScoopInstaller/Scoop/wiki/Quick-Start
        retrieved: "2026-09-27"
        appliesTo: "wiki 快照 2026-09-27"
        note: "scoop search ssh → openssh；scoop search hg → mercurial（可以按应用包含的命令名搜到）。"
    fields:
      - id: query
        label: 查询词
        type: text
        style: positional
        placeholder: "应用名或命令名；留空 = 全部"
        help: "开启 use_sqlite_cache 时按应用名/二进制名/快捷方式做部分匹配；未开启时 query 按正则匹配应用名与二进制名。"
        doc: scoop help search
    output:
      mode: capture
      showCommandLine: true
    examples:
      - { title: "搜索 git", args: ["search", "git"], expectExitCode: 0 }
      - { title: "按命令名 hg 搜索", args: ["search", "hg"], expectExitCode: 0 }

