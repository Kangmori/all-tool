      官方与帮助都注明 /i **必须是第一个选项**、且指定它之后**其它选项全部被忽略**。
      本包按红线把它也标成 execution: info（宿主只显示命令，不打开界面）。
      真正的关机动作在那个对话框里，风险也由你当场判断。
    command: ""
    commandArgs: ["/i"]
    execution: info
    fields: []
    output:
      mode: stream
      showCommandLine: true
    sources:
      - title: shutdown 官方参考 —— /i
        url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/shutdown
        retrieved: "2026-10-01"
        appliesTo: Windows 10 / 11
        note: >-
          官方原文：/i "Displays the Remote Shutdown box. The /i option must be the first parameter
          following the command. If /i is specified, all other options are ignored."。
      - title: 本机 `shutdown /?` 的真实输出
        url: file:///%SystemRoot%/System32/shutdown.exe
        retrieved: "2026-10-01"
        appliesTo: Windows 11 26200 / shutdown.exe 10.0.26100.8875
        note: 本机帮助原文：/i「显示图形用户界面(GUI)。这必须是第一个选项。」——与官方页一致。
